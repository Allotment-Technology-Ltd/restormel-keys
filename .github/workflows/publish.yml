# Publish @restormel/keys to npm on tag keys-v* (e.g. keys-v0.1.0).
# pnpm version must match root package.json "packageManager" (9.0.0).
# Provenance is omitted: npm only accepts provenance for public GitHub repos (private repo = 422).
name: Publish
on:
  push:
    tags:
      - 'keys-v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @restormel/keys test
      - name: Build
        run: pnpm --filter @restormel/keys run build
      - name: Publish to npm
        working-directory: packages/core
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
