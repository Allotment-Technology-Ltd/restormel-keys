name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
      slug: ${{ steps.slug.outputs.branch_slug }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8
      - name: Slugify branch name for Neon
        id: slug
        run: |
          raw="${{ steps.branch_name.outputs.current_branch }}"
          # Neon branch names are strict: lowercase alnum/hyphen and max length (40 chars total in this project policy).
          # Reserve space for prefix "preview-pr-<pr-number>-", and trim slug to fit.
          prefix="preview-pr-${{ github.event.number }}-"
          max_total=40
          max_slug=$((max_total - ${#prefix}))
          if [ "$max_slug" -lt 6 ]; then
            max_slug=6
          fi
          slug="$(echo "$raw" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//; s/-$//' | cut -c1-"$max_slug")"
          if [ -z "$slug" ]; then
            slug="branch"
          fi
          echo "branch_slug=$slug" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          # Neon branch names cannot include "/" and must stay within provider limits.
          branch_name: preview-pr-${{ github.event.number }}-${{ needs.setup.outputs.slug }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview-pr-${{ github.event.number }}-${{ needs.setup.outputs.slug }}
          api_key: ${{ secrets.NEON_API_KEY }}
