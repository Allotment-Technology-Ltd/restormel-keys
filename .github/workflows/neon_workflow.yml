# Neon preview branch naming:
# - Primary: preview/<github.head_ref> (matches Vercel + Neon Git integration and existing branches).
# - Legacy fallback: preview-pr-<number> (older runs of this workflow).
name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v9

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event_name == 'pull_request' && (
      github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        continue-on-error: true
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

  apply_dashboard_migrations:
    name: Apply dashboard migrations (preview DB)
    needs: setup
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # neonctl v2 requires Node >= 22.
          node-version: '22'
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Resolve DATABASE_URL for Neon preview branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          HEAD_PREVIEW: preview/${{ github.head_ref }}
          LEGACY_PREVIEW: preview-pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          # neonctl prints a connection string including password.
          resolve() {
            npx --yes neonctl@v2 connection-string "$1" \
              --project-id "$NEON_PROJECT_ID" \
              --database-name neondb \
              --role-name neondb_owner 2>/dev/null
          }
          set +e
          DATABASE_URL="$(resolve "$HEAD_PREVIEW")"
          rc=$?
          if [[ $rc -ne 0 || -z "$DATABASE_URL" ]]; then
            echo "No branch '$HEAD_PREVIEW', trying legacy '$LEGACY_PREVIEW'"
            DATABASE_URL="$(resolve "$LEGACY_PREVIEW")"
            rc=$?
            if [[ $rc -eq 0 && -n "$DATABASE_URL" ]]; then
              echo "Using Neon branch: $LEGACY_PREVIEW"
            fi
          else
            echo "Using Neon branch: $HEAD_PREVIEW"
          fi
          set -e
          if [[ $rc -ne 0 || -z "$DATABASE_URL" ]]; then
            echo "Failed to resolve DATABASE_URL (tried $HEAD_PREVIEW and $LEGACY_PREVIEW)"
            exit 1
          fi
          if [[ "$DATABASE_URL" != postgres* ]]; then
            echo "Unexpected connection-string output"
            exit 1
          fi
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
        # npx uses NEON_API_KEY automatically if present.
      - name: Apply dashboard migrations
        run: bash scripts/apply-dashboard-migrations.sh

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch (preview/<head_ref>)
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Delete Neon Branch (legacy preview-pr-<n>)
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview-pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
