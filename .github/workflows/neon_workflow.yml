# Neon preview branch naming:
# - Primary: preview/<github.head_ref> (often aligns with Vercel + Neon Git integration when both are enabled).
# - Fallback: preview-pr-<number> (used when head_ref branch is missing or create fails).
# - Dependabot PRs are skipped here (actor filter); Vercel may still create preview/* branches for those PRs — see
#   docs/runbooks/dashboard-postgres-migrations.md (Neon compute: preview branches and cost).
# - If the Neon project hits its branch limit, preview migrations + catalog seed are skipped (job succeeds);
#   delete stale preview/* branches or run "Prune stale Neon preview branches", or upgrade the Neon plan.
name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5

  create_neon_branch:
    name: Create Neon Branch
    needs: setup
    if: |
      github.actor != 'dependabot[bot]' &&
      github.event_name == 'pull_request' && (
      github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        continue-on-error: true
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

  apply_dashboard_migrations:
    name: Apply dashboard migrations (preview DB)
    needs: setup
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # neonctl v2 requires Node >= 22.
          node-version: '22'
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Create + resolve in one step: head_ref-based names sometimes fail to create (API/plan);
      # we verify with branches list and fall back to preview-pr-<n> before resolving DATABASE_URL.
      - name: Prepare Neon preview branch and DATABASE_URL
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          HEAD_PREVIEW: preview/${{ github.head_ref }}
          PR_PREVIEW: preview-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')

          list_json() {
            npx --yes neonctl@v2 branches list --project-id "$NEON_PROJECT_ID" -o json
          }

          branch_exists() {
            export WANT="$1"
            list_json | node -e "
              const want = process.env.WANT;
              const j = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const arr = Array.isArray(j) ? j : [];
              process.exit(arr.some((b) => b.name === want) ? 0 : 1);
            "
          }

          BRANCH_LIMIT_HIT=0
          try_create() {
            local name="$1"
            echo ">>> neonctl branches create --name $name ..."
            set +e
            local out rc
            out=$(npx --yes neonctl@v2 branches create \
              --name "$name" \
              --project-id "$NEON_PROJECT_ID" \
              --expires-at "$EXPIRES_AT" 2>&1)
            rc=$?
            set -e
            echo "$out"
            if echo "$out" | grep -qiE 'branches limit exceeded|branch limit exceeded'; then
              BRANCH_LIMIT_HIT=1
            fi
            return "$rc"
          }

          CHOSEN=""
          if branch_exists "$HEAD_PREVIEW"; then
            CHOSEN="$HEAD_PREVIEW"
            echo "Neon branch already present: $CHOSEN"
          else
            try_create "$HEAD_PREVIEW" || true
            if branch_exists "$HEAD_PREVIEW"; then
              CHOSEN="$HEAD_PREVIEW"
            fi
          fi

          if [[ -z "$CHOSEN" ]]; then
            echo "Primary preview branch missing; trying $PR_PREVIEW"
            if branch_exists "$PR_PREVIEW"; then
              CHOSEN="$PR_PREVIEW"
            else
              try_create "$PR_PREVIEW" || true
              if branch_exists "$PR_PREVIEW"; then
                CHOSEN="$PR_PREVIEW"
              fi
            fi
          fi

          if [[ -z "$CHOSEN" ]]; then
            if [[ "$BRANCH_LIMIT_HIT" == "1" ]]; then
              echo "::warning title=Neon branch limit::This Neon project has reached its branch limit, so preview DB migrations and catalog seed were skipped. Remove stale preview branches in the Neon console, run the **Prune stale Neon preview branches** workflow, or increase the limit on your Neon plan."
              echo "SKIP_PREVIEW_DB=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "ERROR: Could not create or find preview branch (tried $HEAD_PREVIEW and $PR_PREVIEW)."
            list_json | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); (Array.isArray(j)?j:[]).forEach((b)=>console.log(b.name));" || true
            exit 1
          fi

          echo "SKIP_PREVIEW_DB=0" >> "$GITHUB_ENV"
          echo "Using Neon preview branch: $CHOSEN"
          echo "NEON_PREVIEW_BRANCH=$CHOSEN" >> "$GITHUB_ENV"

          pick_uri() {
            echo "$1" | grep -E '^postgresql://' | head -1 | tr -d '\r' || true
          }
          DATABASE_URL=""
          for attempt in $(seq 1 30); do
            raw=$(npx --yes neonctl@v2 connection-string "$CHOSEN" \
              --project-id "$NEON_PROJECT_ID" 2>&1 || true)
            DATABASE_URL=$(pick_uri "$raw")
            if [[ -n "$DATABASE_URL" ]]; then
              echo "Resolved DATABASE_URL (attempt $attempt)"
              break
            fi
            if [[ "$attempt" == "1" || "$attempt" == "8" || "$attempt" == "16" ]]; then
              echo "Still resolving connection string (attempt $attempt). First 400 chars (errors only, no URI):"
              echo "$raw" | head -c 400
              echo
            fi
            sleep 5
          done

          if [[ -z "$DATABASE_URL" ]]; then
            echo "Failed to obtain connection string for $CHOSEN"
            exit 1
          fi

          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
        # npx uses NEON_API_KEY automatically if present.
      - name: Apply dashboard migrations
        if: env.SKIP_PREVIEW_DB != '1'
        run: bash scripts/apply-dashboard-migrations.sh
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e
        if: env.SKIP_PREVIEW_DB != '1'
        with:
          version: 9.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: env.SKIP_PREVIEW_DB != '1'
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install workspace (dashboard catalog seed)
        if: env.SKIP_PREVIEW_DB != '1'
        run: pnpm install --frozen-lockfile
      - name: Ingest model catalog from JSON seed (preview DB)
        if: env.SKIP_PREVIEW_DB != '1'
        run: pnpm --filter dashboard run seed:catalog

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch (preview/<head_ref>)
        continue-on-error: true
        uses: neondatabase/delete-branch-action@c2005bb7d7caeba12ba3ec63857e9c9f9a4d695a
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Delete Neon Branch (legacy preview-pr-<n>)
        continue-on-error: true
        uses: neondatabase/delete-branch-action@c2005bb7d7caeba12ba3ec63857e9c9f9a4d695a
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview-pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
