# Publish @restormel/graph-core and @restormel/ui-graph-svelte to npm on tag graph-v* (e.g. graph-v0.1.0).
# Order: graph-core first, then ui-graph-svelte (pnpm rewrites workspace:* on graph-core to semver).
# Same registry/org pattern as Keys (`@restormel/*`). Requires NPM_TOKEN.
# pnpm version must match root package.json "packageManager" (9.0.0).
name: Publish Graph packages
on:
  push:
    tags:
      - "graph-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run publish --dry-run only (no npm upload)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish-graph-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GRAPH_PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: PNPM install
        uses: ./.github/actions/pnpm-workspace-install

      - name: Test + build graph packages
        run: |
          pnpm --filter @restormel/graph-core test
          pnpm --filter @restormel/graph-core run build
          pnpm --filter @restormel/ui-graph-svelte run build

      - name: Tarball consumer smoke (graph demo)
        run: bash scripts/smoke-graph-packages-consumer.sh

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set."
            exit 1
          fi
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          EXTRA=""
          if [ "${GRAPH_PUBLISH_DRY_RUN}" = "true" ]; then
            EXTRA="--dry-run"
            echo "Dry run only."
          fi
          pnpm --filter @restormel/graph-core publish --access public --no-git-checks ${EXTRA}
          pnpm --filter @restormel/ui-graph-svelte publish --access public --no-git-checks ${EXTRA}
