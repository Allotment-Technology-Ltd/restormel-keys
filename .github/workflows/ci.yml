# Single CI/CD workflow: path-filter, docs, security, test, demo-next, and deploy-site-worker (Cloudflare). Dashboard deploys via Vercel on push to main.
# One workflow run per push/PR; jobs skip when their paths unchanged.
# pnpm version must match root package.json "packageManager" (9.0.0).
name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Run deploy job (build image, push to Artifact Registry, deploy to Cloud Run)'
        type: boolean
        default: true
      run_deploy_site_worker:
        description: 'Run deploy-site-worker job (build site, inject KEYS_DASHBOARD_URL, wrangler deploy)'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      repo: ${{ steps.filter.outputs.repo }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'apps/**'
              - 'examples/**'
            docs:
              - 'docs/**'
              - 'Docs/**'
              - 'README.md'
              - 'ROADMAP.md'
              - 'STATUS.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'ARCHITECTURE.md'
            repo:
              - 'scripts/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
            deploy:
              - 'apps/**'
              - 'infra/**'
              - 'Dockerfile.dashboard'
              - 'Dockerfile.site'
              - '.dockerignore'

  bootstrap-checks:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.repo == 'true' || needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - name: check-repo-hygiene.sh
        run: bash scripts/check-repo-hygiene.sh
      - name: review-docs.sh
        run: bash scripts/review-docs.sh
      - name: check-secrets.sh
        run: bash scripts/check-secrets.sh
      - name: check-dependency-policy.sh
        run: bash scripts/check-dependency-policy.sh

  docs-check:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - name: Review docs
        run: bash scripts/review-docs.sh
      - name: Docs update checklist
        run: bash scripts/docs-update-checklist.sh

  security:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.repo == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          args: --only-verified
      - name: pnpm audit
        run: pnpm audit --audit-level moderate
      - name: Type check
        run: pnpm --filter @restormel/keys typecheck

  test:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @restormel/keys test

  demo-next:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build workspace (keys, svelte, elements, react) for demo-next
        run: |
          pnpm --filter @restormel/keys run build
          pnpm --filter @restormel/keys-svelte run build
          pnpm --filter @restormel/keys-elements run build
          pnpm --filter @restormel/keys-react run build
      - name: Build demo-next
        run: pnpm --filter demo-next run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/demo-next
      - name: E2E tests
        run: pnpm run test:e2e
        working-directory: apps/demo-next

  # Deploy site Worker with KEYS_DASHBOARD_URL injected so the var survives (not wiped by Git-based deploys).
  # Requires: KEYS_DASHBOARD_URL, CLOUDFLARE_API_TOKEN in repo secrets. If you use this job, consider
  # disabling Cloudflare Git deployment for restormel-site so only this workflow deploys the Worker.
  deploy-site-worker:
    runs-on: ubuntu-latest
    if: >
      (needs.changes.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deploy_site_worker == 'true')
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm --filter site build
      - name: Inject KEYS_DASHBOARD_URL into wrangler.toml
        working-directory: apps/site
        env:
          KEYS_DASHBOARD_URL: ${{ secrets.KEYS_DASHBOARD_URL }}
        run: |
          if [ -z "$KEYS_DASHBOARD_URL" ]; then
            echo "::warning::KEYS_DASHBOARD_URL not set; skipping Worker deploy. Add it and CLOUDFLARE_API_TOKEN to repo secrets to deploy from CI."
            exit 0
          fi
          python3 -c "
          import os
          p = 'wrangler.toml'
          with open(p) as f: c = f.read()
          v = os.environ.get('KEYS_DASHBOARD_URL', '')
          block = '\n# Injected by CI\n[vars]\nKEYS_DASHBOARD_URL = \"' + v.replace('\"', '\\\\\"') + '\"\n\n'
          c = c.replace('\n[assets]', block + '[assets]')
          with open(p, 'w') as f: f.write(c)
          "
      - name: Deploy Worker
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set; skipping Worker deploy."
            exit 0
          fi
          npx wrangler deploy
