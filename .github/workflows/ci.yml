# Single CI/CD workflow: path-filter, docs, security, test, demo-next, infra preview, and deploy (GCP).
# One workflow run per push/PR; jobs skip when their paths unchanged.
# pnpm version must match root package.json "packageManager" (9.0.0).
name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Run deploy job (build image, push to Artifact Registry, deploy to Cloud Run)'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      repo: ${{ steps.filter.outputs.repo }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'apps/**'
              - 'examples/**'
            docs:
              - 'docs/**'
              - 'Docs/**'
              - 'README.md'
              - 'ROADMAP.md'
              - 'STATUS.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'ARCHITECTURE.md'
            repo:
              - 'scripts/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
            deploy:
              - 'apps/**'
              - 'infra/**'
              - 'Dockerfile.site'
              - '.dockerignore'

  bootstrap-checks:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.repo == 'true' || needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - name: check-repo-hygiene.sh
        run: bash scripts/check-repo-hygiene.sh
      - name: review-docs.sh
        run: bash scripts/review-docs.sh
      - name: check-secrets.sh
        run: bash scripts/check-secrets.sh
      - name: check-dependency-policy.sh
        run: bash scripts/check-dependency-policy.sh

  docs-check:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - name: Review docs
        run: bash scripts/review-docs.sh
      - name: Docs update checklist
        run: bash scripts/docs-update-checklist.sh

  security:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.repo == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
      - name: pnpm audit
        run: pnpm audit --audit-level moderate
      - name: Type check
        run: pnpm --filter @restormel/keys typecheck

  test:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @restormel/keys test

  demo-next:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build workspace (keys, svelte, elements, react) for demo-next
        run: |
          pnpm --filter @restormel/keys run build
          pnpm --filter @restormel/keys-svelte run build
          pnpm --filter @restormel/keys-elements run build
          pnpm --filter @restormel/keys-react run build
      - name: Build demo-next
        run: pnpm --filter demo-next run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/demo-next
      - name: E2E tests
        run: pnpm run test:e2e
        working-directory: apps/demo-next

  # GCP infra/deploy: skip on fork PRs and Dependabot (secrets not passed).
  infra-preview:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.deploy == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: [changes]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list
      - name: Infra preview
        run: |
          if [ -d infra ]; then
            echo "Run 'pulumi preview' locally or enable Pulumi in CI (PULUMI_ACCESS_TOKEN, stack) to preview infra changes."
          else
            echo "No infra directory yet"
          fi

  infra-apply:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list
      - name: Infra apply
        run: |
          if [ -d infra ]; then
            echo "Run 'pulumi up' locally when infra changes. Deploy job below pushes site image and deploys to existing Cloud Run service."
          else
            echo "No infra directory yet"
          fi

  deploy:
    runs-on: ubuntu-latest
    if: (needs.changes.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deploy != 'false')
    needs: [changes]
    permissions:
      contents: read
      id-token: write
    env:
      REGION: europe-west2
      IMAGE_NAME: europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/restormel-keys/site
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet
      - name: Diagnose GCP Artifact Registry
        run: |
          echo "Active account:"
          gcloud auth list
          echo "Artifact Registry repo (must exist; deploy identity needs roles/artifactregistry.writer):"
          gcloud artifacts repositories describe restormel-keys --location=europe-west2 --project="${{ secrets.GCP_PROJECT_ID }}" || echo "Repo missing or no permission to describe — create with 'pulumi up' in infra/ and grant deploy SA roles/artifactregistry.writer"
      - name: Build site image
        run: |
          docker build -f Dockerfile.site -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
      - name: Push site image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy keys-dashboard \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet
      - name: Deploy failed — fix Artifact Registry / Cloud Run permissions
        if: failure()
        run: |
          echo "::error::Push or deploy failed. The deploy identity needs Artifact Registry Writer, Cloud Run Admin, and Service Account User on keys-dashboard-sa."
          echo "---"
          echo "If this failed with 'iam.serviceaccounts.actAs denied on keys-dashboard-sa', run this once (use the SA from 'Diagnose GCP Artifact Registry' if different):"
          echo ""
          echo "  gcloud iam service-accounts add-iam-policy-binding keys-dashboard-sa@restormel-keys-prod.iam.gserviceaccount.com \\"
          echo "    --project=restormel-keys-prod \\"
          echo "    --member=\"serviceAccount:github-deploy@restormel-keys-prod.iam.gserviceaccount.com\" \\"
          echo "    --role=\"roles/iam.serviceAccountUser\""
          echo ""
          echo "Then re-run this workflow. See docs/domain-mapping-restormel-dev.md §9 for full steps."
