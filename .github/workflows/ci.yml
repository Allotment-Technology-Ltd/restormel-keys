# Single CI/CD workflow: path-filter, docs, security, test, demo-next. Site and dashboard deploy via Vercel (no Cloudflare).
# One workflow run per push/PR; jobs skip when their paths unchanged.
# pnpm version must match root package.json "packageManager" (9.0.0).
name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Run deploy-related checks (deploy is via Vercel)'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      repo: ${{ steps.filter.outputs.repo }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'apps/**'
              - 'examples/**'
            docs:
              - 'docs/**'
              - 'Docs/**'
              - 'README.md'
              - 'ROADMAP.md'
              - 'STATUS.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'ARCHITECTURE.md'
            repo:
              - 'scripts/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
            deploy:
              - 'apps/**'
              - 'infra/**'
              - 'Dockerfile.dashboard'
              - 'Dockerfile.site'
              - '.dockerignore'

  bootstrap-checks:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.repo == 'true' || needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - name: check-repo-hygiene.sh
        run: bash scripts/check-repo-hygiene.sh
      - name: review-docs.sh
        run: bash scripts/review-docs.sh
      - name: check-secrets.sh
        run: bash scripts/check-secrets.sh
      - name: check-dependency-policy.sh
        run: bash scripts/check-dependency-policy.sh

  docs-check:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - name: Review docs
        run: bash scripts/review-docs.sh
      - name: Docs update checklist
        run: bash scripts/docs-update-checklist.sh

  security:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.repo == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
      - name: pnpm audit
        run: pnpm audit --audit-level critical
      - name: Type check
        run: pnpm --filter @restormel/keys typecheck

  test:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @restormel/keys test
      - name: Build workspace (keys, keys-svelte) for dashboard
        run: |
          pnpm --filter @restormel/keys run build
          pnpm --filter @restormel/keys-svelte run build
      - name: Dashboard check (svelte-check)
        run: pnpm --filter dashboard run check
      - name: Dashboard build
        run: pnpm --filter dashboard run build
      - name: Dashboard tests
        run: pnpm --filter dashboard run test

  demo-next:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build workspace (keys, svelte, elements, react) for demo-next
        run: |
          pnpm --filter @restormel/keys run build
          pnpm --filter @restormel/keys-svelte run build
          pnpm --filter @restormel/keys-elements run build
          pnpm --filter @restormel/keys-react run build
      - name: Build demo-next
        run: pnpm --filter demo-next run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/demo-next
      - name: E2E tests
        run: pnpm run test:e2e
        working-directory: apps/demo-next
