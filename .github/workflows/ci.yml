# Single CI/CD workflow: path-filter, docs, security, test, demo-next. Site and dashboard deploy via Vercel (no Cloudflare).
# One workflow run per push/PR; jobs skip when their paths unchanged.
# pnpm version must match root package.json "packageManager" (9.0.0).
name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Run deploy-related checks (deploy is via Vercel)'
        type: boolean
        default: true
      run_db_migrations:
        description: 'Apply dashboard SQL migrations to production DB (requires secret)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      repo: ${{ steps.filter.outputs.repo }}
      deploy: ${{ steps.filter.outputs.deploy }}
      dashboard_migrations: ${{ steps.filter.outputs.dashboard_migrations }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'apps/**'
              - 'examples/**'
              - 'apps/dashboard/migrations/**'
            docs:
              - 'docs/**'
              - 'Docs/**'
              - 'README.md'
              - 'ROADMAP.md'
              - 'STATUS.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'ARCHITECTURE.md'
            repo:
              - 'scripts/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
            deploy:
              - 'apps/**'
              - 'infra/**'
              - 'Dockerfile.dashboard'
              - 'Dockerfile.site'
              - '.dockerignore'
            dashboard_migrations:
              - 'apps/dashboard/migrations/**'

  bootstrap-checks:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.repo == 'true' || needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - name: check-repo-hygiene.sh
        run: bash scripts/check-repo-hygiene.sh
      - name: review-docs.sh
        run: bash scripts/review-docs.sh
      - name: check-secrets.sh
        run: bash scripts/check-secrets.sh
      - name: check-dependency-policy.sh
        run: bash scripts/check-dependency-policy.sh

  docs-check:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - name: Review docs
        run: bash scripts/review-docs.sh
      - name: Docs update checklist
        run: bash scripts/docs-update-checklist.sh

  security:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.repo == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
      - name: pnpm audit
        run: pnpm audit --audit-level critical
      - name: Type check
        run: pnpm --filter @restormel/keys typecheck

  test:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm --filter @restormel/keys test
      - name: Catalog drift (defaultProviders vs dashboard seed)
        run: pnpm run check:catalog-drift
      - name: Test @restormel/aaif
        run: pnpm --filter @restormel/aaif run test
      - name: Build workspace (keys, aaif, mcp, keys-svelte) for dashboard
        run: |
          pnpm --filter @restormel/keys run build
          pnpm --filter @restormel/aaif run build
          pnpm --filter @restormel/mcp run build
          pnpm --filter @restormel/keys-svelte run build
      - name: Dashboard check (svelte-check)
        run: pnpm --filter dashboard run check
      - name: Dashboard build
        run: pnpm --filter dashboard run build
      - name: Dashboard tests
        run: pnpm --filter dashboard run test

  keys-svelte-republish-smoke:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pack + demo-svelte build from tarballs
        run: bash scripts/smoke-keys-svelte-republish.sh

  demo-next:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build workspace (keys, svelte, elements, react) for demo-next
        run: |
          pnpm --filter @restormel/keys run build
          pnpm --filter @restormel/keys-svelte run build
          pnpm --filter @restormel/keys-elements run build
          pnpm --filter @restormel/keys-react run build
      - name: Build demo-next
        run: pnpm --filter demo-next run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/demo-next
      - name: E2E tests
        run: pnpm run test:e2e
        working-directory: apps/demo-next

  apply-dashboard-migrations-prod:
    name: Apply dashboard migrations (prod DB)
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.dashboard_migrations == 'true' || inputs.run_db_migrations == true)
    steps:
      - uses: actions/checkout@v6
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply dashboard migrations to production DB
        env:
          # Set this secret in repo settings: DATABASE_URL for the production Neon branch.
          DASHBOARD_DATABASE_URL_PROD: ${{ secrets.DASHBOARD_DATABASE_URL_PROD }}
        run: |
          set -euo pipefail
          if [[ -z "${DASHBOARD_DATABASE_URL_PROD:-}" ]]; then
            echo "Missing secret: DASHBOARD_DATABASE_URL_PROD"
            exit 1
          fi
          export DATABASE_URL="$DASHBOARD_DATABASE_URL_PROD"
          bash scripts/apply-dashboard-migrations.sh
