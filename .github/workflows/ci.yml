# Single CI/CD workflow: path-filter, docs, security, test. Site and dashboard deploy via Vercel (no Cloudflare).
# Next.js sample app: apps/demo-next — run build + E2E locally; not part of CI (keeps main pipeline fast).
# One workflow run per push/PR; jobs skip when their paths unchanged.
# pnpm version must match root package.json "packageManager" (9.0.0).
# PNPM install + JS security steps use composite actions under .github/actions/ (mirrored in platform/.github/actions/ for restormel-platform split).
name: CI/CD
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_deploy:
        description: 'Run deploy-related checks (deploy is via Vercel)'
        type: boolean
        default: true
      run_db_migrations:
        description: 'Apply dashboard SQL migrations to production DB (requires secret)'
        type: boolean
        default: false
      run_model_catalog_seed:
        description: 'Re-run model catalog JSON seed on production DB (requires DASHBOARD_DATABASE_URL_PROD)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      repo: ${{ steps.filter.outputs.repo }}
      deploy: ${{ steps.filter.outputs.deploy }}
      dashboard_migrations: ${{ steps.filter.outputs.dashboard_migrations }}
      model_catalog_seed: ${{ steps.filter.outputs.model_catalog_seed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            code:
              - 'packages/**'
              - 'platform/**'
              - 'apps/**'
              - 'examples/**'
              - 'apps/dashboard/migrations/**'
            docs:
              - 'docs/**'
              - 'Docs/**'
              - 'README.md'
              - 'ROADMAP.md'
              - 'STATUS.md'
              - 'CHANGELOG.md'
              - 'CONTRIBUTING.md'
              - 'ARCHITECTURE.md'
            repo:
              - 'scripts/**'
              - '.github/**'
              - 'platform/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
            deploy:
              - 'apps/**'
              - 'infra/**'
              - 'Dockerfile.dashboard'
              - 'Dockerfile.site'
              - '.dockerignore'
            dashboard_migrations:
              - 'apps/dashboard/migrations/**'
            model_catalog_seed:
              - 'apps/dashboard/data/model-catalog-seed.json'
              - 'apps/dashboard/scripts/ingest-model-catalog.mjs'

  bootstrap-checks:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.repo == 'true' || needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: check-repo-hygiene.sh
        run: bash scripts/check-repo-hygiene.sh
      - name: review-docs.sh
        run: bash scripts/review-docs.sh
      - name: check-secrets.sh
        run: bash scripts/check-secrets.sh
      - name: check-dependency-policy.sh
        run: bash scripts/check-dependency-policy.sh

  docs-check:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docs == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Review docs
        run: bash scripts/review-docs.sh
      - name: Docs update checklist
        run: bash scripts/docs-update-checklist.sh

  security:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.repo == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: PNPM install
        uses: ./.github/actions/pnpm-workspace-install
      - name: Security scan
        uses: ./.github/actions/js-security-scan
      - name: Type check
        run: pnpm --filter @restormel/keys typecheck

  test:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: PNPM install
        uses: ./.github/actions/pnpm-workspace-install
      - name: Test
        run: pnpm --filter @restormel/keys test
      - name: Catalog drift (defaultProviders vs dashboard seed)
        run: pnpm run check:catalog-drift
      - name: Test @restormel/aaif
        run: pnpm --filter @restormel/aaif run test
      - name: Build workspace (keys, keys-svelte, keys-elements, keys-react, aaif, mcp) for dashboard
        run: |
          pnpm --filter @restormel/keys run build
          pnpm --filter @restormel/keys-svelte run build
          pnpm --filter @restormel/keys-elements run build
          pnpm --filter @restormel/keys-react run build
          pnpm --filter @restormel/aaif run build
          pnpm --filter @restormel/mcp run build
      - name: Dashboard check (svelte-check)
        run: pnpm --filter dashboard run check
      - name: Dashboard build
        run: pnpm --filter dashboard run build
      - name: Testing dashboard docs routes (link graph)
        run: node scripts/check-testing-dashboard-doc-routes.mjs
      - name: Graph dashboard docs routes (link graph)
        run: node scripts/check-graph-dashboard-doc-routes.mjs
      - name: Dashboard tests
        run: pnpm --filter dashboard run test

      - name: Restormel Graph (tests + tarball consumer smoke)
        run: bash scripts/smoke-graph-packages-consumer.sh

      - name: Restormel platform (contracts, observability, graph-reasoning-extensions, state)
        run: |
          pnpm --filter @restormel/contracts run build
          pnpm --filter @restormel/contracts test
          pnpm --filter @restormel/observability run build
          pnpm --filter @restormel/observability test
          pnpm --filter @restormel/graph-reasoning-extensions run build
          pnpm --filter @restormel/graph-reasoning-extensions test
          pnpm --filter @restormel/context-packs run build
          pnpm --filter @restormel/context-packs test
          pnpm --filter @restormel/state run build
          pnpm --filter @restormel/state test

      - name: Restormel State minimal consumer (example)
        run: pnpm --filter restormel-state-minimal-consumer run start

      # Restormel Testing (@restormel/testing-*) — merged from restormel-testing
      - name: Validate testing-github-action action.yml (YAML)
        run: bash scripts/validate-testing-github-action-yml.sh
      - name: Build @restormel/keys-tokens (workspace)
        run: pnpm --filter @restormel/keys-tokens run build
      - name: Build testing TypeScript packages
        run: pnpm run build:testing-packages
      - name: Install Playwright Chromium (testing)
        run: pnpm --filter @restormel/testing-browser-playwright exec playwright install chromium
      - name: Test @restormel/testing-*
        run: pnpm run test:testing
      - name: Serve testing-basic-web and run web-critical (integration)
        run: |
          (cd examples/testing-basic-web && pnpm exec serve -l 4173 .) &
          SERVE_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null
          node packages/testing-cli/dist/bin/testing.js validate --config examples/testing-basic-web/restormel-testing.yaml
          node packages/testing-cli/dist/bin/testing.js run --suite web-critical --config examples/testing-basic-web/restormel-testing.yaml
          kill $SERVE_PID

  keys-svelte-republish-smoke:
    runs-on: ubuntu-latest
    if: needs.changes.outputs.code == 'true'
    needs: [changes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: PNPM install
        uses: ./.github/actions/pnpm-workspace-install
      - name: Pack + demo-svelte build from tarballs
        run: bash scripts/smoke-keys-svelte-republish.sh

  apply-dashboard-migrations-prod:
    name: Apply dashboard migrations + catalog seed (prod DB)
    runs-on: ubuntu-latest
    needs: [changes, test]
    # workflow_dispatch re-seed must not require the test job (test is skipped when code paths unchanged).
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' &&
          (inputs.run_db_migrations == true || inputs.run_model_catalog_seed == true)) ||
        (github.event_name == 'push' &&
          needs.test.result == 'success' &&
          (needs.changes.outputs.dashboard_migrations == 'true' ||
           needs.changes.outputs.model_catalog_seed == 'true'))
      )
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply dashboard migrations to production DB
        env:
          # Set this secret in repo settings: DATABASE_URL for the production Neon branch.
          DASHBOARD_DATABASE_URL_PROD: ${{ secrets.DASHBOARD_DATABASE_URL_PROD }}
        run: |
          set -euo pipefail
          if [[ -z "${DASHBOARD_DATABASE_URL_PROD:-}" ]]; then
            echo "Missing secret: DASHBOARD_DATABASE_URL_PROD"
            exit 1
          fi
          export DATABASE_URL="$DASHBOARD_DATABASE_URL_PROD"
          bash scripts/apply-dashboard-migrations.sh
      - name: PNPM install (dashboard seed deps)
        uses: ./.github/actions/pnpm-workspace-install
      - name: Ingest model catalog from JSON seed (prod)
        env:
          DASHBOARD_DATABASE_URL_PROD: ${{ secrets.DASHBOARD_DATABASE_URL_PROD }}
        run: |
          set -euo pipefail
          if [[ -z "${DASHBOARD_DATABASE_URL_PROD:-}" ]]; then
            echo "Missing secret: DASHBOARD_DATABASE_URL_PROD"
            exit 1
          fi
          export DATABASE_URL="$DASHBOARD_DATABASE_URL_PROD"
          pnpm --filter dashboard run seed:catalog
