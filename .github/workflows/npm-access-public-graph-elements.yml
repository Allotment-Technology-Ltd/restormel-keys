# Recovery: @restormel/graph-elements may publish as private (org default); npm view returns 404 until publicized.
name: npm access public — @restormel/graph-elements
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publicize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: npm access set status=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set."
            exit 1
          fi
          npm access set status=public "@restormel/graph-elements"
