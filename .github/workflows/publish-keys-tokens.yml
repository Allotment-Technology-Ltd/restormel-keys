# Publish @restormel/keys-tokens to npm on tag tokens-v* (e.g. tokens-v0.1.1).
# Source: packages/keys-tokens (merged from restormel-platform).
# Provenance: omitted for private repos per Keys publish workflow notes.
# MIRROR DEDUPE (PBI #248): canonical publisher is .forgejo/workflows/publish-keys-tokens.yml
# (same `tokens-v*` tag). A mirror tag-push would re-fire this copy → double npm publish race.
# `push: tags` removed so this no longer auto-fires on the mirror; dispatch kept for manual recovery.
name: Publish tokens
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 9.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build @restormel/keys-tokens
        run: pnpm --filter @restormel/keys-tokens run build
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
      - name: Publish @restormel/keys-tokens
        run: pnpm --filter @restormel/keys-tokens publish --access public --no-git-checks
