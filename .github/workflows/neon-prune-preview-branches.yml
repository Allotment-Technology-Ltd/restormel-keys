name: Prune stale Neon preview branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "When true, only log branches that would be deleted"
        type: boolean
        default: true
      min_age_hours:
        description: "Minimum branch age in hours before eligible for deletion"
        type: number
        default: 24
  schedule:
    - cron: "30 3 * * 1" # Weekly Monday 03:30 UTC

permissions:
  contents: read
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune stale preview branches in Neon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIN_AGE_HOURS: ${{ inputs.min_age_hours }}
          REPO: ${{ github.repository }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.request

          api_key = os.environ.get("NEON_API_KEY")
          project_id = os.environ.get("NEON_PROJECT_ID")
          gh_token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPO")

          if not api_key:
            print("NEON_API_KEY is missing")
            sys.exit(1)
          if not project_id:
            print("NEON_PROJECT_ID is missing")
            sys.exit(1)
          if not gh_token:
            print("GITHUB_TOKEN is missing")
            sys.exit(1)
          if not repo:
            print("github.repository is missing")
            sys.exit(1)

          dry_run_raw = os.environ.get("DRY_RUN", "true").strip().lower()
          dry_run = dry_run_raw not in ("false", "0", "no")
          try:
            min_age_hours = int(float(os.environ.get("MIN_AGE_HOURS", "24")))
          except Exception:
            min_age_hours = 24
          min_age_ms = max(min_age_hours, 0) * 60 * 60 * 1000

          def http_json(url: str, method: str = "GET", headers: dict | None = None) -> dict:
            req = urllib.request.Request(url=url, method=method)
            for k, v in (headers or {}).items():
              req.add_header(k, v)
            with urllib.request.urlopen(req) as resp:
              return json.loads(resp.read().decode("utf-8"))

          neon_headers = {
            "Authorization": f"Bearer {api_key}",
            "Accept": "application/json",
          }
          gh_headers = {
            "Authorization": f"Bearer {gh_token}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          }

          # Collect open PR numbers.
          open_prs = set()
          gh_url = f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=100"
          prs = http_json(gh_url, headers=gh_headers)
          for pr in prs:
            num = pr.get("number")
            if isinstance(num, int):
              open_prs.add(num)

          # List Neon branches.
          neon_url = f"https://console.neon.tech/api/v2/projects/{project_id}/branches"
          neon_resp = http_json(neon_url, headers=neon_headers)
          branches = neon_resp.get("branches", [])

          pattern = re.compile(r"^preview-pr-(\d+)-")
          now_ms = int(time.time() * 1000)

          candidates = []
          for b in branches:
            name = b.get("name")
            if not isinstance(name, str):
              continue
            m = pattern.match(name)
            if not m:
              continue
            pr_number = int(m.group(1))
            if pr_number in open_prs:
              continue
            created_at = b.get("created_at")
            created_ms = None
            if isinstance(created_at, str):
              # Neon returns ISO-8601.
              try:
                from datetime import datetime
                dt = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
                created_ms = int(dt.timestamp() * 1000)
              except Exception:
                created_ms = None
            if created_ms is not None and (now_ms - created_ms) < min_age_ms:
              continue
            candidates.append(
              {
                "id": b.get("id"),
                "name": name,
                "pr": pr_number,
                "created_at": created_at,
              }
            )

          print(f"Open PR count: {len(open_prs)}")
          print(f"Stale preview branch candidates: {len(candidates)}")
          for c in candidates:
            print(f"- {c['name']} (PR #{c['pr']}, created_at={c['created_at']})")

          if dry_run:
            print("Dry run enabled; no branches deleted.")
            sys.exit(0)

          deleted = 0
          for c in candidates:
            branch_id = c.get("id")
            if not branch_id:
              print(f"Skipping {c['name']} (missing branch id)")
              continue
            del_url = f"https://console.neon.tech/api/v2/projects/{project_id}/branches/{branch_id}"
            try:
              http_json(del_url, method="DELETE", headers=neon_headers)
              deleted += 1
              print(f"Deleted {c['name']}")
            except Exception as e:
              print(f"Failed to delete {c['name']}: {e}")

          print(f"Deleted {deleted} stale preview branches.")
          PY
