name: Prune stale Neon preview branches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "When true, only log branches that would be deleted"
        type: boolean
        default: true
      min_age_hours:
        description: "Minimum branch age in hours before eligible for deletion"
        type: number
        default: 24
      ignore_open_prs:
        description: "When true, do not preserve branches for open PRs"
        type: boolean
        default: false
  schedule:
    - cron: "30 3 * * 1" # Weekly Monday 03:30 UTC

permissions:
  contents: read
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch defaults inputs.dry_run to true; scheduled runs do not receive inputs, so
      # DRY_RUN was previously unset/empty and the script defaulted to dry-run — meaning the weekly
      # cron never deleted branches. Scheduled runs delete for real (see MIN_AGE_HOURS).
      - name: Set prune env (weekly schedule)
        if: github.event_name == 'schedule'
        run: |
          echo "DRY_RUN=false" >> "$GITHUB_ENV"
          echo "MIN_AGE_HOURS=72" >> "$GITHUB_ENV"
          echo "IGNORE_OPEN_PRS=false" >> "$GITHUB_ENV"

      - name: Set prune env (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "DRY_RUN=${{ inputs.dry_run }}" >> "$GITHUB_ENV"
          echo "MIN_AGE_HOURS=${{ inputs.min_age_hours }}" >> "$GITHUB_ENV"
          echo "IGNORE_OPEN_PRS=${{ inputs.ignore_open_prs }}" >> "$GITHUB_ENV"

      - name: Prune stale preview branches in Neon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          REPO: ${{ github.repository }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.request

          api_key = os.environ.get("NEON_API_KEY")
          project_id = os.environ.get("NEON_PROJECT_ID")
          gh_token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPO")

          if not api_key:
            print("NEON_API_KEY is missing")
            sys.exit(1)
          if not project_id:
            print("NEON_PROJECT_ID is missing")
            sys.exit(1)
          if not gh_token:
            print("GITHUB_TOKEN is missing")
            sys.exit(1)
          if not repo:
            print("github.repository is missing")
            sys.exit(1)

          dry_run_raw = os.environ.get("DRY_RUN", "true").strip().lower()
          dry_run = dry_run_raw not in ("false", "0", "no")
          try:
            min_age_hours = int(float(os.environ.get("MIN_AGE_HOURS", "24")))
          except Exception:
            min_age_hours = 24
          min_age_ms = max(min_age_hours, 0) * 60 * 60 * 1000

          def http_json(url: str, method: str = "GET", headers: dict | None = None) -> dict:
            req = urllib.request.Request(url=url, method=method)
            for k, v in (headers or {}).items():
              req.add_header(k, v)
            with urllib.request.urlopen(req) as resp:
              return json.loads(resp.read().decode("utf-8"))

          neon_headers = {
            "Authorization": f"Bearer {api_key}",
            "Accept": "application/json",
          }
          gh_headers = {
            "Authorization": f"Bearer {gh_token}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          }

          # Collect open PR numbers and head refs (for preview/<head_ref> branches, including Vercel-created names).
          open_prs = set()
          open_heads = set()
          ignore_open_prs_raw = os.environ.get("IGNORE_OPEN_PRS", "false").strip().lower()
          ignore_open_prs = ignore_open_prs_raw in ("true", "1", "yes")
          if not ignore_open_prs:
            page = 1
            while True:
              gh_url = f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=100&page={page}"
              prs = http_json(gh_url, headers=gh_headers)
              if not isinstance(prs, list) or len(prs) == 0:
                break
              for pr in prs:
                num = pr.get("number")
                if isinstance(num, int):
                  open_prs.add(num)
                head = pr.get("head") or {}
                ref = head.get("ref")
                if isinstance(ref, str):
                  open_heads.add(ref)
              if len(prs) < 100:
                break
              page += 1

          # List Neon branches.
          neon_url = f"https://console.neon.tech/api/v2/projects/{project_id}/branches"
          neon_resp = http_json(neon_url, headers=neon_headers)
          branches = neon_resp.get("branches", [])

          pattern_pr_named = re.compile(r"^preview-pr-(\d+)(?:-|$)")
          pattern_preview_slash = re.compile(r"^preview/")
          now_ms = int(time.time() * 1000)

          candidates = []
          for b in branches:
            name = b.get("name")
            if not isinstance(name, str):
              continue
            m = pattern_pr_named.match(name)
            is_preview_slash = bool(pattern_preview_slash.match(name))
            if not m and not is_preview_slash:
              continue
            pr_number = int(m.group(1)) if m else None
            if pr_number is not None and pr_number in open_prs:
                continue
            if is_preview_slash and not ignore_open_prs:
                head_ref = name[len("preview/"):]
                if head_ref in open_heads:
                    continue
            created_at = b.get("created_at")
            created_ms = None
            if isinstance(created_at, str):
              # Neon returns ISO-8601.
              try:
                from datetime import datetime
                dt = datetime.fromisoformat(created_at.replace("Z", "+00:00"))
                created_ms = int(dt.timestamp() * 1000)
              except Exception:
                created_ms = None
            if created_ms is not None and (now_ms - created_ms) < min_age_ms:
              continue
            candidates.append(
              {
                "id": b.get("id"),
                "name": name,
                "pr": pr_number,
                "created_at": created_at,
              }
            )

          print(f"Open PR count: {len(open_prs)} (head refs: {len(open_heads)})")
          print(f"Stale preview branch candidates: {len(candidates)}")
          for c in candidates:
            pr_label = f"PR #{c['pr']}" if c["pr"] is not None else "legacy preview"
            print(f"- {c['name']} ({pr_label}, created_at={c['created_at']})")

          if dry_run:
            print("Dry run enabled; no branches deleted.")
            sys.exit(0)

          deleted = 0
          for c in candidates:
            branch_id = c.get("id")
            if not branch_id:
              print(f"Skipping {c['name']} (missing branch id)")
              continue
            del_url = f"https://console.neon.tech/api/v2/projects/{project_id}/branches/{branch_id}"
            try:
              http_json(del_url, method="DELETE", headers=neon_headers)
              deleted += 1
              print(f"Deleted {c['name']}")
            except Exception as e:
              print(f"Failed to delete {c['name']}: {e}")

          print(f"Deleted {deleted} stale preview branches.")
          PY
