# After a release notify tag lands on this repo, open a SOPHIA backlog issue on the consumer repo
# with the matching CHANGELOG excerpt, SOPHIA-focused triage table, and links (OpenAPI, integrator docs).
# Tags: `keys-v*` (same family as npm Publish) and `restormel-v*` (hosted product / API / dashboard without npm).
# Runs on tag push only — not gated on Publish workflow success. Implemented by scripts/sophia-release-notify-issue.mjs.
#
# Configure (restormel-keys):
#   Repository variable: DOGFOOD_NOTIFY_CONSUMER = Owner/repo (e.g. Allotment-Technology-Ltd/sophia)
#   PAT secret (either name — same token is OK if scopes cover both directions):
#     - DOGFOOD_NOTIFY_CONSUMER_TOKEN (preferred name on this repo), or
#     - RESTORMEL_KEYS_ISSUE_TOKEN (e.g. org secret shared with SOPHIA — must be visible to THIS repo too)
#   The fine-grained PAT must allow Issues: Read and write on the CONSUMER repo (sophia).
#   If the same PAT also has Issues on restormel-keys (typical for SOPHIA→keys relay), one token suffices;
#   if it is scoped to restormel-keys ONLY, expand the PAT to include sophia or use a second PAT.
#
# Optional: run manually (Actions → this workflow) with input `tag` to backfill or retry.
name: Dogfood upstream — notify consumer

on:
  push:
    tags:
      - 'keys-v*'
      - 'restormel-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag on this repo: keys-v* (npm train) or restormel-v* (API/dashboard/docs without npm), e.g. keys-v0.2.13'
        required: true
        type: string
      force:
        description: 'Create issue even if one already exists with this tag in the title'
        required: false
        type: boolean
        default: false

jobs:
  notify:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            FORCE="${INPUT_FORCE}"
          else
            TAG="${REF_NAME}"
            FORCE="false"
          fi
          if [[ ! "$TAG" =~ ^(keys|restormel)-v[0-9]+(\.[0-9]+){1,2}([\-+][a-zA-Z0-9\.\-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi
          if [[ "$FORCE" != "true" && "$FORCE" != "false" ]]; then
            echo "::error::Invalid force flag: $FORCE"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"

      - name: Skip notify (consumer not configured)
        if: ${{ vars.DOGFOOD_NOTIFY_CONSUMER == '' }}
        run: echo '::notice::Dogfood upstream notify disabled. Set Actions variable DOGFOOD_NOTIFY_CONSUMER (e.g. Org/sophia).'

      # secrets cannot be referenced in step `if:` on some runners; pass via env and expose a boolean output.
      - name: Resolve PAT presence
        id: pat
        if: ${{ vars.DOGFOOD_NOTIFY_CONSUMER != '' }}
        env:
          T1: ${{ secrets.DOGFOOD_NOTIFY_CONSUMER_TOKEN }}
          T2: ${{ secrets.RESTORMEL_KEYS_ISSUE_TOKEN }}
        run: |
          if [ -n "${T1}" ] || [ -n "${T2}" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notify (missing PAT)
        if: ${{ vars.DOGFOOD_NOTIFY_CONSUMER != '' && steps.pat.outputs.has_pat == 'false' }}
        run: echo '::warning::DOGFOOD_NOTIFY_CONSUMER is set but no PAT secret found (set DOGFOOD_NOTIFY_CONSUMER_TOKEN or make RESTORMEL_KEYS_ISSUE_TOKEN visible to this repo).'

      - name: Checkout tag (for CHANGELOG excerpt)
        if: ${{ vars.DOGFOOD_NOTIFY_CONSUMER != '' && steps.pat.outputs.has_pat == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 1

      - name: Open SOPHIA backlog issue
        if: ${{ vars.DOGFOOD_NOTIFY_CONSUMER != '' && steps.pat.outputs.has_pat == 'true' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          FORCE: ${{ steps.meta.outputs.force }}
          DOGFOOD_NOTIFY_CONSUMER: ${{ vars.DOGFOOD_NOTIFY_CONSUMER }}
          CONSUMER_PAT: ${{ secrets.DOGFOOD_NOTIFY_CONSUMER_TOKEN || secrets.RESTORMEL_KEYS_ISSUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sophia-release-notify-issue.mjs CHANGELOG.md
