# After a `keys-v*` tag lands on this repo, open a tracking issue on a consumer repo (e.g. SOPHIA)
# with links to the tag, CHANGELOG, and suggested follow-ups. Does not open PRs on the consumer.
#
# Configure (restormel-keys):
#   Repository variable: DOGFOOD_NOTIFY_CONSUMER = Owner/repo (e.g. Allotment-Technology-Ltd/sophia)
#   PAT secret (either name — same token is OK if scopes cover both directions):
#     - DOGFOOD_NOTIFY_CONSUMER_TOKEN (preferred name on this repo), or
#     - RESTORMEL_KEYS_ISSUE_TOKEN (e.g. org secret shared with SOPHIA — must be visible to THIS repo too)
#   The fine-grained PAT must allow Issues: Read and write on the CONSUMER repo (sophia).
#   If the same PAT also has Issues on restormel-keys (typical for SOPHIA→keys relay), one token suffices;
#   if it is scoped to restormel-keys ONLY, expand the PAT to include sophia or use a second PAT.
#
# Optional: run manually (Actions → this workflow) with input `tag` to backfill or retry.
name: Dogfood upstream — notify consumer

on:
  push:
    tags:
      - 'keys-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name, e.g. keys-v0.2.13'
        required: true
        type: string
      force:
        description: 'Create issue even if one already exists with this tag in the title'
        required: false
        type: boolean
        default: false

jobs:
  notify:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            FORCE="${{ inputs.force }}"
          else
            TAG="${GITHUB_REF_NAME}"
            FORCE="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "force=${FORCE}" >> "$GITHUB_OUTPUT"

      - name: Skip notify (consumer not configured)
        if: ${{ vars.DOGFOOD_NOTIFY_CONSUMER == '' }}
        run: echo '::notice::Dogfood upstream notify disabled. Set Actions variable DOGFOOD_NOTIFY_CONSUMER (e.g. Org/sophia).'

      - name: Skip notify (missing PAT)
        if: ${{ vars.DOGFOOD_NOTIFY_CONSUMER != '' && secrets.DOGFOOD_NOTIFY_CONSUMER_TOKEN == '' && secrets.RESTORMEL_KEYS_ISSUE_TOKEN == '' }}
        run: echo '::warning::DOGFOOD_NOTIFY_CONSUMER is set but no PAT secret found (set DOGFOOD_NOTIFY_CONSUMER_TOKEN or make RESTORMEL_KEYS_ISSUE_TOKEN visible to this repo).'

      - name: Open consumer issue
        if: ${{ vars.DOGFOOD_NOTIFY_CONSUMER != '' && (secrets.DOGFOOD_NOTIFY_CONSUMER_TOKEN != '' || secrets.RESTORMEL_KEYS_ISSUE_TOKEN != '') }}
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          FORCE: ${{ steps.meta.outputs.force }}
          CONSUMER: ${{ vars.DOGFOOD_NOTIFY_CONSUMER }}
        with:
          github-token: ${{ secrets.DOGFOOD_NOTIFY_CONSUMER_TOKEN || secrets.RESTORMEL_KEYS_ISSUE_TOKEN }}
          script: |
            const consumer = (process.env.CONSUMER || '').trim();
            if (!consumer) {
              core.notice('Skipping: set repository variable DOGFOOD_NOTIFY_CONSUMER (e.g. Org/sophia).');
              return;
            }
            const slash = consumer.indexOf('/');
            if (slash < 1 || slash === consumer.length - 1) {
              core.setFailed('DOGFOOD_NOTIFY_CONSUMER must be owner/repo');
              return;
            }
            const cOwner = consumer.slice(0, slash);
            const cRepo = consumer.slice(slash + 1);
            const tag = (process.env.TAG || '').trim();
            if (!/^keys-v[0-9]/i.test(tag)) {
              core.setFailed(`Unexpected tag: ${tag}`);
              return;
            }
            const force = String(process.env.FORCE).toLowerCase() === 'true';
            const upstreamOwner = context.repo.owner;
            const upstreamRepo = context.repo.repo;
            const title = `[Restormel Keys] Release ${tag}`;
            if (!force) {
              const q = `repo:${cOwner}/${cRepo} is:issue in:title ${tag}`;
              const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 5 });
              if (found.data.total_count > 0) {
                core.info(`Skip: found existing issue mentioning ${tag} in title.`);
                return;
              }
            }
            const changelogUrl = `https://github.com/${upstreamOwner}/${upstreamRepo}/blob/${tag}/CHANGELOG.md`;
            const treeUrl = `https://github.com/${upstreamOwner}/${upstreamRepo}/tree/${tag}`;
            const dogfoodIssues = `https://github.com/${upstreamOwner}/${upstreamRepo}/issues?q=is%3Aissue+label%3Atask+%5BDogfood%5D`;
            const body = [
              '### Restormel Keys — release notification',
              '',
              'This issue was opened automatically from **' + `${upstreamOwner}/${upstreamRepo}` + '** when **`' + tag + '`** was pushed.',
              '',
              '| Link | URL |',
              '|------|-----|',
              '| **Tag (tree)** | ' + treeUrl + ' |',
              '| **CHANGELOG** (source of truth) | ' + changelogUrl + ' |',
              '| **Upstream `[Dogfood]` issues** | ' + dogfoodIssues + ' |',
              '',
              '**Suggested next steps (consumer team)**',
              '- [ ] Confirm **npm** `@restormel/*` versions for this train (see CHANGELOG on the tag).',
              '- [ ] Bump / verify the **host app** dependencies and integration notes.',
              '- [ ] Close or update any **linked consumer threads** that were waiting on this release.',
              '',
              '_No API keys or credentials belong in this issue._',
            ].join('\n');
            const label = 'restormel-upstream-release';
            try {
              await github.rest.issues.createLabel({
                owner: cOwner,
                repo: cRepo,
                name: label,
                color: '1D76DB',
                description: 'Auto-opened when restormel-keys ships a keys-v* tag',
              });
            } catch (e) {
              if (e.status !== 422) core.warning(String(e));
            }
            await github.rest.issues.create({
              owner: cOwner,
              repo: cRepo,
              title,
              body,
              labels: [label],
            });
            core.notice(`Created issue on ${consumer}: ${title}`);
