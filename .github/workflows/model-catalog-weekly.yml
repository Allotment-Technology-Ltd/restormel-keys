name: Daily model catalog refresh

on:
  schedule:
    - cron: "0 9 * * *" # Every day 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: model-catalog-weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build core package (required by seed script)
        run: pnpm -w --filter @restormel/keys run build
      - name: Refresh model catalog (provider-derived)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter dashboard seed:catalog:from-keys

