name: Daily model catalog refresh

on:
  schedule:
    - cron: "0 9 * * *" # Every day 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: model-catalog-weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: vars.RESTORMEL_CATALOG_EXTERNAL_SIGNALS == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      # pnpm version must match root package.json "packageManager" (9.0.0). Unpinned setup installs pnpm 10+ which requires Node 22+ (node:sqlite).
      - uses: ./.github/actions/pnpm-workspace-install
      - name: Build core package (required by seed script)
        run: pnpm -w --filter @restormel/keys run build
      - name: Refresh model catalog (provider-derived)
        env:
          DASHBOARD_DATABASE_URL_PROD: ${{ secrets.DASHBOARD_DATABASE_URL_PROD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -z "${DASHBOARD_DATABASE_URL_PROD:-}" && -z "${DATABASE_URL:-}" ]]; then
            echo "Missing secret: set DASHBOARD_DATABASE_URL_PROD (preferred, same as ci.yml migrations) or DATABASE_URL"
            exit 1
          fi
          export DATABASE_URL="${DASHBOARD_DATABASE_URL_PROD:-$DATABASE_URL}"
          pnpm --filter dashboard seed:catalog:from-keys
