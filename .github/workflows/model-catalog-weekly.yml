name: Daily model catalog refresh

on:
  schedule:
    - cron: "0 9 * * *" # Every day 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: model-catalog-weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build core package (required by seed script)
        run: pnpm -w --filter @restormel/keys run build
      - name: Refresh model catalog (provider-derived)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter dashboard seed:catalog:from-keys

