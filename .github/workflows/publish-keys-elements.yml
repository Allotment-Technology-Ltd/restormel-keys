# One-off or recovery: publish @restormel/keys-elements without running the full release train.
name: Publish keys-elements
on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e
        with:
          version: 9.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build dependencies (keys, keys-svelte)
        run: |
          pnpm --filter @restormel/keys run build
          pnpm --filter @restormel/keys-svelte run build
      - name: Test @restormel/keys-elements
        run: pnpm --filter @restormel/keys-elements test
      - name: Build @restormel/keys-elements
        run: pnpm --filter @restormel/keys-elements run build
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
      - name: Publish @restormel/keys-elements to npm
        run: pnpm --filter @restormel/keys-elements publish --access public --no-git-checks
