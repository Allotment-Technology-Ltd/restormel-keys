# Doc checks when docs change (docs/bootstrap-plan.md).
name: Docs
on:
  push:
    branches: [main, master]
    paths: ['docs/**', 'docs/**', 'README.md', 'ROADMAP.md', 'STATUS.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'ARCHITECTURE.md']
  pull_request:
    branches: [main, master]
    paths: ['docs/**', 'docs/**', 'README.md', 'ROADMAP.md', 'STATUS.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'ARCHITECTURE.md']
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Review docs
        run: bash scripts/review-docs.sh
      - name: Docs update checklist
        run: bash scripts/docs-update-checklist.sh
