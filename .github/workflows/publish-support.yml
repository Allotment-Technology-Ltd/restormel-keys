# Publish @restormel/support to npm (tag support-v* or manual dispatch).
# MIRROR DEDUPE (PBI #248): canonical publisher is .forgejo/workflows/publish-support.yml
# (same `support-v*` tag). `push: tags` removed so a mirror tag-push no longer re-fires this
# copy → avoids the double npm publish race; workflow_dispatch retained for manual recovery.
name: Publish Restormel Support
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-support-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: PNPM install
        uses: ./.github/actions/pnpm-workspace-install

      - name: Build @restormel/mcp (dependency)
        run: pnpm --filter @restormel/mcp run build

      - name: Test @restormel/support
        run: pnpm --filter @restormel/support run test

      - name: Build @restormel/support
        run: pnpm --filter @restormel/support run build

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"

      - name: Publish @restormel/support
        run: pnpm --filter @restormel/support publish --access public --no-git-checks
