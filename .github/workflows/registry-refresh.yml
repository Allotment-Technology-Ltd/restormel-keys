name: Registry refresh

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20"
      - name: Refresh registry (best-effort)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        run: node scripts/refresh-registry.mjs
      - name: Validate registry
        run: node scripts/validate-registry.mjs
      - name: Create PR if changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: "chore(registry): refresh metadata"
          title: "chore(registry): refresh metadata"
          body: |
            ## Summary
            - Automated refresh of registry metadata (best-effort).

            ## Notes
            - This job only updates `registry/models.json` when live sources are configured via repo secrets.
          branch: chore/registry-refresh
          delete-branch: true

