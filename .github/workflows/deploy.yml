# Deploy workflow scaffold for Restormel Keys.
# Bootstrap-safe: verifies GitHub OIDC → GCP WIF auth first, then keeps infra/app deploy steps stubbed until targets are ready.
# Region: europe-west2. No SurrealDB/VPC/ingestion in this workflow.
# WIF: GitHub secrets GCP_PROJECT_ID, WIF_PROVIDER (full pool/provider resource name), WIF_SERVICE_ACCOUNT (SA email).
# Stage F hash secret: stored in GCP Secret Manager for app runtime (key hashing); not used in this workflow.
name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'Dockerfile.site'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'Dockerfile.site'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

env:
  REGION: europe-west2
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  # Skip on fork PRs and Dependabot: secrets (GCP_PROJECT_ID, WIF_*) are not passed (Resource not accessible by integration).
  infra-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list

      - name: Infra preview
        run: |
          if [ -d infra ]; then
            echo "Run 'pulumi preview' locally or enable Pulumi in CI (PULUMI_ACCESS_TOKEN, stack) to preview infra changes."
          else
            echo "No infra directory yet"
          fi

  infra-apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list

      - name: Infra apply
        run: |
          if [ -d infra ]; then
            echo "Run 'pulumi up' locally when infra changes. Deploy job below pushes site image and deploys to existing Cloud Run service."
          else
            echo "No infra directory yet"
          fi

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      REGION: europe-west2
      IMAGE_NAME: europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/restormel-keys/site
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      # Diagnostic: identity and repo existence (helps debug uploadArtifacts denied)
      - name: Diagnose GCP Artifact Registry
        run: |
          echo "Active account:"
          gcloud auth list
          echo "Artifact Registry repo (must exist; deploy identity needs roles/artifactregistry.writer):"
          gcloud artifacts repositories describe restormel-keys --location=europe-west2 --project="${{ secrets.GCP_PROJECT_ID }}" || echo "Repo missing or no permission to describe — create with 'pulumi up' in infra/ and grant deploy SA roles/artifactregistry.writer"

      - name: Build site image
        run: |
          docker build -f Dockerfile.site -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push site image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy keys-dashboard \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --quiet
