# Deploy workflow scaffold for Restormel Keys.
# Bootstrap-safe: verifies GitHub OIDC → GCP WIF auth first, then keeps infra/app deploy steps stubbed until targets are ready.
# Region: europe-west2. No SurrealDB/VPC/ingestion in this workflow.
# WIF: GitHub secrets GCP_PROJECT_ID, WIF_PROVIDER (full pool/provider resource name), WIF_SERVICE_ACCOUNT (SA email).
# Stage F hash secret: stored in GCP Secret Manager for app runtime (key hashing); not used in this workflow.
name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

env:
  REGION: europe-west2
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  infra-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list

      - name: Infra preview
        run: |
          if [ -d infra ]; then
            echo "Pulumi preview placeholder: enable once stack config and backend are ready"
          else
            echo "No infra directory yet"
          fi

  infra-apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # #region agent log — validate WIF secrets format (no secret values logged)
      - name: Validate WIF format
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          set -e
          echo "=== WIF format checks (hypothesisId: A-E) ==="
          p_len=${#WIF_PROVIDER}; g_len=${#GCP_PROJECT_ID}; s_len=${#WIF_SERVICE_ACCOUNT}
          echo "H1_secrets_nonempty: GCP_PROJECT_ID_len=$g_len WIF_PROVIDER_len=$p_len WIF_SERVICE_ACCOUNT_len=$s_len"
          [[ $g_len -gt 0 && $p_len -gt 0 && $s_len -gt 0 ]] && echo "H1_all_set: 1" || echo "H1_all_set: 0"
          trim_p=$(echo "$WIF_PROVIDER" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          trim_len=${#trim_p}
          echo "H4_trim_changed_length: orig=$p_len trimmed=$trim_len"
          [[ "$WIF_PROVIDER" == "principal://"* ]] && echo "H3_has_principal_prefix: 1" || echo "H3_has_principal_prefix: 0"
          [[ "$WIF_PROVIDER" == "projects/"* ]] && echo "H2_starts_projects: 1" || echo "H2_starts_projects: 0"
          [[ "$WIF_PROVIDER" == *"/locations/global/workloadIdentityPools/"* ]] && echo "H2_has_pools_segment: 1" || echo "H2_has_pools_segment: 0"
          [[ "$WIF_PROVIDER" == *"/providers/"* ]] && echo "H2_has_providers_segment: 1" || echo "H2_has_providers_segment: 0"
          echo "=== end WIF format checks ==="
      # #endregion
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list

      - name: Infra apply
        run: |
          if [ -d infra ]; then
            echo "Pulumi up placeholder: enable once stack config, backend, and deploy roles are ready"
          else
            echo "No infra directory yet"
          fi

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list

      - name: Docker meta
        id: meta
        run: |
          echo "image=europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/restormel-keys/app" >> $GITHUB_OUTPUT
          echo "tags=latest,${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push
        run: |
          echo "Docker build placeholder: enable Artifact Registry auth and image push once Dockerfile and service target are ready"
          echo "Target image: ${{ steps.meta.outputs.image }}"
      - name: Deploy to Cloud Run
        run: |
          echo "Cloud Run deploy placeholder: enable once service name, image push, and runtime config are ready"
          echo "Region: $REGION"
        env:
          REGION: europe-west2
