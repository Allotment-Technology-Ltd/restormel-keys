# Deploy workflow scaffold for Restormel Keys.
# Bootstrap-safe: verifies GitHub OIDC → GCP WIF auth first, then keeps infra/app deploy steps stubbed until targets are ready.
# Region: europe-west2. No SurrealDB/VPC/ingestion in this workflow.
# WIF: GitHub secrets GCP_PROJECT_ID, WIF_PROVIDER (full pool/provider resource name), WIF_SERVICE_ACCOUNT (SA email).
# Stage F hash secret: stored in GCP Secret Manager for app runtime (key hashing); not used in this workflow.
name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

env:
  REGION: europe-west2
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  infra-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list

      - name: Infra preview
        run: |
          if [ -d infra ]; then
            echo "Pulumi preview placeholder: enable once stack config and backend are ready"
          else
            echo "No infra directory yet"
          fi

  infra-apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list

      - name: Infra apply
        run: |
          if [ -d infra ]; then
            echo "Pulumi up placeholder: enable once stack config, backend, and deploy roles are ready"
          else
            echo "No infra directory yet"
          fi

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify auth
        run: |
          gcloud config set project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud auth list

      - name: Docker meta
        id: meta
        run: |
          echo "image=europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/restormel-keys/app" >> $GITHUB_OUTPUT
          echo "tags=latest,${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push
        run: |
          echo "Docker build placeholder: enable Artifact Registry auth and image push once Dockerfile and service target are ready"
          echo "Target image: ${{ steps.meta.outputs.image }}"
      - name: Deploy to Cloud Run
        run: |
          echo "Cloud Run deploy placeholder: enable once service name, image push, and runtime config are ready"
          echo "Region: $REGION"
        env:
          REGION: europe-west2
