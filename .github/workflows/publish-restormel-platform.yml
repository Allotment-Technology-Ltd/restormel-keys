# Publish @restormel/contracts, @restormel/observability, @restormel/graph-reasoning-extensions on tag platform-v*
# Order: contracts → observability → graph-reasoning-extensions (pnpm rewrites workspace:* on publish).
# graph-core / ui-graph-svelte use tag graph-v* (publish-graph.yml). Requires NPM_TOKEN.
name: Publish Restormel platform packages
on:
  push:
    tags:
      - "platform-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run publish --dry-run only (no npm upload)."
        type: boolean
        default: false
      package_scope:
        description: "Which packages to upload (push tags always publish all three)."
        type: choice
        default: all
        options:
          - all
          - observability

permissions:
  contents: read

concurrency:
  group: npm-publish-platform-${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLATFORM_PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      PLATFORM_PACKAGE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.package_scope || 'all' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: PNPM install
        uses: ./.github/actions/pnpm-workspace-install

      - name: Test + build platform packages
        run: |
          pnpm --filter @restormel/contracts run build
          pnpm --filter @restormel/contracts test
          pnpm --filter @restormel/observability run build
          pnpm --filter @restormel/observability test
          pnpm --filter @restormel/graph-core run build
          pnpm --filter @restormel/graph-core test
          pnpm --filter @restormel/graph-reasoning-extensions run build
          pnpm --filter @restormel/graph-reasoning-extensions test

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set."
            exit 1
          fi
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          EXTRA=""
          if [ "${PLATFORM_PUBLISH_DRY_RUN}" = "true" ]; then
            EXTRA="--dry-run"
            echo "Dry run only."
          fi
          SCOPE="${PLATFORM_PACKAGE_SCOPE:-all}"
          if [ "${SCOPE}" = "all" ]; then
            pnpm --filter @restormel/contracts publish --access public --no-git-checks ${EXTRA}
            pnpm --filter @restormel/observability publish --access public --no-git-checks ${EXTRA}
            pnpm --filter @restormel/graph-reasoning-extensions publish --access public --no-git-checks ${EXTRA}
          else
            pnpm --filter @restormel/observability publish --access public --no-git-checks ${EXTRA}
          fi
          # Scoped packages can still land as private under some org defaults; force public visibility.
          if [ "${PLATFORM_PUBLISH_DRY_RUN}" != "true" ]; then
            if [ "${SCOPE}" = "all" ]; then
              npm access set status=public @restormel/contracts
              npm access set status=public @restormel/observability
              npm access set status=public @restormel/graph-reasoning-extensions
            else
              npm access set status=public @restormel/observability
            fi
          fi
