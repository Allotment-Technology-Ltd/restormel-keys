# Repo hygiene: on-demand or weekly (docs/bootstrap-plan.md).
name: Repo hygiene
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Repo hygiene
        run: bash scripts/check-repo-hygiene.sh
      - name: Secret check
        run: bash scripts/check-secrets.sh
