#   title: Huly PM project ↔ ISMS product-tag map (CIS Control 1 cross-reference)
#   class: governance
#   control-tier: 2
#   owner: founder
#   status: approved
#   approved-by: Adam Boon
#   approved-on: 2026-06-25
