  - id: AST-012
    asset: "BX11 Storage Box + restic backup repos"
    type: backup/storage
    owner: founder
    product: shared
    location: "Hetzner Storage Box BX11, Falkenstein DE (EU) — u613941.your-storagebox.de"
    notes: >
      Hetzner BX11 (1 TB) used as the offsite backup target for all Restormel
      infrastructure. Accessed via SFTP/restic from Box A and Box B.
      Two restic repos:
        - restic-surreal: Box A prod-runtime data → BX11:/restic-surreal (cron 03:00 UTC,
          Box A 77.42.124.167). Covers prod-runtime services on .167.
          NOTE (2026-06-18): SurrealDB migrated to Box B (.150) in Phase 2 (AST-010/AST-014).
          restic-surreal no longer covers SurrealDB data. <!-- VERIFY post-Phase-2: confirm
          what .167 services are currently in scope for this backup job (Postgres, Hydra, etc.)
          and update this entry accordingly. -->
        - restic-buildops: Box B build/ops data → BX11:/restic-buildops (cron 02:00 UTC,
          Box B 77.42.125.150). Covers Forgejo, Coolify config, Box B Postgres, and SurrealDB
          (post-Phase-2 migration from .167 per AST-010/AST-014).
      Both repos: retention keep-daily 7 / keep-weekly 4 / keep-monthly 6.
      Repos are restic-encrypted (passphrase in secrets estate / AST-007).
      EU-sovereign backup — Falkenstein DE, no third-party SaaS. Mitigating control
      for RISK-001 and RISK-009. Restore drill required per REC-PLAN-015 (Phase 8).
      DR runbook: planning/infra-migration-rollback-runbook.md (REC-PLAN-015).
      Shared encrypted backup target for the company-wide Helsinki cluster (Restormel +
      allotmentology.tech) — covers self-hosted Postgres dumps and Infisical backups. This
      is the asset the Phase-2 spec called "Hetzner Storage Box (STORAGE_BOX_ID)" — mapped
      to the existing AST-012, NOT duplicated.

  - id: AST-013
    asset: "Infisical — self-hosted secret manager"
    type: secrets-store
    owner: founder
    product: shared
    location: "Box B build/ops .150 (77.42.125.150), Helsinki FI (EU); FQDN secrets.restormel.dev"
    notes: >
      Self-hosted open-source secret management platform (infisical/infisical
      v0.154.6), deployed 2026-06-17 as a raw docker-compose under /opt/infisical
      on the build/ops box (AST-010), published via the Coolify Traefik proxy
      (router rule Host secrets.restormel.dev, TLS certresolver letsencrypt) on the
      shared `coolify` external network — mirroring the SurrealDB publish pattern
      (/opt/surreal). Becomes the single auditable store for the secrets estate
      (AST-007), treating RISK-002. Three containers: Infisical backend (web UI +
      REST API, port 8080), a dedicated Postgres 14 (stores encrypted secret blobs
      + metadata; internal-only network; volume /opt/infisical/pg), and a dedicated
      Redis 7 (queues/cache; internal-only; volume /opt/infisical/redis). The
      backend's own master ENCRYPTION_KEY + AUTH_SECRET live only in
      /opt/infisical/.env (root-owned, 0600) on the box — never committed to any
      repo. Access paths: web UI (founder admin account; MFA to be enabled) and the
      `infisical` CLI authenticated by a machine identity / service token for
      `infisical run -- <cmd>` secret injection. EU sovereignty + OSS were the
      deciding reasons for self-hosting rather than a SaaS secret manager. SSH
      private keys are deliberately NOT migrated into Infisical — they remain key
      files on disk. Recovery point for the store is a pg_dump of the Infisical
      Postgres (covered by the Box B restic backup, AST-012).
      OIDC/SAML federation deliberately NOT adopted: Infisical gates it behind a paid
      enterprise licence (~£18/mo), judged not worth it for a single self-hosted
      product at this stage — it keeps its own login (admin MFA still to be enabled,
      tracked in RISK-010). [PLACEHOLDER — founder: confirm] whether the
      allotmentology.tech app yet sources its secrets from Infisical (confirmed in
      place for Restormel; the allotmentology.tech app itself remains out of ISMS
      scope until the company portal ships).
      Single point of failure for runtime secret retrieval — see RISK-010.

  - id: AST-014
    asset: "SurrealDB — verification / knowledge-graph store"
    type: data-store
    owner: founder
    product: restormel
    location: "Self-hosted, surreal.restormel.dev (EU); host Box B (.150, AST-010) — migrated from Box A (.167) in Phase 2 per RISK-009 / REC-PLAN-012"
    notes: >
      Restormel verification / knowledge-graph store (buildWorkspaceGraphStore /
      surreal-graph-store.ts). Confirmed IN ISMS scope (founder, 2026-06-17) — it was
      previously only referenced inside the box assets (AST-009/010/012), never given
      its own entry. Accessed via the Surrealist client using the root account +
      password. CONTROL OBSERVATION: routine access via a shared root credential
      conflicts with the least-privilege / individual-accounts principle
      (REC-POL-002 §2). Recommended: create scoped SurrealDB users for routine use,
      store their credentials in Infisical (AST-013), and reserve root for break-glass
      (the root password necessarily remains in /opt/surreal/.env on the box for
      runtime — see RISK-002 treatment_status). SurrealDB has no OIDC/SSO at the
      database layer, so it cannot join a BetterAuth single sign-on directly; if a web
      admin UI is exposed at surreal.restormel.dev it can sit behind the shared Traefik
      forward-auth gate (company portal plan) — same login to reach it, DB credential
      still separate. Backed up via restic-buildops → BX11 (AST-012) — SurrealDB data is on Box B
      (.150) post-Phase-2; the restic-buildops repo covers it (not restic-surreal).

