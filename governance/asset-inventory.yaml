      portal (AST-017), self-hosted Postgres, BetterAuth, Infisical (AST-013), and SurrealDB
      (AST-014). Backups target the encrypted Hetzner Storage Box in Falkenstein (AST-012).
      Firewall: inbound 22/80/443 only; Coolify :8000 not internet-exposed. Single compute
      region/cluster — see RISK-001 (treated via the split + backups). See AST-009/010/011
      for per-box detail.
      REGION RECONCILED (2026-06-17, founder): compute is Helsinki, FI; the earlier
      "Nuremberg/Falkenstein DE" flag referred to the Falkenstein storage box (AST-012),
      not the compute. The AST-009/010/011 "Helsinki FI" region is confirmed correct.

