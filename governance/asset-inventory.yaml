  - id: AST-003
    asset: "Coolify compute — Hetzner (Helsinki, three-server cluster)"
    type: infrastructure
    owner: founder
    product: shared
    status: superseded-in-transition
    location: "Hetzner Cloud, Helsinki, FI (EU)"
    notes: >
      SUPERSEDED-IN-TRANSITION by the K3s sovereign cluster (AST-022), 2026-06-23. The live
      production data-plane has moved to K3s (Phase-1 ground-truth §1/§5 D2/D3); this Coolify
      estate is the OLD topology. NOT decommissioned and NOT deleted (append-only): all three
      boxes (AST-009/AST-010/AST-018) are still running and billing (zombie legacy, ground-truth
      F4) and the Restormel product app itself is NOT yet migrated in-cluster (still on this
      Coolify estate per F-note "Restormel NOT deployed in-cluster"). Retained as an in-scope
      asset until formally decommissioned (follow-up PBI: decommission/document the 3 legacy
      Coolify servers, ground-truth F4). The per-box detail below is RETAINED but historical for
      role/topology; trust the Phase-1 ground-truth for the current live placement.
      Three Hetzner Cloud servers in Helsinki (hel1-dc2), managed together, form the primary
      compute plane: Box 1 (.150 / AST-010) is the Coolify control plane + Traefik, Forgejo,
      and shared services; Box 2 (.167 / AST-009) is the live production runtime
      (restormel-dashboard-prod, restormel-worker-prod); Box 3 (.166 / AST-018) is the
      dedicated CI build runner (not a Coolify server). Boxes 1 and 2 are connected over
      private network AST-011; Box 3 shares the same private network. Self-hosts Forgejo
      (git.allotmentology.tech), the Restormel app, the allotmentology.tech Next.js company
      portal (AST-017), self-hosted Postgres, BetterAuth, Infisical (AST-013), and SurrealDB
      (AST-014). Backups target the encrypted Hetzner Storage Box in Falkenstein (AST-012).
      Firewall: inbound 22/80/443 only; Coolify :8000 not internet-exposed. Single compute
      region/cluster — see RISK-001 (treated via the split + backups). See AST-009/010/011/018
      for per-box detail.
      NOTE: the Hetzner server NAMES are legacy and misleading — "allotmentology-pilot" is
      Box 1 (.150, Coolify/buildops), "surreal-forgejo" is Box 2 (.167, prod runtime), and
      "restormel-build" is Box 3 (.166, CI runner). Names reflect initial provisioning, not
      current roles.
      REGION RECONCILED (2026-06-17, founder): compute is Helsinki, FI; the earlier
      "Nuremberg/Falkenstein DE" flag referred to the Falkenstein storage box (AST-012),
      not the compute. The AST-009/010/011 "Helsinki FI" region is confirmed correct.

