  - id: AST-003
    asset: "Coolify compute — Hetzner (Helsinki, two-server cluster)"
    type: infrastructure
    owner: founder
    product: shared
    location: "Hetzner Cloud, Helsinki, FI (EU)"
    notes: >
      Two Hetzner Cloud servers in Helsinki, managed together as a single Coolify cluster,
      form the primary compute plane — Box A (.167, AST-009) for the live product and Box B
      (.150, AST-010) for build/ops, over a private network (AST-011). Self-hosts Forgejo
