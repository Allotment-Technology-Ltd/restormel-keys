#   status: approved
#   approved-by: Adam Boon
#   approved-on: 2026-06-17
#   classification: internal
#   retention: P6Y-after-superseded
#
# ISMS scope: Restormel product and supporting infrastructure only.
# Plot / Sophia / allotmentology.tech are explicitly out of scope at this stage.
#
# Last updated: 2026-06-17 — AST-003 notes updated to reflect in-execution split;
#   added AST-009 (Box A prod runtime), AST-010 (Box B build/ops), AST-011 (private network),
#   AST-012 (BX11 + restic backup repos) per REC-PLAN-012 / REC-PLAN-015.

assets:
  - id: AST-001
    asset: "restormel-keys repo"
    type: code/records
    owner: founder
    location: "Forgejo (canonical) + GitHub mirror (push-only)"
    notes: >
      System of record. Contains governance docs and Restormel SvelteKit app
      (apps/dashboard) and CI configuration. Forgejo is primary; GitHub mirror
      is push-only.

  - id: AST-002
    asset: "restormel-ops repo"
    type: ops/records
    owner: founder
    location: "Forgejo only (no mirror)"
    notes: "Operator cockpit; cowork-relay, playbooks, cowork-outbox"

  - id: AST-003
    asset: "Hetzner Helsinki compute — two-box topology (in-execution split)"
    type: infrastructure
    owner: founder
    location: "Hetzner, Helsinki FI (EU)"
    notes: >
      IN-EXECUTION SPLIT (REC-PLAN-012 + REC-PLAN-015): formerly a single-box
      topology ("everything on .150"). Now splitting into two CX33 boxes:
      Box A (.167, AST-009) for the live product and Box B (.150, AST-010) for
      build/ops + SurrealDB, connected over a private network (AST-011).
      Treats RISK-001. See AST-009/010/011 for per-box detail.

  - id: AST-009
    asset: "Box A — prod runtime (77.42.124.167)"
    type: infrastructure
    owner: founder
    location: "Hetzner CX33, Helsinki FI (EU) — public IP 77.42.124.167, private 10.10.1.3"
    notes: >
      Post-split prod runtime box (REC-PLAN-012). Runs: Restormel dashboard
      (Coolify app UUID mxq1lnsehg7sdfzn0a8tnkxo), worker (UUID ppvmqm1hbnu09kjgttdl5og4),
      self-hosted app Postgres, Ory Hydra + its DB. Connected to Box B over
      private network AST-011. Coolify-managed from Box B. Backup: restic
      cron 03:00 daily → BX11 repo restic-surreal (AST-012). During migration
      transition: also temporarily hosts SurrealDB until Phase 2 complete.

  - id: AST-010
    asset: "Box B — build/ops (77.42.125.150)"
    type: infrastructure
    owner: founder
    location: "Hetzner CX33, Helsinki FI (EU) — public IP 77.42.125.150, private 10.10.1.2"
    notes: >
      Build/ops box (REC-PLAN-012). Runs: Forgejo (canonical repo), Forgejo
      CI runner, Coolify (manages Box A over private net), self-hosted monitoring,
      SurrealDB (migrated from .167 in Phase 2). Backup: restic cron 02:00
      daily → BX11 repo restic-buildops (AST-012). deploy@ is the SSH user.

  - id: AST-011
    asset: "Private network — restormel-internal"
    type: infrastructure
    owner: founder
    location: "Hetzner eu-central (Helsinki), CIDR 10.10.0.0/16, subnet 10.10.1.0/24"
    notes: >
      Hetzner private network connecting Box A (10.10.1.3) and Box B (10.10.1.2).
      Used for: Coolify (.150) deploying to .167; dashboard (.167) → SurrealDB (.150);
      SSH/management private-only once public SSH is hardened. No egress cost
      intra-zone. Created as part of REC-PLAN-012 Phase 1.

  - id: AST-004
    asset: "Neon Postgres (legacy — decommissioning)"
    type: data-store
    owner: founder
    location: "Neon SaaS / AWS eu-west"
    notes: >
      DECOMMISSIONING. Backup only while self-hosted Postgres on AST-003
      settles. Planned removal ~2026-06-30. No new data to be written here.
      Remove this entry and the matching suppliers.yaml row on confirmed deletion.

  - id: AST-005
    asset: "restormel.dev domain"
    type: domain
    owner: founder
    location: "Vercel (registrar + DNS)"
    notes: "Primary product domain; DNS managed by Vercel."

  - id: AST-006
    asset: "Founder workstation (MacBook)"
    type: endpoint
    owner: founder
    location: "UK (remote)"
    notes: >
      Holds repo clones, cowork-relay token, SSH keys, Mac keychain entries.
      FileVault full-disk encryption: confirmed enabled (2026-06-15).
      .env files on local disk are gitignored and not committed to any repo.

  - id: AST-007
    asset: "Secrets estate (distributed — control gap)"
    type: secrets
    owner: founder
    location: "Multiple — see notes"
    notes: >
      Secrets currently distributed across: .env files (server/local disk,
      gitignored — not committed), Forgejo CI secrets/variables, GitHub
      secrets/variables (legacy mirror), Restormel app internal credential
      store, Mac keychain. Unification into a single auditable secrets store
      is a planned improvement. Until unified, quarterly access review must
      cover all locations. Tracked as a risk in risk-register.yaml.

  - id: AST-008
    asset: "Company Google Drive (allotmenttech@gmail.com)"
    type: cloud-storage
    owner: founder
    location: "Google (US)"
    notes: >
      Hosts the Drive⇄Forgejo mirror (My Drive/Restormel/): a markdown projection of
      public/internal records for the Claude chat project, with Drive edits round-tripping
      back via the relay. Markdown only; the classification gate keeps confidential/restricted
      records out (they never leave Forgejo) and evidence/ is excluded. Google is a
      sub-processor (suppliers.yaml). US-SaaS — sovereignty trade-off accepted for
      internal/non-regulated records only.

  - id: AST-012
    asset: "BX11 Storage Box + restic backup repos"
    type: backup/storage
    owner: founder
    location: "Hetzner Storage Box BX11, Falkenstein DE (EU) — u613941.your-storagebox.de"
    notes: >
      Hetzner BX11 (1 TB) used as the offsite backup target for all Restormel
      infrastructure. Accessed via SFTP/restic from Box A and Box B.
      Two restic repos:
        - restic-surreal: Box A SurrealDB data → BX11:/restic-surreal (cron 03:00 UTC,
          Box A 77.42.124.167). Covers SurrealDB data directory.
        - restic-buildops: Box B build/ops data → BX11:/restic-buildops (cron 02:00 UTC,
          Box B 77.42.125.150). Covers Forgejo, Coolify config, Box B Postgres.
      Both repos: retention keep-daily 7 / keep-weekly 4 / keep-monthly 6.
      Repos are restic-encrypted (passphrase in secrets estate / AST-007).
      EU-sovereign backup — Falkenstein DE, no third-party SaaS. Mitigating control
      for RISK-001 and RISK-009. Restore drill required per REC-PLAN-015 (Phase 8).
      DR runbook: planning/infra-migration-rollback-runbook.md (REC-PLAN-015).
