  - id: AST-018
    asset: "Box C — dedicated CI build runner (204.168.216.166)"
    type: infrastructure
    owner: founder
    product: shared
    location: "Hetzner cx43 (8 vCPU shared / 16 GB / 160 GB), Helsinki FI (EU) — public IP 204.168.216.166, private 172.16.0.4 (restormel-internal)"
    notes: >
      Dedicated Forgejo CI build runner ('hetzner-build'), provisioned 2026-06-19 to move build
      execution OFF AST-010 (.150) so CI builds no longer contend with SurrealDB (AST-014) — the
