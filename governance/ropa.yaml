    lawful_basis: "LEGAL-OBL — Companies Act 2006, HMRC requirements (Art 6(1)(c))"
    data_subjects: "Director / PSC (Adam Boon)"
    data_categories:
      - "Director name, address (registered), nationality, date of birth (Companies House)"
