      working documents in the self-hosted Huly instance (AST-030). INTERNAL TOOL: data subjects are
      the founder/operators themselves, not customers or external third parties.
    lawful_basis: >
      LI / legitimate organisational interest in running the company's internal work (Art 6(1)(f)).
      As an internal staff tool over the operators' own data this is low-risk; no third-party data
      subjects by default.
    data_subjects: "Founder + any operators with a Huly local account (internal only)"
    data_categories:
      - "Huly local-account identity (email + hashed credential)"
      - "Issue/project/task content + working documents the operators author (may incidentally contain personal data they type in)"
    recipients:
      - "Self-hosted in-cluster on AST-022 (Helsinki EU) — CockroachDB / Elasticsearch / Redpanda (AST-030)"
      - "Hetzner Object Storage S3 fsn1 (Falkenstein EU, AST-029) — document/file blobs, bucket huly-allotmentology"
      - "No external recipients; not exposed to customers (portal forward-auth gated, disableSignup:true)"
    transfers: >
      None — fully EU-resident (Helsinki compute + Falkenstein object storage), self-hosted, no
      third-party SaaS in the data path. Secrets via ESO/Infisical (AST-027/013).
