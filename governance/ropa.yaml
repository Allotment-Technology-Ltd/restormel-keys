  - id: PROC-008
    purpose: >
      Contact / enquiry handling — receiving and responding to enquiries via the
      allotmentology.tech contact form. Live — form deployed 2026-06-19.
    lawful_basis: "LI — responding to enquiries the person initiated (Art 6(1)(f))"
    data_subjects: "Enquirers / correspondents (public, prospects)"
    data_categories:
      - "Name, email address"
      - "Message content of the enquiry"
    recipients:
      - "Migadu (EU mail) — enquiry-notification transport (enquirer data arrives here as notification)"
      - "Google Workspace / Gmail (US) — founder inbox copy (cf. PROC-005, DAT-007); SCCs/DPA apply"
    transfers: >
      Enquiry data held in Migadu EU mailbox; copy to Google Workspace (US) — Google DPA + SCCs apply.
    retention: "Mailbox copies, deleted within 12 months of enquiry closed."
    security_measures: >
      TLS; honeypot + server-side validation (zod); spam protection. Data minimisation: email-only, no DB.
    privacy_notice_ref: "https://allotmentology.tech/privacy (v1.1, 2026-06-19)"
    product: allotmentology.tech

  - id: PROC-009
    purpose: >
      Marketing communications (Restormel) — product newsletters, release notes, and product
      updates to subscribers who have opted in. PLANNED (REC-PLAN-017) — not yet operating;
      this sets the target. Strictly separate from transactional/auth email (PROC-001).
    lawful_basis: >
      CONSENT — Art 6(1)(a) for net-new newsletter sign-ups (double opt-in);
      PECR reg. 22(3) "soft opt-in" (relied on as legitimate interests, Art 6(1)(f)) for existing
      customers / Founders Circle members / prior enquirers receiving updates about the same
      product, with a clear opt-out in every message. DPIA screening outcome: not high-risk; no
      full DPIA required (revisit if behavioural profiling/segmentation or third-party list import added).
    data_subjects: "Subscribers who opted in (customers, Founders Circle members, enquirers, newsletter sign-ups)"
    data_categories:
      - "Email address and display name"
      - "Marketing list membership + per-category opt-in flags (product_updates, newsletter, release_notes)"
      - "Consent records: source (soft-opt-in | double-opt-in | import), consent timestamp, unsubscribe timestamp"
      - "Email engagement events (opens/clicks) via the ESP"
    recipients:
      - "Self-hosted Postgres on AST-003 (email_preferences — authoritative consent/preference ledger, EU)"
      - "Brevo (Sendinblue SAS, France/EU) — operational marketing send list + delivery; EU residency"
    transfers: "None — consent ledger self-hosted EU; sending via Brevo EU (EU residency). Brevo DPA to be accepted at engagement."
    retention: >
      Subscriber + consent records: kept while subscribed; on unsubscribe, retain a minimal
      suppression record (email hash + unsubscribe timestamp) to honour the opt-out, and remove
      from active list. Consent audit trail retained per accountability needs.
    security_measures: >
      Double opt-in for net-new; soft opt-in (documented lawful basis) for existing; RFC 8058
      one-click List-Unsubscribe header + visible footer link on EVERY marketing email; no-login
      unsubscribe page writing our DB first then syncing suppression to Brevo; in-product
      preference centre; transactional/security email never gated by marketing preferences;
      separate sending subdomain (news.restormel.dev) with its own SPF/DKIM/DMARC.
    privacy_notice_ref: >
      [PLACEHOLDER — gated to Phase 2 launch (REC-PLAN-017 §8, publish-when-live)]. The public
      privacy notice (https://restormel.dev/keys/privacy) MUST carry a marketing-communications
      section (lawful basis, categories, retention, right to object/withdraw) BEFORE the first
      marketing send.
    product: restormel

  - id: PROC-010
    purpose: >
      Provide the non-sovereign QUICK-START database tier for Restormel Connect — provision and operate
      a dedicated per-workspace managed Postgres (Neon) for workspaces that explicitly opt into the
      quick-start tier instead of the EU/UK self-hosted sovereign default. PLANNED (REC-ADR-009, PR #285)
      — GO-LIVE-GATED: no customer data on Neon until the governance triplet (this entry + suppliers.yaml
      + DPIA evidence/dpia/neon-quick-start-tier.md) is filed AND founder-approved.
    lawful_basis: >
      CONTRACT — provision of the tier the user selected at workspace creation (Art 6(1)(b)). Tier choice
      + non-sovereign acknowledgement recorded against the workspace.
    data_subjects: "Registered users and their end-users whose workspace data lands in a quick-start (Neon) workspace DB"
    data_categories:
      - "Connect ingest content, verification results, provenance traces (workspace product data)"
      - "Workspace / project metadata"
      - "Per-workspace DB connection credentials (ciphertext; stored in Restormel vault, encrypted at rest)"
    recipients:
      - "Neon Inc. (US company; data resident in AWS eu-central-1 Frankfurt, EU) — managed per-workspace Postgres"
      - "Hetzner (Helsinki EU) — Restormel control plane orchestrating provisioning + holding encrypted creds + usage ledger"
    transfers: >
      Data at rest resides in the EU (Frankfurt). Neon Inc. is US-controlled, so a transfer instrument is
      required for potential US access despite EU residency: Neon DPA + SCCs/IDTA apply ([PLACEHOLDER —
      confirm] accepted — see suppliers.yaml). EU-region residency is a mitigation, not an elimination —
      see DPIA (Schrems-II / FISA).
    retention: >
      Workspace product data: retained while the workspace is active; physically deleted via Neon project
      deletion within 30 days of workspace closure / Art-17 erasure request / day-0 reset. Project deletion
      erases the entire per-workspace DB (no residual rows).
    security_measures: >
      Dedicated per-workspace Neon project (physical isolation); EU-region pin at creation (immutable);
      connection credentials encrypted at rest, never logged; per-project quota caps; provision/suspend/delete
      lifecycle tied to the Stage-2 state machine; usage metering + budget guard. Sovereign self-hosted tier
      offered as default and as one-click migration.
    privacy_notice_ref: >
      [PLACEHOLDER — confirm] the privacy notice MUST list Neon (quick-start tier) as a sub-processor and
      describe the EU-region/non-sovereign nature before the tier is offered. Update
      https://restormel.dev/keys/privacy §3.
    product: restormel
