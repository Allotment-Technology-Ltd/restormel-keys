# record:
#   id: REC-GOV-003
#   title: Record of Processing Activities (RoPA — UK GDPR Art 30)
#   class: governance
#   control-tier: 2
#   owner: founder
#   status: approved
#   approved-by: founder
#   approved-on: 2026-06-17
#   classification: internal
#   retention: life-of-processing
#
# Controller: Allotment Technology Ltd, company no. 16925574, contact@restormel.dev
# ISMS scope: Allotment Technology Ltd — company-wide across in-scope products
# (Restormel + allotmentology.tech). Plot/Sophia out of scope until their phases.
# Per-activity scope is in the product: field.
# allotmentology.tech requires its own published privacy notice before PROC-008 collects
# data (none yet — see risk register RISK-011).
#
# Lawful bases used:
#   CONTRACT   — UK GDPR Art 6(1)(b): processing necessary to perform a contract with the data subject
#   LI         — UK GDPR Art 6(1)(f): legitimate interests of the controller
#   LEGAL-OBL  — UK GDPR Art 6(1)(c): compliance with a legal obligation
#
# Privacy notice: https://restormel.dev/keys/privacy (v2026-03-18)
# NOTE: Privacy notice sub-processor list is out of date — see action items below.
#
# Action items for next privacy notice version bump:
#   - Remove "Vercel: hosting" (Vercel is DNS/registrar only; app is on Hetzner/Coolify)
#   - Remove "Neon" once decommissioned (~2026-06-30)
#   - Add "Hetzner (Coolify)" as the primary compute sub-processor
#   - Clarify "authentication provider" = BetterAuth (self-hosted on Hetzner)

processing_activities:

  - id: PROC-001
    purpose: >
      Provide the Restormel Keys SaaS service — user accounts, dashboard,
      API routing, BYOK custody, Connect ingest/verify pipelines.
    lawful_basis: "CONTRACT — T&Cs accepted at sign-up (Art 6(1)(b))"
    data_subjects: "Registered users (Founders Circle members and paying customers)"
    data_categories:
      - "Account identity: email address, display name, internal user ID"
      - "GitHub avatar URL (where user authenticates via GitHub OAuth)"
      - "Session tokens and OAuth account links (BetterAuth)"
      - "Workspace / project metadata"
      - "Gateway key hashes (rk_… prefix + hash; plaintext never stored)"
      - "Provider credential ciphertext (where Connections used; encrypted at rest)"
      - "Connect: ingest job metadata, verification results, provenance traces"
    recipients:
      - "Hetzner (Coolify host, Helsinki EU) — self-hosted compute; all data transits/resides here"
      - "Zuplo (US edge) — control-plane API gateway; API request metadata only"
    transfers: >
      Core service: no transfer (self-hosted EU, Hetzner Helsinki).
      Zuplo (US): API request metadata; Zuplo DPA + SCCs apply.
    retention: >
      Account and workspace data: retained while account is active; deleted
      within 30 days of account closure on request.
    security_measures: >
      TLS encryption in transit; BetterAuth session management; API key
      hashing (prefix + hash only); provider credential encryption at rest
      (where Connections enabled); access controls on self-hosted Postgres;
      Forgejo-anchored audit trail.
    privacy_notice_ref: "https://restormel.dev/keys/privacy §2–3"
    product: restormel

  - id: PROC-002
    purpose: >
      Billing and subscription management — record and reflect plan status
      for paying customers; maintain financial records for legal compliance.
    lawful_basis: >
      CONTRACT — subscription T&Cs (Art 6(1)(b));
      LEGAL-OBL — accounting/tax records (Companies Act 2006, HMRC) (Art 6(1)(c))
    data_subjects: "Paying customers"
    data_categories:
      - "Paddle customer ID and subscription ID (opaque identifiers — no name, email, or card data)"
      - "Plan status and subscription metadata"
      - "Director financial data (accounting records — FreeAgent/Mettle)"
    recipients:
      - "Paddle (UK, merchant of record) — holds all personal billing data (name, email, address, card); Restormel stores IDs only"
      - "FreeAgent (UK) — accounting records (director-only data)"
      - "Mettle (UK, FCA-regulated) — business banking (director-only data)"
    transfers: >
      None — Paddle is a UK company; FreeAgent and Mettle are UK-based.
    retention: >
      Paddle IDs: duration of subscription.
      Accounting records: 7 years (Companies Act / HMRC requirement).
    security_measures: >
      Paddle processes all sensitive billing data as MoR; Restormel stores
      only opaque IDs. FreeAgent and Mettle have their own regulatory
      security obligations.
    privacy_notice_ref: "https://restormel.dev/keys/privacy §2 (billing), §3"
    product: restormel

  - id: PROC-003
    purpose: >
      Service security, abuse prevention, and incident investigation —
      maintaining audit logs and operational monitoring to protect the
      service and its users.
    lawful_basis: "LI — security of the service and protection of users (Art 6(1)(f))"
    data_subjects: "All registered users"
    data_categories:
      - "Audit events: user ID, action type, timestamp, IP address"
      - "Operational logs: request status, performance metrics, error codes"
    recipients:
      - "Hetzner (Coolify host, Helsinki EU) — self-hosted Postgres; audit_events table"
      - "Sentry (US) — error/exception tracking; confirmed no PII in payloads (sendDefaultPii: off)"
    transfers: >
      Audit logs: no transfer (self-hosted EU).
      Sentry (US): error payloads only; no personal data confirmed; Sentry DPA applies.
    retention: >
      Audit events: 12 months online (hot); 6 years archived (cold).
      Annual compliance review scheduled (Cowork task: isms-audit-events-retention-review).
      Operational logs: limited period per Sentry default (90 days).
    security_measures: >
      Self-hosted Postgres with access controls; Sentry configured with
      sendDefaultPii: off; IP addresses treated as personal data and
      subject to same retention limits.
    privacy_notice_ref: "https://restormel.dev/keys/privacy §2 (operational data), §3"
    product: restormel

  - id: PROC-004
    purpose: >
      Product analytics and improvement — understanding feature usage to
      improve reliability and guide product development.
    lawful_basis: "LI — product improvement and service reliability (Art 6(1)(f))"
    data_subjects: "All registered users (pseudonymous)"
    data_categories:
      - "Pseudonymous usage events: device/session IDs, feature interactions, page views"
      - "No names, emails, or directly identifying fields sent to analytics"
    recipients:
      - "PostHog EU — product analytics (EU-hosted instance)"
    transfers: "None — PostHog EU data residency."
    retention: "PostHog EU default (2 years); reviewed annually."
    security_measures: >
      Pseudonymisation at source (no identify() calls with email or name);
      PostHog EU instance ensures data residency within EEA.
    privacy_notice_ref: "https://restormel.dev/keys/privacy §2 (analytics), §3"
    product: restormel

  - id: PROC-005
    purpose: >
      Customer and prospect communications — responding to support requests,
      managing early-access/Founders Circle onboarding, commercial outreach.
    lawful_basis: "LI — customer relationship management and support (Art 6(1)(f))"
    data_subjects: "Customers, Founders Circle members, prospects, correspondents"
    data_categories:
      - "Names and email addresses"
      - "Message content of support and commercial correspondence"
    recipients:
      - "Google Workspace / Gmail (US) — email platform"
    transfers: >
      UK → US (Google Workspace). Google Workspace Data Processing Amendment
      + SCCs apply. NOTE: DPA acceptance must be confirmed in Google Admin
      Console → Account → Legal (flagged as verify-and-accept in suppliers.yaml).
    retention: >
      No formal retention period set. Action: define and implement before
      significant customer volume. Interim: review and purge annually.
    security_measures: >
      Google Workspace built-in security (TLS, at-rest encryption, 2FA on
      admin account). Founder evaluating alternative email provider.
    privacy_notice_ref: "https://restormel.dev/keys/privacy §4 (sharing)"
    product: restormel

  - id: PROC-006
    purpose: >
      Statutory company records — maintaining records required by Companies
      Act 2006 and HMRC for Allotment Technology Ltd.
    lawful_basis: "LEGAL-OBL — Companies Act 2006, HMRC requirements (Art 6(1)(c))"
    data_subjects: "Director / PSC (Adam Boon)"
    data_categories:
      - "Director name, address (registered), nationality, date of birth (Companies House)"
      - "PSC details (persons with significant control)"
      - "Financial and accounting records"
    recipients:
      - "FreeAgent (UK) — accounting"
      - "Mettle (UK, FCA-regulated) — banking"
      - "Quality Company Formations (UK) — formation agent (one-off; largely complete)"
      - "Companies House (UK) — statutory filing (controller, not processor)"
    transfers: "None — all UK."
    retention: "7 years (Companies Act / HMRC); Companies House filings: permanent public record."
    security_measures: >
      FreeAgent and Mettle subject to their own UK regulatory security
      obligations. Companies House is a public register by statute.
    privacy_notice_ref: "https://restormel.dev/keys/privacy §3 (legal obligation)"
    product: company-wide

  - id: PROC-007
    purpose: >
      Company-portal access / identity management — authenticating the founder into the
      allotmentology.tech portal.
    lawful_basis: "LI — secure administration of company systems (Art 6(1)(f))"
    data_subjects: "Founder/director (Adam Boon) — sole user at this stage"
    data_categories:
      - "Account identity: email, name"
      - "Session tokens; magic-link verification records (BetterAuth)"
    recipients:
      - "Self-hosted Postgres on AST-003 (allotmentology.tech BetterAuth tables) — EU"
      - "Migadu (EU mail) — delivers sign-in magic-link emails"
    transfers: "None — self-hosted EU; magic-link email via Migadu (EU mail servers)."
    retention: "Duration of account."
    security_measures: >
      Self-contained BetterAuth; magic-link (passwordless) sign-in; MFA enabled; TLS; self-hosted
      Postgres access controls. Founder-only. Secrets currently in local .env (residual under RISK-002).
    privacy_notice_ref: "Internal access — no public data subjects at this stage."
    product: allotmentology.tech

  - id: PROC-008
    purpose: >
      Contact / enquiry handling — receiving and responding to enquiries via the
      allotmentology.tech contact form. PLANNED — not yet configured; this sets the target.
    lawful_basis: "LI — responding to enquiries the person initiated (Art 6(1)(f))"
    data_subjects: "Enquirers / correspondents (public, prospects)"
    data_categories:
      - "Name, email address"
      - "Message content of the enquiry"
    recipients:
      - "Self-hosted Postgres on AST-003 (EU) — target store"
      - "Migadu (EU mail) — enquiry-notification transport"
      - "Google Workspace / Gmail (US) — founder inbox copy (cf. PROC-005, DAT-007); SCCs/DPA apply"
    transfers: >
      Storage: none (self-hosted EU). Notification copy lands in Google Workspace (US) — Google
      DPA + SCCs apply, as with PROC-005.
    retention: "Target: delete or anonymise within 12 months of the enquiry being closed."
    security_measures: >
      Keep submissions on EU infrastructure (no US form SaaS); TLS; self-hosted Postgres access
      controls; spam/abuse protection on the form.
    privacy_notice_ref: >
      [PLACEHOLDER — none published yet]. A privacy notice MUST be live at allotmentology.tech
      before the form collects data (see risk register RISK-011).

  - id: PROC-009
    purpose: >
      Marketing-email consent and preference management — recording, on a per-address basis, which
      categories of marketing email (product updates, newsletter, release notes) a person has
      consented to, the source and time of that consent, and any withdrawal (unsubscribe). The
      authoritative consent ledger backing the in-product preference centre and the one-click
      unsubscribe flow (REC-PLAN-017 Phase 3). NO marketing is sent yet — infrastructure only.
    lawful_basis: >
      CONSENT / PECR soft-opt-in (Art 6(1)(a) + PECR reg. 22) — opt-in by default, never opt-out;
      consent_source records the basis (soft-opt-in / double-opt-in / import). Transactional and
      security email is out of scope of this activity (it relies on CONTRACT / LI per PROC-001/003).
    data_subjects: "Subscribers / account holders who receive (or may receive) marketing email"
    data_categories:
      - "Email address (identifier)"
      - "Linked account id (when known)"
      - "Per-category marketing opt-in flags"
      - "Consent source + timestamp; unsubscribe timestamp"
      - "Opaque unsubscribe token (capability secret)"
    recipients:
      - "Self-hosted Postgres on AST-003 (EU) — email_preferences (DAT-013)"
      - "Brevo (EU) — PLANNED Phase 4 downstream send list, synced FROM this ledger (not yet wired)"
    transfers: >
      Storage: none (self-hosted EU). When the Phase 4 send path lands, the send list is synced to
      Brevo (EU); add Brevo to suppliers.yaml + the privacy notice before any marketing is sent.
    retention: >
      Consent and withdrawal records kept for the life of the marketing relationship plus an
      evidentiary tail to demonstrate consent/withdrawal; suppression rows retained so an
      unsubscribed address is not re-mailed.
    security_measures: >
      EU-only storage; TLS; parameterised queries; consent recorded as the system of record (not
      delegated to the ESP). Unsubscribe is public but token-gated by a signed (HMAC), constant-time
      verified, opaque capability token; the endpoint is rate-limited, idempotent, never reveals
      whether an address exists, and never logs the token or address. Preference centre is
      session-authenticated and scoped to the signed-in user. See security-baseline.md.
    privacy_notice_ref: >
      https://restormel.dev/keys/privacy — update at the next version bump to describe the consent
      ledger, the preference centre, and (when wired) Brevo as a marketing sub-processor.
    product: allotmentology.tech
