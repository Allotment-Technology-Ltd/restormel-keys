# record:
#   id: REC-GOV-005
#   title: Supplier / sub-processor register
#   class: governance
#   control-tier: 2
#   owner: founder
#   status: approved
#   approved-by: Adam Boon
#   approved-on: 2026-06-19
#   last-reviewed: 2026-06-19
#   classification: internal
#   retention: P6Y-after-superseded
#
# ISMS scope: Restormel only.
# DPA note: for standard SaaS products, acceptance of T&Cs at signup constitutes
# valid DPA acceptance where the DPA is embedded in those T&Cs (UK GDPR Art 28).
# Two exceptions require explicit in-portal acceptance and are flagged: Google
# Workspace (Admin Console → Account → Legal) and Hetzner (control panel AVV).
# Sub-processor changes must fire the customer change-notification hook (Phase 5).

suppliers:

  # --- INFRASTRUCTURE ---

  - name: Hetzner (Coolify host)
    provides: >
      Self-hosted compute — three Helsinki hel1-dc2 servers: Box 1 / .150 (CX33,
      "allotmentology-pilot" — LEGACY NAME; actual role: Coolify control plane + Traefik +
      Forgejo + shared services; Coolify reg: restormel-buildops-b-150); Box 2 / .167 (CX33,
      "surreal-forgejo" — LEGACY NAME; actual role: live prod runtime restormel-dashboard-prod +
      restormel-worker-prod; Coolify reg: restormel-prod-a-167); Box 3 / .166 (CX43,
      "restormel-build"; role: dedicated Forgejo CI build runner, NOT a Coolify server).
      Plus BX11 Falkenstein storage box (u613941.your-storagebox.de) for restic backups,
      and (added 2026-06-20) Hetzner Object Storage (S3, fsn1 Falkenstein) for CloudNativePG
      Postgres backups — cross-region PITR for the K3s migration (bucket
      restormel-cnpg-backups-fsn1). And (added 2026-06-20) Hetzner Cloud DNS — authoritative
      DNS hosting for restormel.dev and allotmentology.tech (zones migrated 2026-06-20 off
      Vercel DNS and the orderbox registrar DNS respectively; nameservers *.ns.hetzner.com).
      See AST-009/010/018/012/019 and AST-020/021 (DNS zones).
    role: sub-processor
    location: "Helsinki, Finland (EU) — compute; Falkenstein, Germany (EU) — storage (BX11 + Object Storage); Hetzner Cloud DNS (EU)"
    data_processed: "All in-scope Restormel data (transits / resides on these hosts); plus public DNS zone records (hostname→address) and transient resolver/client IPs for the two domains"
    dpa: "verify-and-accept — Hetzner Order Processing Contract (AVV) requires explicit acceptance in Hetzner control panel; confirm this has been done"
    sovereignty: ok
    notes: >
      DNS hosting added 2026-06-20 (Hetzner Cloud DNS) — SAME legal entity + SAME AVV as
      compute/storage, so this EXTENDS the existing sub-processor (no new sub-processor to
      onboard, no new Art 28 notification beyond this register entry). DNS holds only public
      zone records, below the application/customer-data path. Sovereignty-positive: restormel.dev
      DNS moved off US Vercel DNS to EU Hetzner. Availability concentration tracked as RISK-013.

  - name: Neon
    provides: "Postgres (legacy backup — decommissioning)"
    role: sub-processor
    location: "AWS eu-west"
    data_processed: "Product spine data (backup only; no new writes)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: ok
    notes: "DECOMMISSIONING ~2026-06-30. Remove this entry on confirmed deletion."

  - name: Neon (quick-start tier)
    provides: "Managed per-workspace Postgres for the non-sovereign QUICK-START tier (Neon for Platforms; per-workspace project, EU-Frankfurt aws-eu-central-1, scale-to-zero)"
    role: sub-processor
    location: "AWS eu-central-1 (Frankfurt, EU) — region pinned at project creation; Neon Inc. is a US company"
    data_processed: "Customer workspace/Connect product data for workspaces that opt into the quick-start tier (dedicated per-workspace Neon project)"
    dpa: "[PLACEHOLDER — confirm] founder/counsel: accept/confirm Neon DPA + SCCs/IDTA for the Platforms relationship BEFORE first customer project; Neon is US-controlled so a transfer instrument is required even with EU-region residency"
    sovereignty: "flagged — non-sovereign opt-in tier; default tier is EU/UK self-hosted CNPG. EU-region residency is a mitigation, not sovereignty (US company / FISA exposure — see DPIA)."
    products: [restormel]
    notes: >
      Added 2026-06-23 for the Stage-2 quick-start tier (REC-ADR-009, PR #285). GO-LIVE GATE:
      no customer data may land on Neon until this entry + ROPA PROC-009 + the DPIA
      (evidence/dpia/neon-quick-start-tier.md) are filed AND founder-approved. Funded by the Neon
      open-source-programme credit (~$5000/yr) via Neon for Platforms. DISTINCT from the legacy Neon
      backup entry above (decommissioning by 2026-06-30 under RISK-004) — this is a NEW active
      customer-data relationship at a higher risk class, NOT an edit to the dead entry. Confirm
      OSS-programme attribution/usage obligations. Adding this sub-processor MUST fire the customer
      change-notification hook (Phase 5, notify-subprocessor-change.mjs on suppliers.yaml → main).
      Per-workspace isolation; physical project deletion (DELETE /projects/{id}) is the Art-17 erasure
      primitive. Tied to ROPA PROC-009, a new DAT entry, and DPIA evidence/dpia/neon-quick-start-tier.md.

  - name: Vercel
    provides: "Domain REGISTRAR for restormel.dev (DNS hosting retired 2026-06-20 → Hetzner Cloud DNS, AST-020)"
    role: sub-processor
    location: "US"
    data_processed: "Domain registration contact data (director name/email/address)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: review
    notes: >
      Registrar only as of 2026-06-20 — both app hosting (long retired) and DNS hosting (moved to
      Hetzner Cloud DNS, AST-020) are now off Vercel; nameservers were re-pointed at the registrar
      to *.ns.hetzner.com. No customer data; only domain registration details. Low risk. The
      Entri/Brevo OAuth grant that wrote into the Vercel DNS zone is now moot (DNS moved) — see the
      Entri entry's revoke recommendation.

  - name: Entri
    provides: "DNS automation — used by Brevo's automatic domain authentication to write authentication records into the Vercel DNS zone"
    role: tooling
    location: "US [PLACEHOLDER — confirm entity/region]"
    data_processed: "DNS zone configuration for restormel.dev (domain/record data only; no customer or personal data)"
    dpa: "n/a — no personal data processed [PLACEHOLDER — confirm if any terms apply]"
    sovereignty: review
    notes: >
      Added 2026-06-18. Granted OAuth-authorized write access to the Vercel DNS zone on
      2026-06-18 to add Brevo's news.restormel.dev authentication records (Brevo code + DKIM
      CNAMEs). Standing OAuth grant, not ongoing-required (Brevo DKIM rotation runs via
      Brevo-controlled CNAME targets, no further DNS writes needed). Logged as a connector with
      DNS-write scope — NOT a credential exposure (OAuth authorize; no credentials shared).
      RECOMMEND revoking the Entri/Brevo authorization in Vercel (Settings → Integrations /
      Connected accounts) per least privilege now the records are written.

  # --- PRODUCT / ANALYTICS ---

  - name: PostHog EU
    provides: "Product analytics"
    role: sub-processor
    location: "EU"
    data_processed: "Pseudonymous usage events (device/session IDs only; no PII)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: ok

  - name: Zuplo
    provides: "Cloud API gateway"
    role: sub-processor
    location: "US edge"
    data_processed: "API request metadata, auth headers; kept off the verification path"
    dpa: "accepted (standard terms at signup)"
    sovereignty: flagged
    notes: "US edge SaaS; kept off verification/PII path per sovereignty policy. Review if personal data scope changes."

  - name: Sentry
    provides: "Error tracking"
    role: sub-processor
    location: "US (sentry.io default)"
    data_processed: "Error payloads — confirmed no PII (sendDefaultPii: off)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: flagged
    notes: "US SaaS; no personal data in payloads confirmed 2026-06-15. Sovereignty flag retained — review if Sentry config changes."

  # --- BILLING ---

  - name: Paddle
    provides: "Billing / merchant of record"
    role: sub-processor
    location: "UK / EU (Paddle is a UK company)"
    data_processed: "Customer billing data (name, email, address, payment — held by Paddle as MoR); Restormel stores only Paddle subscription/customer IDs"
    dpa: "accepted (standard terms at signup — Paddle merchant agreement includes data processing terms)"
    sovereignty: ok

  # --- COMMUNICATIONS / PRODUCTIVITY ---

  - name: Google Workspace
    provides: "Email (Gmail)"
    role: sub-processor
    location: "US"
    data_processed: "Email correspondence including customer/prospect names, emails, message content"
    dpa: "verify-and-accept — Google Data Processing Amendment requires explicit acceptance in Google Admin Console → Account → Legal; confirm this has been done"
    sovereignty: flagged
    notes: "Founder evaluating alternative email provider (see Migadu). Until migrated, DPA acceptance is required for UK GDPR Art 28 compliance."

  - name: Migadu
    provides: "Transactional / company email — Restormel product transactional mail (auth verification/reset, access-grant notifications, security alerts) + allotmentology.tech app auth magic-links/notifications + allotmentology.tech enquiry notifications"
    role: sub-processor
    location: "Swiss company; EU mail servers"
    data_processed: >
      Email addresses + message content for authentication, access-grant and notification
      emails (registered users + founder/internal addresses). Additionally, from 2026-06-19:
      enquirer personal data (name, email address, message content) via allotmentology.tech
      enquiry-notification emails (third-party data subjects — PROC-008 / DAT-012).
    dpa: >
      Accepted via Migadu's published terms. Migadu's Privacy Policy and Data Processing
      Agreement are combined in a single public document at https://migadu.com/privacy/ which
      states: "This document serves both as our Privacy Policy and as our Data Processing
      Agreement (DPA)." The document confirms GDPR and Swiss FDPA compliance, identifies
      Migadu-Mail GmbH as data controller, discloses sub-processors (Stripe, PayPal) under
      GDPR-compliant agreements, and commits to processing data only for defined purposes.
      Art 28 basis: relying on Migadu's standard published terms (controller/processor
      obligations covered by the public DPA). No separate private signed DPA is available;
      the public DPA at migadu.com/privacy/ constitutes the Art 28 instrument for standard
      accounts. Accepted at account signup (2026-06-17). Verified 2026-06-19.
    sovereignty: "EU mail servers (Swiss company — Migadu-Mail GmbH, Schachen, Switzerland); DPA covered by public terms at https://migadu.com/privacy/"
    products: [restormel, allotmentology.tech]
    notes: >
      Added 2026-06-17. The candidate email provider anticipated in RISK-003 to reduce
      Google Workspace dependency. NOW IN PRODUCTION for both Restormel and allotmentology.tech:
      auth transactional emails (magic-link, reset, verification, security alerts, welcome-on-approval)
      and allotmentology.tech enquiry notifications (third-party enquirer PII).
      Scope expanded 2026-06-18 (REC-PLAN-017): Migadu is the TRANSACTIONAL stream for the
      Restormel product (restormel.dev mailboxes admin@/notify@/contact@, moving to a
      dedicated send.restormel.dev sending subdomain). Transactional ONLY — marketing/bulk
      email goes via Brevo (separate entry, separate subdomain) so the two reputations stay
      isolated.
      SCOPE EXPANDED 2026-06-19: allotmentology.tech enquiry form live — Migadu now carries
      third-party enquirer PII (name/email/message). Art 28 DPA coverage confirmed via
      Migadu's publicly published combined Privacy Policy + DPA (https://migadu.com/privacy/).
      Fire the sub-processor change-notification hook on any further scope change.

  - name: Brevo (Sendinblue)
    provides: "Marketing email — newsletters / release notes from news.restormel.dev; isolated from the transactional stream (Migadu)"
    role: sub-processor
    location: "EU — HQ Paris; data hosted in EU (OVH France/Germany; Google Cloud Belgium)"
    data_processed: "Marketing contact data — subscriber email addresses, names, and engagement/event data for marketing sends"
    dpa: "accepted — DPA embedded in Brevo General Conditions of Use (UK GDPR Art 28). Evidence copy NOT yet filed [PLACEHOLDER — founder: provide the Brevo-supplied DPA (from Brevo's GCU/account), distinct from our own customer DPA REC-LEG-014, to file under evidence/dpa/]"
    sovereignty: ok
    products: [restormel]
    notes: >
      Added 2026-06-18 for the two-stream email split (REC-PLAN-017). Supersedes the earlier
      'planned / not-yet-engaged' Brevo entry — Brevo is now LIVE. Sending domain
      news.restormel.dev authenticated 2026-06-18 (Brevo code + DKIM CNAMEs brevo1/brevo2);
      org DMARC covers it via sp=none, so no Brevo DMARC was added. Brevo ISO 27001:2022
      certified. API key in Infisical (restormel-ops/prod, BREVO_API_KEY); MCP server API key
      deliberately NOT enabled. The marketing-email activity is already in RoPA (PROC-009) +
      data-inventory (DAT-013). Public privacy-notice / sub-processor-page disclosure is GATED
      publish-when-live (first marketing send).

  - name: Notion
    provides: "Docs / workspace (internal tooling)"
    role: tooling
    location: "US"
    data_processed: "Internal company docs; minimal PII (director only)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: flagged
    notes: "Internal tooling only. No customer or regulated data stored here."

  - name: Anthropic (Claude / Cowork)
    provides: "AI assistant / operator (governance and dev tooling)"
    role: tooling
    location: "US"
    data_processed: "Conversation content during governance and development work; not for regulated or customer data"
    dpa: "accepted (standard terms at signup)"
    sovereignty: "flagged — not for regulated data"
    notes: "Internal tooling only. Governance guardrail: no customer PII or API keys to be passed in Cowork sessions."

  - name: GitHub
    provides: "Code mirror (push-only from Forgejo)"
    role: tooling
    location: "US"
    data_processed: "Source code only; no customer data"
    dpa: "n/a (push-only mirror; no personal data)"
    sovereignty: review

  # --- FINANCE / LEGAL ---

  - name: Mettle
    provides: "Business banking"
    role: sub-processor
    location: "UK"
    data_processed: "Director financial data, transaction records"
    dpa: "n/a — UK FCA-regulated bank; data processing covered by regulatory framework and banking T&Cs"
    sovereignty: ok

  - name: FreeAgent
    provides: "Accounting (canonical)"
    role: sub-processor
    location: "UK"
    data_processed: "Director and company financial/accounting records"
    dpa: "accepted (standard terms at signup)"
    sovereignty: ok

  - name: Quality Company Formations
    provides: "Formation agent / company secretary (one-off)"
    role: tooling
    location: "UK"
    data_processed: "Director personal data used during company formation (one-off)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: ok
    notes: "Ongoing data processing is minimal; relationship is largely complete post-formation."
