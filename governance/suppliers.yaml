      and they never leave our self-hosted instance.
    dpa: "n/a — self-hosted open-source software; the vendor (Infisical Inc.) does not process, receive, or have access to any data. Tracked as a software supply-chain supplier, not a data sub-processor."
    sovereignty: ok
    products: [shared]
    notes: >
      ADDED 2026-06-26 (RES-67 / PBI #237). VERIFIED against asset-inventory AST-013. Recorded in the
      supplier register as a SOFTWARE-SUPPLY-CHAIN supplier rather than a data sub-processor: Infisical is
      self-hosted (EU sovereignty + OSS were the deciding reasons — AST-013, secrets.restormel.dev,
      infisical/infisical v0.154.6), so there is no vendor data processing and no cross-border transfer.
      Deployed 2026-06-17 as the single auditable secrets store (REC-POL-004, treating RISK-002); secrets
      delivered in-cluster via the External Secrets Operator (AST-027). Backend master keys (key-names
      ENCRYPTION_KEY / AUTH_SECRET — values never committed) live in /opt/infisical/.env on the box
