      restormel-worker-prod; Coolify reg: restormel-prod-a-167); Box 3 / .166 (CX43,
      "restormel-build"; role: dedicated Forgejo CI build runner, NOT a Coolify server).
      Plus BX11 Falkenstein storage box (u613941.your-storagebox.de) for restic backups,
      and (added 2026-06-20) Hetzner Object Storage (S3, fsn1 Falkenstein) for CloudNativePG
      Postgres backups — cross-region PITR for the K3s migration (bucket
      restormel-cnpg-backups-fsn1). And (added 2026-06-20) Hetzner Cloud DNS — authoritative
      DNS hosting for restormel.dev and allotmentology.tech (zones migrated 2026-06-20 off
      Vercel DNS and the orderbox registrar DNS respectively; nameservers *.ns.hetzner.com).
      See AST-009/010/018/012/019 and AST-020/021 (DNS zones).
    role: sub-processor
    location: "Helsinki, Finland (EU) — compute; Falkenstein, Germany (EU) — storage (BX11 + Object Storage); Hetzner Cloud DNS (EU)"
    data_processed: "All in-scope Restormel data (transits / resides on these hosts); plus public DNS zone records (hostname→address) and transient resolver/client IPs for the two domains"
    dpa: "verify-and-accept — Hetzner Order Processing Contract (AVV) requires explicit acceptance in Hetzner control panel; confirm this has been done"
    sovereignty: ok
    notes: >
      DNS hosting added 2026-06-20 (Hetzner Cloud DNS) — SAME legal entity + SAME AVV as
      compute/storage, so this EXTENDS the existing sub-processor (no new sub-processor to
      onboard, no new Art 28 notification beyond this register entry). DNS holds only public
      zone records, below the application/customer-data path. Sovereignty-positive: restormel.dev
      DNS moved off US Vercel DNS to EU Hetzner. Availability concentration tracked as RISK-013.
      K3s SOVEREIGN CLUSTER (cross-check 2026-06-24): the live K3s cluster (AST-022) and its nodes —
      restormel-sovereign-master1 + restormel-node2 + node3 (3-node etcd HA, build in progress) — are
      additional Hetzner Cloud servers in the SAME Helsinki (hel1) region under the SAME legal entity +
