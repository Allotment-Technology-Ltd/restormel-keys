# ISMS scope: Allotment Technology Ltd — company-wide across all in-scope products
# (Restormel + allotmentology.tech + PlotBudget + Sophia) and shared infrastructure.
# SCOPE EXPANSION (2026-06-23, founder decision): PlotBudget + Sophia now IN scope (they run
# live on the shared in-scope K3s cluster — asset-inventory.yaml AST-022..028). Their live
# sub-processors are added below. Per-supplier scope is in the products: field. See Phase-1
# ground-truth §5 D10 / §6 F10 and PBI #237.
# DPA note: for standard SaaS products, acceptance of T&Cs at signup constitutes
# valid DPA acceptance where the DPA is embedded in those T&Cs (UK GDPR Art 28).
# Two exceptions require explicit in-portal acceptance and are flagged: Google
# Workspace (Admin Console → Account → Legal) and Hetzner (control panel AVV).
# The newly-added LLM/inference + email sub-processors (Resend, AIZOLO, Fireworks, Together,
# Voyage, ElevenLabs) need their Art 28 DPA/AVV status CONFIRMED — flagged [PLACEHOLDER —
# founder/counsel: confirm DPA] per entry; tracked as a follow-up PBI (sub-processor AVV/contract
# confirmation). Do NOT assume acceptance for these until verified.
# Sub-processor changes must fire the customer change-notification hook (Phase 5).

suppliers:

