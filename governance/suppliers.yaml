      _SECRET_ACCESS_KEY — values never in repo) held in Infisical (AST-013), delivered in-cluster via the
      External Secrets Operator (AST-027). EU-sovereign; no third-party SaaS in the backup path.

  - name: Infisical (self-hosted)
    provides: >
      Secret management — self-hosted, open-source Infisical running on our own EU infrastructure as the
      single auditable store for operational secrets. Software supply-chain supplier only; the vendor
      receives no data.
    role: self-hosted software (not a data sub-processor)
