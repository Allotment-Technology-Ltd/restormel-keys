# record:
#   id: REC-GOV-005
#   title: Supplier / sub-processor register
#   class: governance
#   control-tier: 2
#   owner: founder
#   status: approved
#   approved-by: founder
#   approved-on: 2026-06-17
#   classification: internal
#   retention: P6Y-after-superseded
#
# ISMS scope: Allotment Technology Ltd — company-wide across in-scope products
# (Restormel + allotmentology.tech). Plot/Sophia out of scope until their phases.
# Per-supplier scope is in the products: field.
# DPA note: for standard SaaS products, acceptance of T&Cs at signup constitutes
# valid DPA acceptance where the DPA is embedded in those T&Cs (UK GDPR Art 28).
# Two exceptions require explicit in-portal acceptance and are flagged: Google
# Workspace (Admin Console → Account → Legal) and Hetzner (control panel AVV).
# Sub-processor changes must fire the customer change-notification hook (Phase 5).

suppliers:

  # --- INFRASTRUCTURE ---

  - name: Hetzner (Coolify host)
    provides: "Self-hosted compute (Helsinki, 2-server Coolify cluster) + encrypted Storage Box backups (Falkenstein)"
    role: sub-processor
    location: "Helsinki, FI (compute) + Falkenstein, DE (storage box) — both EU"
    data_processed: "All in-scope Restormel and allotmentology.tech data; backups on the Falkenstein storage box"
    dpa: "verify-and-accept — Hetzner AVV requires explicit acceptance in the control panel; confirm done"
    sovereignty: ok
    products: [restormel, allotmentology.tech]

  - name: Neon
    provides: "Postgres (legacy backup — decommissioning)"
    products: [restormel]
    role: sub-processor
    location: "AWS eu-west"
    data_processed: "Product spine data (backup only; no new writes)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: ok
    notes: "DECOMMISSIONING ~2026-06-30. Remove this entry on confirmed deletion."

  - name: Vercel
    provides: "Domain registrar + DNS (restormel.dev)"
    role: sub-processor
    location: "US"
    data_processed: "Domain registration contact data (director name/email/address)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: review
    products: [restormel]
    notes: "No customer data; only domain registration details. Low risk."

  - name: get.tech (Radix)
    provides: "Domain registrar + DNS (allotmentology.tech)"
    role: sub-processor
    location: "[PLACEHOLDER — confirm registrar entity/jurisdiction — Radix, operator of the .tech TLD; likely UAE/India]"
    data_processed: "Domain registration contact data (director name/email/address)"
    dpa: "accepted (standard terms at signup); confirm registrant-data terms"
    sovereignty: review
    products: [allotmentology.tech]
    notes: >
      Registrar for allotmentology.tech (analogous to Vercel for restormel.dev). Holds only
      domain-registration contact details — no customer or regulated data. Low risk. Confirm
      registrar jurisdiction and whether WHOIS privacy is enabled.

  # --- PRODUCT / ANALYTICS ---

  - name: PostHog EU
    provides: "Product analytics"
    role: sub-processor
    location: "EU"
    data_processed: "Pseudonymous usage events (device/session IDs only; no PII)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: ok
    products: [restormel]
    notes: "Extend to allotmentology.tech if the portal adds analytics / error tracking."

  - name: Zuplo
    provides: "Cloud API gateway"
    products: [restormel]
    role: sub-processor
    location: "US edge"
    data_processed: "API request metadata, auth headers; kept off the verification path"
    dpa: "accepted (standard terms at signup)"
    sovereignty: flagged
    notes: "US edge SaaS; kept off verification/PII path per sovereignty policy. Review if personal data scope changes."

  - name: Sentry
    provides: "Error tracking"
    role: sub-processor
    location: "US (sentry.io default)"
    data_processed: "Error payloads — confirmed no PII (sendDefaultPii: off)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: flagged
    products: [restormel]
    notes: "US SaaS; no personal data in payloads confirmed 2026-06-15. Sovereignty flag retained — review if Sentry config changes. Extend to allotmentology.tech if the portal adds analytics / error tracking."

  # --- BILLING ---

  - name: Paddle
    provides: "Billing / merchant of record"
    products: [restormel]
    role: sub-processor
    location: "UK / EU (Paddle is a UK company)"
    data_processed: "Customer billing data (name, email, address, payment — held by Paddle as MoR); Restormel stores only Paddle subscription/customer IDs"
    dpa: "accepted (standard terms at signup — Paddle merchant agreement includes data processing terms)"
    sovereignty: ok

  # --- COMMUNICATIONS / PRODUCTIVITY ---

  - name: Google Workspace
    provides: "Email (Gmail)"
    products: [restormel, allotmentology.tech]
    role: sub-processor
    location: "US"
    data_processed: "Email correspondence including customer/prospect names, emails, message content"
    dpa: "verify-and-accept — Google Data Processing Amendment requires explicit acceptance in Google Admin Console → Account → Legal; confirm this has been done"
    sovereignty: flagged
    notes: "Founder evaluating alternative email provider (see Migadu). Until migrated, DPA acceptance is required for UK GDPR Art 28 compliance."

  - name: Migadu
    provides: "Transactional / company email (auth magic-links + notifications for the allotmentology.tech app)"
    role: sub-processor
    location: "Swiss company; EU mail servers"
    data_processed: "Email addresses + message content for authentication and notification emails (founder / internal addresses at this stage)"
    dpa: "[PLACEHOLDER — founder: confirm terms/DPA + residency at prod cutover]"
    sovereignty: "flagged — pending confirmation"
    products: [allotmentology.tech]
    notes: >
      Added 2026-06-17. The candidate email provider anticipated in RISK-003 to reduce
      Google Workspace dependency. Validated on staging during the auth migration
      (Neon Auth → Better Auth); production cutover is gated. Currently serves the
      allotmentology.tech app (recorded here as a supporting email supplier; the app
      itself enters ISMS scope when the company portal ships). If/when it carries
      customer email, revisit data-inventory + ROPA and fire the sub-processor
      change-notification hook.

  - name: Notion
    provides: "Docs / workspace (internal tooling)"
    products: [company-wide]
    role: tooling
    location: "US"
    data_processed: "Internal company docs; minimal PII (director only)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: flagged
    notes: "Internal tooling only. No customer or regulated data stored here."

  - name: Anthropic (Claude / Cowork)
    provides: "AI assistant / operator (governance and dev tooling)"
    products: [company-wide]
    role: tooling
    location: "US"
    data_processed: "Conversation content during governance and development work; not for regulated or customer data"
    dpa: "accepted (standard terms at signup)"
    sovereignty: "flagged — not for regulated data"
    notes: "Internal tooling only. Governance guardrail: no customer PII or API keys to be passed in Cowork sessions."

  - name: GitHub
    provides: "Code mirror (push-only from Forgejo)"
    products: [restormel, allotmentology.tech]
    role: tooling
    location: "US"
    data_processed: "Source code only; no customer data"
    dpa: "n/a (push-only mirror; no personal data)"
    sovereignty: review

  # --- FINANCE / LEGAL ---

  - name: Mettle
    provides: "Business banking"
    products: [company-wide]
    role: sub-processor
    location: "UK"
    data_processed: "Director financial data, transaction records"
    dpa: "n/a — UK FCA-regulated bank; data processing covered by regulatory framework and banking T&Cs"
    sovereignty: ok

  - name: FreeAgent
    provides: "Accounting (canonical)"
    products: [company-wide]
    role: sub-processor
    location: "UK"
    data_processed: "Director and company financial/accounting records"
    dpa: "accepted (standard terms at signup)"
    sovereignty: ok

  - name: Quality Company Formations
    provides: "Formation agent / company secretary (one-off)"
    products: [company-wide]
    role: tooling
    location: "UK"
    data_processed: "Director personal data used during company formation (one-off)"
    dpa: "accepted (standard terms at signup)"
    sovereignty: ok
    notes: "Ongoing data processing is minimal; relationship is largely complete post-formation."
