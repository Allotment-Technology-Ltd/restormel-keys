# ISMS scope: Restormel product and supporting infrastructure only.
#
# Risk rating matrix (likelihood × impact):
#   L×L = Low   L×M = Low    L×H = Medium
#   M×L = Low   M×M = Medium M×H = High
#   H×L = Medium H×M = High  H×H = High
