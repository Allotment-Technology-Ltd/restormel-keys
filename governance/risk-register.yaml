  - id: RISK-008
    risk: >
      MFA not yet confirmed enabled across all in-scope systems. This creates
      a risk of account compromise via credential theft or phishing on any
      system without a second factor — including high-value targets such as
      Google Workspace (admin), Hetzner control panel, Coolify, Forgejo,
      Mettle (banking), and Paddle (billing).
    asset: "AST-007 — All systems listed in access-control-policy.md §3"
    product: company-wide
    likelihood: M
    impact: H
    rating: High
    treatment_type: mitigate
    treatment: >
      URGENT. Enable MFA on all systems in the priority order defined in
      access-control-policy.md §3 (Priority 1 first: Google Workspace admin,
      Hetzner, Coolify, Forgejo, Mettle, Paddle). Scheduled remediation task:
      isms-mfa-remediation. Update the MFA status table in the access control
      policy and close this risk once all Priority 1 and Priority 2 systems
      are confirmed. When any new service is onboarded, MFA must be enabled
      within 24 hours per access-control-policy.md §2.
    treatment_status: "Open — URGENT. Remediation task scheduled."
    owner: founder
    status: open
    review: 2026-07-15

  - id: RISK-009
    risk: >
      The Hetzner infrastructure split + migration (REC-PLAN-012) moves live data
      stores between boxes — SurrealDB (.167 → .150), the app Postgres, and Ory
      Hydra's DB onto the new prod box (.167) — and repoints DNS. A failed cutover
      risks data loss, extended downtime, or a broken BYO-graph / wss dependency.
    asset: "AST-009/AST-010 — Box A/B compute hosts; SurrealDB; app Postgres; AST-012 BX11"
    product: shared
    likelihood: L
    impact: H
    rating: Medium
    treatment_type: mitigate
    treatment: >
      Per REC-PLAN-012: full backups to BX11 (AST-012) before any move (SurrealDB
      export, pg_dump app + Forgejo, Coolify config export); test-restore into scratch
      first; keep the source copy until the destination is verified; per-phase
      do → verify → rollback with low-TTL DNS and a warm fallback; cut over only
      after verification. The RESTORMEL_VERIFYING_PROXY_REMOTE flag stays OFF until
      Hydra's JWKS/issuer validate.
      DR CONTROLS (added 2026-06-17): scheduled restic backups to BX11 are the
      primary DR controls — restic-surreal (Box A, cron 03:00 UTC) and
      restic-buildops (Box B, cron 02:00 UTC), both with retention keep-daily 7 /
      keep-weekly 4 / keep-monthly 6, encrypted. A restore drill is required as part
      of Phase 8 (REC-PLAN-012) before the migration is declared complete. Consolidated
      break-glass rollback runbook: planning/infra-migration-rollback-runbook.md
      (REC-PLAN-015) — covers per-phase rollback + global abort procedure.
      GAP: no formal BCP/DR policy document exists (governance/bcp-dr-policy.md not yet
      created). This is a noted gap against ISO 27001 A.5.29/A.5.30; RTO < 4h is stated
      in RISK-001 treatment but not anchored in a policy. Owner to create before
      ISO certification attempt.
    treatment_status: "In-treatment — execution in progress; restic backup controls active; restore drill pending (Phase 8); break-glass runbook REC-PLAN-015 published"
    owner: founder
    status: open
    review: 2026-09-15

  - id: RISK-010
    risk: >
      The self-hosted Infisical secret manager (AST-013, secrets.restormel.dev) is a
      new single point of failure and a high-value target. (a) If the box is lost or
      Infisical's Postgres is corrupted without a recoverable backup, runtime secret
      retrieval breaks for anything that depends on `infisical run`. (b) The master
      ENCRYPTION_KEY / AUTH_SECRET live only in /opt/infisical/.env on the box —
      loss of that file means the encrypted secret store cannot be decrypted; theft
      of it plus the Postgres data means full secret disclosure. (c) The admin
      account does not yet have MFA.
    asset: "AST-013 — Infisical secret manager; AST-007 — secrets estate"
    product: shared
    likelihood: L
    impact: H
    rating: Medium
    treatment_type: mitigate
    treatment: >
      1. BACKUP: include the Infisical Postgres in the Box B restic backup
         (AST-012, restic-buildops) via a pg_dump of /opt/infisical/pg, and back up
         /opt/infisical/.env (master key material) to the encrypted backup repo —
         without these, the store is unrecoverable. Add a restore drill to the DR
         procedure. 2. NO PLAINTEXT DELETION until the founder verifies Infisical
         end-to-end (the original plaintext files remain the fallback in the
         meantime). 3. MFA: enable MFA on the Infisical admin account (tracked with
         RISK-008). 4. LEAST PRIVILEGE: CLI access via a read-only (viewer) machine
         identity scoped to one project/env; rotate its client secret on suspected
         exposure (REC-POL-004 §5). 5. SECRET HANDLING: never echo secret values;
         treat any exposure as an incident (REC-POL-004 §7) — this treats the
         in-session credential-exposure risk that motivated the migration.
    treatment_status: >
      In-treatment (updated 2026-06-17): items 1, 2, 4, 5 DONE. (1) BACKUP — the
      Infisical Postgres (pg_dump -Fc) and /opt/infisical/.env master key are now
      included in the Box B restic backup (restic-buildops → BX11); restore drill
      PASSED (snapshot 038f431e: restore exit 0, 509-entry dump TOC, ENCRYPTION_KEY +
      AUTH_SECRET present). (2) PLAINTEXT — founder verified 27 secrets in the vault;
      the Mac plaintext *.env/*.token files have been deleted (SSH keys retained as
      files). (4) LEAST PRIVILEGE — the restormel-cli machine identity's temporary
      admin grant was revoked; it is now viewer/read-only (verified: read 200,
      write 403); local CLI creds held in the macOS keychain (no plaintext on disk).
      (5) SECRET HANDLING — enforced this session (values never echoed). REMAINING:
      item 3, admin MFA — blocked on an Infisical plan upgrade (tracked with RISK-008).
    owner: founder
    status: in-treatment
    review: 2026-09-15

