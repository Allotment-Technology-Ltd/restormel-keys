    treatment_status: "In-treatment (updated 2026-06-17) — Infisical deployed; 27 secrets imported + founder-verified; Mac plaintext *.env/*.token files removed (local CLI access via macOS keychain, read-only viewer identity); server /opt/surreal/.env still holds the SurrealDB root password by necessity (runtime). REMAINING: consolidate Forgejo CI + GitHub mirror secrets into Infisical; admin MFA (RISK-008/RISK-010)"
    owner: founder
    status: in-treatment
    review: 2026-12-15

  - id: RISK-003
    risk: >
      US-SaaS sub-processors handling or transiting personal data without
      confirmed Standard Contractual Clauses (SCCs / IDTA) in place.
      Specifically: Google Workspace (email — customer PII) and Zuplo
      (API gateway — request metadata). Google Workspace DPA also requires
      explicit in-portal acceptance not yet confirmed.
    asset: "Google Workspace (DAT-007), Zuplo (PROC-001)"
    product: shared
    likelihood: L
    impact: M
    rating: Low
    treatment_type: mitigate
    treatment: >
      1. Accept Google Workspace Data Processing Amendment in Admin Console
         → Account → Legal (Google's SCCs are incorporated by reference).
      2. Confirm Zuplo DPA includes IDTA/SCCs for UK→US transfer.
      3. Evaluate email provider migration to reduce Google Workspace dependency —
         Migadu is now the candidate in the supplier register (suppliers.yaml),
         validated on staging during the Better Auth migration; production cutover is
         gated and its terms/DPA + data residency are pending confirmation.
      4. NOTE (Phase 2): the allotmentology.tech enquiry form (PROC-008, planned) will
         also send notification copies to Google Workspace (US) — same DPA/SCC dependency
         as PROC-005.
      Risk reduces to accepted residual once DPAs confirmed.
    treatment_status: "Open — both DPA confirmations outstanding (see suppliers.yaml)"
    owner: founder
    status: open
    review: 2026-09-15

