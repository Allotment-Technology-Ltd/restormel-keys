# and isms-annual-management-review (Dec 2026).

risks:

  - id: RISK-001
    risk: >
      Coolify host (Hetzner Helsinki) is a single point of failure. Loss or
      unreachability of this server takes down the Restormel app, Forgejo
      (canonical repo), self-hosted Postgres (verification spine), and
      BetterAuth simultaneously.
    asset: "AST-003 — Coolify host, Hetzner Helsinki"
    likelihood: M
    impact: H
    rating: High
    treatment_type: mitigate
    treatment: >
      STRUCTURAL (REC-PLAN-012): split the single-box topology so the live product
      runs alone on Box A (.167, AST-009) while CI / Forgejo / Coolify / SurrealDB
      run on the build/ops Box B (.150, AST-010), over a private network (AST-011) —
      removing the "everything on one host" blast radius and the CI noisy-neighbour
      OOM/disk incidents that crashed Forgejo's Postgres. Plan in-execution
      (planning/infra-split-migration-plan.md); swap added to both boxes as an OOM
      cushion. PLUS: scheduled restic backups → BX11 (AST-012) with retention
      keep-daily 7 / keep-weekly 4 / keep-monthly 6, encrypted; restore drill
      required before Phase 8 complete. BREAK-GLASS DR RUNBOOK:
      planning/infra-migration-rollback-runbook.md (REC-PLAN-015) — covers per-phase
      rollback and global abort for migration. Target RTO < 4 hours.
      BREAK-GLASS (2026-06-17): if BetterAuth becomes the SSO for Forgejo/Coolify,
      retain local admin logins on both as a break-glass path so an auth-layer outage
      cannot lock the founder out of recovery. The SPOF blast radius now also includes
      the Infisical secret manager (AST-013, on Box B); its own failure modes are
      tracked separately in RISK-010.
    treatment_status: "In-treatment — split in execution (REC-PLAN-012); restic backups active (AST-012); break-glass runbook published (REC-PLAN-015)"
    owner: founder
    status: open
    review: 2026-12-15

  - id: RISK-002
    risk: >
      Secrets estate is fragmented across .env files (gitignored), Forgejo CI
      secrets/variables, GitHub secrets/variables (mirror), Restormel app
      credential store, and Mac keychain. Risk of missed rotation, stale
      credentials, and incomplete access review coverage.
    asset: "AST-007 — Secrets estate (distributed)"
    likelihood: M
    impact: M
    rating: Medium
    treatment_type: mitigate
    treatment: >
      IN TREATMENT (2026-06-17): a self-hosted Infisical secret manager (AST-013,
      secrets.restormel.dev) is now deployed as the single auditable store —
      EU-sovereign, OSS, on Box B. Server-side plaintext env/token files are being
      migrated into it (Infisical project restormel-ops, env prod) with the
      plaintext sources retained until end-to-end verification, then removed.
      Access + rotation governed by the Secret Management Policy (REC-POL-004).
      Until migration completes, quarterly access review
      (playbooks/quarterly-access-review.md) must continue to cover all secret
      locations; GitHub mirror secrets to be audited and minimised.
    treatment_status: "In-treatment (updated 2026-06-17) — Infisical deployed; 27 secrets imported + founder-verified; Mac plaintext *.env/*.token files removed (local CLI access via macOS keychain, read-only viewer identity); server /opt/surreal/.env still holds the SurrealDB root password by necessity (runtime). REMAINING: consolidate Forgejo CI + GitHub mirror secrets into Infisical; admin MFA (RISK-008/RISK-010)"
    owner: founder
    status: in-treatment
    review: 2026-12-15

  - id: RISK-003
    risk: >
      US-SaaS sub-processors handling or transiting personal data without
      confirmed Standard Contractual Clauses (SCCs / IDTA) in place.
      Specifically: Google Workspace (email — customer PII) and Zuplo
      (API gateway — request metadata). Google Workspace DPA also requires
      explicit in-portal acceptance not yet confirmed.
    asset: "Google Workspace (DAT-007), Zuplo (PROC-001)"
    likelihood: L
    impact: M
    rating: Low
    treatment_type: mitigate
    treatment: >
      1. Accept Google Workspace Data Processing Amendment in Admin Console
         → Account → Legal (Google's SCCs are incorporated by reference).
      2. Confirm Zuplo DPA includes IDTA/SCCs for UK→US transfer.
      3. Evaluate email provider migration to reduce Google Workspace dependency —
         Migadu is now the candidate in the supplier register (suppliers.yaml),
         validated on staging during the Better Auth migration; production cutover is
         gated and its terms/DPA + data residency are pending confirmation.
      Risk reduces to accepted residual once DPAs confirmed.
    treatment_status: "Open — both DPA confirmations outstanding (see suppliers.yaml)"
    owner: founder
    status: open
    review: 2026-09-15

  - id: RISK-004
    risk: >
      Neon Postgres (legacy backup) remains active beyond planned decommission
      date (~2026-06-30), leaving an unneeded attack surface and keeping
      stale entries in the privacy notice and suppliers register.
    asset: "AST-004 — Neon Postgres (decommissioning)"
    likelihood: L
    impact: L
    rating: Low
    treatment_type: mitigate
    treatment: >
      Complete Neon decommission by 2026-06-30: delete project in Neon console,
      remove AST-004 from asset-inventory.yaml, remove Neon from suppliers.yaml,
      update privacy notice. Stage a cowork-outbox bundle on completion.
    treatment_status: "Open — decommission pending"
    owner: founder
    status: open
    review: 2026-07-15

  - id: RISK-005
    risk: >
      Published privacy notice (restormel.dev/keys/privacy v2026-03-18) is
      materially inaccurate: lists Vercel as app host (it is DNS/registrar only)
      and Neon as the active database (decommissioning). Hetzner/Coolify, the
      actual compute host processing all in-scope data, is not listed.
    asset: "PROC-001 — Service delivery; privacy notice"
    likelihood: L
    impact: M
    rating: Low
    treatment_type: mitigate
    treatment: >
      Publish a corrected privacy notice version before significant customer
      volume: remove "Vercel: hosting", remove "Neon" once decommissioned,
      add "Hetzner (Coolify)" as primary compute sub-processor. Adam to
      update restormel.dev/keys/privacy directly (outside governance repo).
    treatment_status: "Open — privacy notice update not yet published"
    owner: founder
    status: open
    review: 2026-09-15

  - id: RISK-006
    risk: >
      No formal incident response procedure documented beyond the
      incident-capture.md playbook skeleton. In the event of a personal data
      breach, the 72-hour ICO notification window (UK GDPR Art 33) would be
      difficult to meet without a pre-planned procedure.
    asset: "All personal-data assets (DAT-002, DAT-007, DAT-010)"
    likelihood: L
    impact: H
    rating: Medium
    treatment_type: accept
    treatment: >
      Accepted risk at pre-customer solo-founder stage. Mitigation plan:
      complete incident response playbook (playbooks/incident-capture.md)
      before first paying customer, covering: breach identification, severity
      assessment, ICO notification decision (Art 33 threshold), data subject
      notification (Art 34), and evidence capture. Escalate to mitigate on
      first customer sign-up.
    treatment_status: "Accepted — escalate to mitigate before first paying customer"
    owner: founder
    status: open
    review: 2026-12-15

  - id: RISK-007
    risk: >
      Founder is a single point of failure: sole director Adam Boon holds all
      system credentials, operational knowledge, and recovery procedures.
      Incapacity or extended unavailability would make service recovery or
      ISMS continuity extremely difficult.
    asset: "AST-006 — Founder workstation; AST-001/002 — repos; all credentials"
    likelihood: L
    impact: H
    rating: Medium
    treatment_type: accept
    treatment: >
      Accepted risk at solo-founder stage. Partial mitigations in place:
      GitHub mirror provides code redundancy; Forgejo is self-hosted with
      Hetzner backups. Mitigation plan: document a handover/DR brief
      (break-glass document) covering critical credentials, recovery steps,
      and key contacts. Store securely and share with a named trusted person.
      Expand access controls and knowledge distribution when first team
      member joins.
    treatment_status: "Accepted — break-glass document not yet written"
    owner: founder
    status: open
    review: 2026-12-15

  - id: RISK-008
    risk: >
      MFA not yet confirmed enabled across all in-scope systems. This creates
      a risk of account compromise via credential theft or phishing on any
      system without a second factor — including high-value targets such as
      Google Workspace (admin), Hetzner control panel, Coolify, Forgejo,
      Mettle (banking), and Paddle (billing).
    asset: "AST-007 — All systems listed in access-control-policy.md §3"
    likelihood: M
    impact: H
    rating: High
    treatment_type: mitigate
    treatment: >
      URGENT. Enable MFA on all systems in the priority order defined in
      access-control-policy.md §3 (Priority 1 first: Google Workspace admin,
      Hetzner, Coolify, Forgejo, Mettle, Paddle). Scheduled remediation task:
      isms-mfa-remediation. Update the MFA status table in the access control
      policy and close this risk once all Priority 1 and Priority 2 systems
      are confirmed. When any new service is onboarded, MFA must be enabled
      within 24 hours per access-control-policy.md §2.
    treatment_status: "Open — URGENT. Remediation task scheduled."
    owner: founder
    status: open
    review: 2026-07-15

  - id: RISK-009
    risk: >
      The Hetzner infrastructure split + migration (REC-PLAN-012) moves live data
      stores between boxes — SurrealDB (.167 → .150), the app Postgres, and Ory
      Hydra's DB onto the new prod box (.167) — and repoints DNS. A failed cutover
      risks data loss, extended downtime, or a broken BYO-graph / wss dependency.
    asset: "AST-009/AST-010 — Box A/B compute hosts; SurrealDB; app Postgres; AST-012 BX11"
    likelihood: L
    impact: H
    rating: Medium
    treatment_type: mitigate
    treatment: >
      Per REC-PLAN-012: full backups to BX11 (AST-012) before any move (SurrealDB
      export, pg_dump app + Forgejo, Coolify config export); test-restore into scratch
      first; keep the source copy until the destination is verified; per-phase
      do → verify → rollback with low-TTL DNS and a warm fallback; cut over only
      after verification. The RESTORMEL_VERIFYING_PROXY_REMOTE flag stays OFF until
      Hydra's JWKS/issuer validate.
      DR CONTROLS (added 2026-06-17): scheduled restic backups to BX11 are the
      primary DR controls — restic-surreal (Box A, cron 03:00 UTC) and
      restic-buildops (Box B, cron 02:00 UTC), both with retention keep-daily 7 /
      keep-weekly 4 / keep-monthly 6, encrypted. A restore drill is required as part
      of Phase 8 (REC-PLAN-012) before the migration is declared complete. Consolidated
      break-glass rollback runbook: planning/infra-migration-rollback-runbook.md
      (REC-PLAN-015) — covers per-phase rollback + global abort procedure.
      GAP: no formal BCP/DR policy document exists (governance/bcp-dr-policy.md not yet
      created). This is a noted gap against ISO 27001 A.5.29/A.5.30; RTO < 4h is stated
      in RISK-001 treatment but not anchored in a policy. Owner to create before
      ISO certification attempt.
    treatment_status: "In-treatment — execution in progress; restic backup controls active; restore drill pending (Phase 8); break-glass runbook REC-PLAN-015 published"
    owner: founder
    status: open
    review: 2026-09-15

  - id: RISK-010
    risk: >
      The self-hosted Infisical secret manager (AST-013, secrets.restormel.dev) is a
      new single point of failure and a high-value target. (a) If the box is lost or
      Infisical's Postgres is corrupted without a recoverable backup, runtime secret
      retrieval breaks for anything that depends on `infisical run`. (b) The master
      ENCRYPTION_KEY / AUTH_SECRET live only in /opt/infisical/.env on the box —
      loss of that file means the encrypted secret store cannot be decrypted; theft
      of it plus the Postgres data means full secret disclosure. (c) The admin
      account does not yet have MFA.
    asset: "AST-013 — Infisical secret manager; AST-007 — secrets estate"
    likelihood: L
    impact: H
    rating: Medium
    treatment_type: mitigate
    treatment: >
      1. BACKUP: include the Infisical Postgres in the Box B restic backup
         (AST-012, restic-buildops) via a pg_dump of /opt/infisical/pg, and back up
         /opt/infisical/.env (master key material) to the encrypted backup repo —
         without these, the store is unrecoverable. Add a restore drill to the DR
         procedure. 2. NO PLAINTEXT DELETION until the founder verifies Infisical
         end-to-end (the original plaintext files remain the fallback in the
         meantime). 3. MFA: enable MFA on the Infisical admin account (tracked with
         RISK-008). 4. LEAST PRIVILEGE: CLI access via a read-only (viewer) machine
         identity scoped to one project/env; rotate its client secret on suspected
         exposure (REC-POL-004 §5). 5. SECRET HANDLING: never echo secret values;
         treat any exposure as an incident (REC-POL-004 §7) — this treats the
         in-session credential-exposure risk that motivated the migration.
    treatment_status: >
      In-treatment (updated 2026-06-17): items 1, 2, 4, 5 DONE. (1) BACKUP — the
      Infisical Postgres (pg_dump -Fc) and /opt/infisical/.env master key are now
      included in the Box B restic backup (restic-buildops → BX11); restore drill
      PASSED (snapshot 038f431e: restore exit 0, 509-entry dump TOC, ENCRYPTION_KEY +
      AUTH_SECRET present). (2) PLAINTEXT — founder verified 27 secrets in the vault;
      the Mac plaintext *.env/*.token files have been deleted (SSH keys retained as
      files). (4) LEAST PRIVILEGE — the restormel-cli machine identity's temporary
      admin grant was revoked; it is now viewer/read-only (verified: read 200,
      write 403); local CLI creds held in the macOS keychain (no plaintext on disk).
      (5) SECRET HANDLING — enforced this session (values never echoed). REMAINING:
      item 3, admin MFA — blocked on an Infisical plan upgrade (tracked with RISK-008).
    owner: founder
    status: in-treatment
    review: 2026-09-15
