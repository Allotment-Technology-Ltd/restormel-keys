    product: allotmentology.tech

  - id: RISK-012
    risk: >
      Email deliverability & compliance. Two failure modes as the email programme grows:
      (1) DELIVERABILITY — mixing marketing/bulk mail with transactional/auth mail on one
      domain/reputation can get the sending domain flagged or blocklisted, landing sign-in,
      verification and access-grant emails in spam (users locked out); (2) CONSENT — sending
      marketing email without a valid lawful basis, or without a working unsubscribe, breaches
      PECR reg. 22 / UK GDPR.
    asset: "AST-003 (compute/Postgres); Migadu + Brevo (suppliers); PROC-001, PROC-009; DAT-013"
    product: restormel
    likelihood: M
    impact: M
    rating: Medium
    treatment_type: mitigate
    treatment: >
      STRUCTURAL (REC-PLAN-017): strict two-stream separation — transactional via Migadu on a
      dedicated send.restormel.dev subdomain; marketing via Brevo (managed EU deliverability) on a
      separate news.restormel.dev subdomain; each with its own SPF/DKIM/DMARC so reputations are
      isolated and a marketing complaint cannot harm auth delivery. DMARC ramped none→quarantine→
      reject with rua monitoring. CONSENT: double opt-in (net-new) + documented PECR soft opt-in
      (existing); RFC-8058 one-click unsubscribe on every marketing message; sovereign consent
      ledger (email_preferences) honouring opt-out immediately; transactional email never gated by
      marketing prefs. Plain-text alternative on all mail. Public privacy notice marketing section
      live BEFORE first marketing send (gated, publish-when-live).
    treatment_status: "Open — plan approved as REC-PLAN-017; Phase 1 (transactional pilot) in build; marketing stack (Brevo, subdomains, DMARC, unsubscribe, consent ledger) is Phase 2, not yet implemented"
    owner: founder
    status: open
    review: 2026-12-15

  - id: RISK-013
    risk: >
      DNS availability + provider concentration. Authoritative DNS for restormel.dev and
      allotmentology.tech was consolidated onto Hetzner Cloud DNS on 2026-06-20 (off Vercel DNS
      and the orderbox registrar DNS). This (a) makes Hetzner DNS a single point of failure for
      reaching every in-scope service, and (b) reduces provider diversity by putting DNS on the
      same vendor as compute + storage (a Hetzner-wide control-plane incident could affect DNS
      and compute together).
    asset: "AST-020/AST-021 — DNS zones (Hetzner Cloud DNS); AST-005/AST-016 domains"
    product: shared
    likelihood: L
    impact: M
    rating: Low
    treatment_type: accept
    treatment: >
      ACCEPTED at this stage (sovereignty + single-pane operability outweigh the concentration at
      solo-founder scale; Hetzner Cloud DNS is anycast/redundant within Hetzner). Mitigations: the
      registrars (Vercel for restormel.dev, get.tech for allotmentology.tech) are RETAINED, so
      nameservers can be re-delegated to a fallback DNS provider (e.g. deSEC) within a TTL window
      if Hetzner DNS fails; keep an exported BIND zone copy of each zone in the repo/ops store for
      fast re-creation; low record TTLs (300s on the A-records) during the migration window keep
      re-delegation fast. Ties into the BCP/DR gap noted in RISK-009 / REC-POL-005.
    treatment_status: "Open — accepted; fallback re-delegation path documented (registrars retained, deSEC fallback, zone export). No action required unless Hetzner DNS proves unreliable."
    owner: founder
    status: open
    review: 2026-12-15

  - id: RISK-014
    risk: >
      Bundled adapter-node asset-path overshoot (prod-only ENOENT). Server modules that resolve a
      shipped non-code asset (seed JSON, starter corpus, governance records) via a fixed
      import.meta.url-relative climb work correctly in the source tree, in dev/CI, and under
      SvelteKit prerender, but OVERSHOOT in the bundled adapter-node prod runtime — the importing
      module is emitted at a shallower depth, so the relative climb points at a path that does not
      exist and the read throws ENOENT, surfacing as a bare HTTP 500. The failure is invisible
      everywhere except the bundled prod build, so it reaches founders/users before it is caught.
      Recurring class — 3 known instances: REPO_ROOT records gate (fixed 112b8c99), live Connect
      starter-corpus load, and model-catalog-seed.json on the key→stage bind path (REC-INC-008).
    asset: "AST-003 (compute/dashboard); restormel.dev prod dashboard (.167)"
    product: restormel
    likelihood: M
    impact: M
    rating: Medium
    treatment_type: mitigate
    treatment: >
      Each instance has been point-fixed with a robust runtime resolver (resolveRepoRoot in
      records/gate.ts; resolveSeedPath in catalogue/seed-path.ts) that prefers the module-relative
      path when it exists on disk (unchanged source/prerender behaviour) and otherwise walks up
      from process.cwd() to the pnpm-workspace.yaml marker to resolve the canonical asset path.
      SYSTEMIC GUARD RECOMMENDED (not yet implemented — see REC-INC-008 follow-ups): either (a) a
      build-time copy of apps/dashboard/data and other shipped runtime assets into the server
      bundle at a stable bundle-relative location so runtime paths are deterministic regardless of
      bundle depth; OR (b) mandate the shared resolver for every shipped-asset read plus a lint/CI
      grep that fails on raw fixed-climb import.meta.url asset reads under src/lib/server/. Pick one
      and apply repo-wide so the class cannot recur per-file. Coordinate with the concurrent
      starter-corpus fix to avoid conflicting build-config edits.
    treatment_status: "Open — three instances point-fixed (112b8c99 records gate; starter-corpus in flight; REC-INC-008 catalog seed). Systemic guard (build-copy OR mandated-resolver + CI grep) recommended as a PBI, not yet implemented."
    owner: founder
    status: open
    review: 2026-12-23
