# ISMS scope: Allotment Technology Ltd — company-wide across all in-scope products
# (Restormel + allotmentology.tech + PlotBudget + Sophia) and the shared K3s cluster.
# SCOPE EXPANSION (2026-06-23, founder decision): PlotBudget + Sophia now IN scope (live on the
# shared in-scope K3s cluster). RISK-001 blast radius updated below to the single in-scope HA
# estate. Per-risk scope is in the product: field. See Phase-1 ground-truth §6 F1/F12 and PBI #239.
# NOTE: the K3s estate surfaced several NEW critical risks (single-node SPOF, unprotected SurrealDB
# backup, single-AZ, 131% memory overcommit, Infisical+ESO bootstrap SPOF) — these are captured as
# findings F1/F2/F7/F8/F9 in the ground-truth and filed as follow-up PBIs; full new RISK-* entries
# for them are a follow-up to this scope-expansion PR (this PR updates RISK-001 and flags the rest).
#
# Risk rating matrix (likelihood × impact):
#   L×L = Low   L×M = Low    L×H = Medium
#   M×L = Low   M×M = Medium M×H = High
#   H×L = Medium H×M = High  H×H = High
#
# treatment_type: mitigate | accept | transfer | avoid
# status: open | in-treatment | closed
#
# Reviewed: 2026-06-15. Next scheduled review: isms-mid-year-governance-check (Jun)
# and isms-annual-management-review (Dec 2026).

risks:

  - id: RISK-001
    risk: >
      Single-point-of-failure compute, now spanning a SHARED IN-SCOPE ESTATE.
      BLAST-RADIUS UPDATE (2026-06-23): the live production data-plane has moved to a SINGLE
      K3s node — restormel-sovereign-master1 (cx43, hel1, AST-022) — which carries the
      control-plane + etcd + ALL stateful workloads of EVERY in-scope product on one host:
      the 3 CNPG Postgres clusters (AST-023), SurrealDB (AST-024), the self-hosted Supabase /
      PlotBudget backend (AST-025), Sophia (AST-026), External Secrets Operator (AST-027), and
      monitoring (AST-028). With PlotBudget + Sophia now formally IN scope (founder decision
      2026-06-23), this is no longer "out-of-scope products contaminating an in-scope plane" —
      it is ONE in-scope estate whose loss = total outage of all four products at once. The
      legacy Coolify cluster (AST-003 — now superseded-in-transition) is STILL RUNNING and still
      hosts the not-yet-migrated Restormel app, Forgejo, Infisical (AST-013) and BetterAuth, so
      the SPOF surface currently spans BOTH the K3s node and the legacy boxes. Single AZ (hel1)
      throughout, including the S3 backup bucket (AST-019).
    asset: "AST-022 — K3s sovereign cluster (single node); AST-023/024/025/026/027 in-cluster systems; AST-003 — legacy Coolify compute (superseded-in-transition); AST-017 portal"
    product: shared
    likelihood: M
    impact: H
    rating: High
    treatment_type: mitigate
    treatment: >
      STRUCTURAL (REC-PLAN-012): split the single-box topology so the live product
      runs alone on Box A (.167, AST-009) while CI / Forgejo / Coolify / SurrealDB
      run on the build/ops Box B (.150, AST-010), over a private network (AST-011) —
      removing the "everything on one host" blast radius and the CI noisy-neighbour
      OOM/disk incidents that crashed Forgejo's Postgres. Plan in-execution
      (planning/infra-split-migration-plan.md); swap added to both boxes as an OOM
      cushion. PLUS: scheduled restic backups → BX11 (AST-012) with retention
      keep-daily 7 / keep-weekly 4 / keep-monthly 6, encrypted; restore drill
      required before Phase 8 complete. BREAK-GLASS DR RUNBOOK:
      planning/infra-migration-rollback-runbook.md (REC-PLAN-015) — covers per-phase
      rollback and global abort for migration. Target RTO < 4 hours.
      BREAK-GLASS (2026-06-17): if BetterAuth becomes the SSO for Forgejo/Coolify,
      retain local admin logins on both as a break-glass path so an auth-layer outage
      cannot lock the founder out of recovery. The SPOF blast radius now also includes
      the Infisical secret manager (AST-013, on Box B); its own failure modes are
      tracked separately in RISK-010.
      K3s BLAST-RADIUS TREATMENT GAP (2026-06-23): the REC-PLAN-012 box-split mitigation above was
      for the OLD Coolify topology and does NOT mitigate the new single-K3s-node SPOF (AST-022). The
      live estate now needs: control-plane/etcd HA + spreading stateful workloads off the one cx43
      (ground-truth F1); a WORKING SurrealDB backup — currently none, cronjob suspended (F2/D5,
      tracked on AST-024); CNPG backup-record reconciliation + a restore drill against the live
      S3/barman path (F6, on AST-019/023); right-sizing the 131% memory overcommit (F7); addressing
      the 16/16 CSI volume cap (F5); and cross-region/AZ DR given everything incl. backups is hel1
      (F9). These are FILED as follow-up PBIs (referenced from the ground-truth findings) — NOT
      resolved by this scope-expansion PR. Net effect of the expansion on this risk: rating stays
      High; the affected-asset set widens to the whole in-scope estate; mitigation owed grows.
    treatment_status: >
      In-treatment — legacy box-split (REC-PLAN-012) done for the OLD topology; restic backups active
      on the legacy boxes (AST-012). NEW (2026-06-23) K3s-estate mitigations OUTSTANDING (HA, SurrealDB
      backup, CNPG restore drill, overcommit, volume cap, cross-region DR) — tracked as follow-up PBIs
      from Phase-1 ground-truth F1/F2/F5/F6/F7/F9. Blast radius now = single in-scope K3s node + legacy boxes.
    owner: founder
    status: open
    review: 2026-12-15

