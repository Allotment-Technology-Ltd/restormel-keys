# Forgejo port of .github/workflows/publish-support.yml.
# Publish @restormel/support to npmjs (tag support-v* or manual dispatch).
name: Publish Restormel Support
on:
  push:
    tags:
      - "support-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-support-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: PNPM install
        uses: ./.forgejo/actions/pnpm-workspace-install

      - name: Build @restormel/mcp (dependency)
        run: pnpm --filter @restormel/mcp run build

      - name: Test @restormel/support
        run: pnpm --filter @restormel/support run test

      - name: Build @restormel/support
        run: pnpm --filter @restormel/support run build

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"

      - name: Publish @restormel/support
        run: pnpm --filter @restormel/support publish --access public --no-git-checks
