# Forgejo CI — primary pipeline for the restormel-keys monorepo on the
# self-hosted Forgejo instance (git.allotmentology.tech).
#
# Jobs:
#   build          — install + build platform packages (smoke: runner is healthy)
#   build-and-test — full dashboard vite build + connect-core/mcp tests
#                    (required PR check; catches dashboard build breaks and
#                     proxy/mcp regressions before they reach main)
#   security       — OSV-Scanner + gitleaks + pnpm audit + Trivy config/fs
#                    (required PR check; blocks on HIGH/CRITICAL)
#
# Security job:
#   Composite: .forgejo/actions/security-scan (OSV-Scanner, gitleaks, pnpm audit)
#   Trivy config: scans Dockerfile.* + deploy/docker-compose.coolify.yml for
#     misconfigurations (no built image needed — static analysis only).
#   Trivy fs: filesystem dep scan + secrets (no Docker required).
#   NOTE: trivy image (OS/layer CVEs) runs on-box via a Coolify Scheduled Task
#     against the Coolify-built image — NOT here (Coolify builds images from
#     source on the box; there is no CI-built image to scan).
#   Severity gate: scripts/security/severity-gate.mjs — HIGH/CRITICAL blocks.
#
# Path filter: security runs on any code, repo-config, or script change.
# Gate is intended to be a required status check on PRs to main (see plan A7).
#
# CI throughput (Tier ①, 2026-06-24):
#   - concurrency.cancel-in-progress cancels a *superseded* PR run when a newer
#     commit is pushed to the same branch — frees the (now capacity-3) runner
#     instead of finishing a stale build. Keyed by ref so it ONLY collapses runs
#     of the same PR/branch; push-to-main runs never cancel each other (each gets
#     a run_id-unique group) so a deploy/migration run is never interrupted.
#   - The `changes` job computes whether a PR touched real CODE. The two REQUIRED
#     status checks ("Full build + connect-core/mcp tests" and "Security scan …")
#     still RUN and REPORT on every PR — so branch protection is never left
#     waiting on a skipped required context — but their EXPENSIVE steps (dashboard
#     vite build, package tests, Trivy binary download + Dockerfile scans) are
#     gated on code==true. A records/docs-only PR therefore turns both required
#     checks green in seconds without spinning a heavy pnpm build. The secret
#     scan (gitleaks, via the composite) still runs on docs PRs.
name: CI

# Cancel a superseded in-flight run when a newer commit lands on the same PR
# branch; never collapse independent push-to-main runs (run_id makes each unique).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Run on direct pushes to main only (post-merge sanity + the deploy/auto-tag gate).
  # Feature-branch commits are covered by the pull_request trigger below, so a PR
  # commit runs the job set ONCE instead of twice (push + pull_request). This halves
  # CI load on the capacity-3 runner without weakening the merge gate — the required
  # check remains "Security scan ... (pull_request)".
  push:
    branches: [main]
  pull_request:

jobs:
  # Dependency-free change detection (no third-party action — the Forgejo runner
  # resolves actions from code.forgejo.org, not GitHub, so dorny/paths-filter is
  # not reliably available here). Emits code=true when a PR touches buildable
  # source; on push to main code is forced true (post-merge full verification).
  changes:
    runs-on: docker
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Push to main (or any non-PR event) → always treat as code: full verify.
          if [[ "${EVENT}" != "pull_request" ]]; then
            echo "non-PR event (${EVENT}) → code=true (full verification)"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=200 origin "${BASE_REF}" || git fetch --no-tags origin "${BASE_REF}"
          MERGE_BASE="$(git merge-base "origin/${BASE_REF}" HEAD || echo '')"
          if [[ -z "${MERGE_BASE}" ]]; then
            echo "no merge-base resolved → fail safe to code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only "${MERGE_BASE}" HEAD)"
          echo "::group::changed files"; echo "${CHANGED}"; echo "::endgroup::"
          # CODE = anything that can change a build/test/dependency/runtime result.
          # Everything NOT matched here (docs/, records/, governance/, evidence/,
          # planning/, legal/, people/, *.md) is treated as non-code → heavy steps skip.
          if echo "${CHANGED}" | grep -qE '^(packages/|platform/|apps/|examples/|scripts/|deploy/|\.forgejo/|Dockerfile|deploy/docker-compose|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig|\.trivyignore|vuln-allowlist)'; then
            echo "code-affecting change detected → code=true"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/records-only change → code=false (heavy steps skip; required checks still report)"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: docker
    needs: [changes]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          # Job tokens 403 on private-repo http-git (filed); use the CI PAT.
          token: ${{ secrets.FORGEJO_TOKEN }}
      - uses: ./.forgejo/actions/pnpm-workspace-install
        if: needs.changes.outputs.code == 'true'
      - name: Build platform packages
        if: needs.changes.outputs.code == 'true'
        run: pnpm run build:platform-packages
      - name: No-op (docs/records-only PR — nothing to build)
        if: needs.changes.outputs.code != 'true'
        run: echo "docs/records-only change — skipping platform package build."

  build-and-test:
    name: Full build + connect-core/mcp tests
    runs-on: docker
    needs: [changes]
    # Required PR check — this job always RUNS and REPORTS so branch protection
    # never waits on a skipped required context. Its expensive steps (dashboard
    # vite build + package tests) are gated on code==true; a docs/records-only PR
    # turns this context green in seconds via the no-op step below.
    #
    # Why this job exists: the `build` job above only builds the platform
    # packages. It does NOT run the dashboard vite build, nor the
    # @restormel/connect-core / @restormel/mcp tests — so a dashboard build
    # break or a proxy/mcp regression could reach main undetected (this caused
    # a failed prod deploy). This job closes that gap.
    #
    # Build order: `pnpm --filter dashboard build` runs the dashboard's own
    # `prebuild` first, which builds the FULL workspace dependency graph
    # (@restormel/connect-core, @restormel/testing-config, @restormel/mcp, …)
    # into each package's dist/ — the exact artifacts consumers import. After
    # that build, the connect-core and mcp tests resolve their workspace
    # imports against real dist/ output, so no vitest src-alias is needed.
    # Running the dashboard build first is therefore both the gate's primary
    # check (the exact vite build that failed in prod) AND the build-order
    # prerequisite for the package tests below.
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          # Job tokens 403 on private-repo http-git (filed); use the CI PAT.
          token: ${{ secrets.FORGEJO_TOKEN }}
      - uses: ./.forgejo/actions/pnpm-workspace-install
        if: needs.changes.outputs.code == 'true'

      # (a) Full dashboard vite build — the exact step that failed in prod.
      #     Its `prebuild` builds every workspace dependency's dist/ first.
      #
      #     Env MUST mirror the working Coolify build (Dockerfile.dashboard),
      #     otherwise this step fails in CI even though prod builds fine:
      #
      #     - DEPLOY_TARGET=node: svelte.config.js selects @sveltejs/adapter-node
      #       when this is "node" (else adapter-vercel). The prod container runs
      #       the adapter-node output (apps/dashboard/build/index.js), so the gate
      #       must build that exact artifact — not the default Vercel build.
      #
      #     - NODE_OPTIONS=--max-old-space-size=4096: the dashboard's SSR vite
      #       build (10k+ modules) exceeds Node's ~2GB default old-space and
      #       aborts with "Reached heap limit — JavaScript heap out of memory"
      #       (exit 134 / SIGABRT). This is exactly what happened on the
      #       self-hosted runner; Dockerfile.dashboard sets the same 4096MB cap.
      - name: Build dashboard (vite) + workspace deps
        if: needs.changes.outputs.code == 'true'
        env:
          DEPLOY_TARGET: node
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter dashboard build

      # (b) connect-core typecheck + tests (proxy/verify-envelope logic).
      #     dist/ for its deps already exists from the dashboard prebuild.
      - name: Typecheck @restormel/connect-core
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @restormel/connect-core run typecheck
      - name: Test @restormel/connect-core
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @restormel/connect-core test

      # (c) mcp tests (proxy client ↔ fixture upstream; suite tools).
      #     Resolves @restormel/connect-core + @restormel/testing-config from
      #     their built dist/ (produced by the dashboard prebuild above).
      - name: Test @restormel/mcp
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter @restormel/mcp test

      # Docs/records-only PR — no buildable change. The required "Full build …"
      # context still reports success via this no-op so the PR can merge without
      # waiting ~13 min on a heavy build that would verify nothing new.
      - name: No-op (docs/records-only PR — nothing to build or test)
        if: needs.changes.outputs.code != 'true'
        run: echo "docs/records-only change — skipping dashboard build + package tests."

  security:
    name: Security scan (OSV + gitleaks + pnpm audit + Trivy)
    runs-on: docker
    # Run on every push and PR — this job is intended to be a required check.
    # Runs on any code, repo-config, Dockerfile, or script change.
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
          # Full history for gitleaks (detects secrets in prior commits too).
          fetch-depth: 0

      # ── OSV-Scanner + gitleaks + pnpm audit (via composite) ────────────────
      - name: Run security composite (OSV + gitleaks + pnpm audit)
        uses: ./.forgejo/actions/security-scan

      # ── Trivy: install pinned binary ────────────────────────────────────────
      - name: Install Trivy v0.71.0
        shell: bash
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.71.0"
          TRIVY_TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          TRIVY_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_TARBALL}"
          # SHA256 from https://github.com/aquasecurity/trivy/releases/download/v0.71.0/trivy_0.71.0_checksums.txt
          TRIVY_SHA256="30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814"
          curl -fsSL "${TRIVY_URL}" -o "/tmp/${TRIVY_TARBALL}"
          echo "${TRIVY_SHA256}  /tmp/${TRIVY_TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TRIVY_TARBALL}" -C /tmp trivy
          mv /tmp/trivy /usr/local/bin/trivy
          chmod +x /usr/local/bin/trivy
          trivy --version

      # ── Trivy config: Dockerfiles + compose misconfiguration scan ──────────
      # Scans static files only — no built image required. Blocks on CRITICAL/HIGH misconfigs.
      # .trivyignore (if present) can suppress known false-positives.
      - name: Trivy config scan (Dockerfiles + compose)
        shell: bash
        run: |
          set -euo pipefail
          TRIVY_ARGS="--exit-code 1 --severity HIGH,CRITICAL"
          if [[ -f .trivyignore ]]; then
            TRIVY_ARGS="${TRIVY_ARGS} --ignorefile .trivyignore"
          fi

          echo "::group::Trivy config — Dockerfile.dashboard"
          # shellcheck disable=SC2086
          trivy config ${TRIVY_ARGS} Dockerfile.dashboard
          echo "::endgroup::"

          echo "::group::Trivy config — Dockerfile.worker"
          # shellcheck disable=SC2086
          trivy config ${TRIVY_ARGS} Dockerfile.worker
          echo "::endgroup::"

          echo "::group::Trivy config — Dockerfile.site"
          # shellcheck disable=SC2086
          trivy config ${TRIVY_ARGS} Dockerfile.site
          echo "::endgroup::"

          echo "::group::Trivy config — deploy/docker-compose.coolify.yml"
          # shellcheck disable=SC2086
          trivy config ${TRIVY_ARGS} deploy/docker-compose.coolify.yml
          echo "::endgroup::"

      # ── Trivy fs: filesystem SECRET scan ───────────────────────────────────
      # Secrets only: OSV-Scanner + scripts/security/severity-gate.mjs is the single
      # authoritative CVE gate (with the time-boxed scripts/security/vuln-allowlist.json).
      # Running Trivy's `vuln` scanner here would double-gate dependency CVEs against an
      # *uncoordinated* second allowlist — it would re-block the CVEs deliberately
      # time-boxed in the OSV allowlist (e.g. esbuild, nodemailer). So Trivy is scoped to
      # `secret` as a second-opinion secret scanner alongside gitleaks.
      - name: Trivy fs scan (secrets)
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Trivy fs — secret scan"
          trivy fs \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --scanners secret \
            --skip-dirs node_modules \
            .
          echo "::endgroup::"

  bundled-asset-guard:
    name: Bundled asset-read guard (import.meta.url overshoot)
    runs-on: docker
    # Required PR check. Fails when a NEW server module under
    # apps/dashboard/src/lib/server/ reads a shipped data asset via a fixed
    # import.meta.url-relative climb (or sibling-dir read) — the bundled
    # adapter-node prod runtime emits the module at a different depth, so the
    # path overshoots/misses → ENOENT → HTTP 500 (RISK-014 / REC-INC-008; 3 prior
    # prod instances: 112b8c99, #276, #282). Dependency-free — plain `node`,
    # no workspace install. See docs/engineering/server-data-assets.md for the
    # canonical pattern (module-import preferred; resolveRepoRoot / resolveSeedPath
    # fallback).
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}
      - name: Unit-test the guard classifier
        run: node --test scripts/ci/check-bundled-asset-reads.test.mjs
      - name: Check for fixed-climb bundled asset reads
        run: node scripts/ci/check-bundled-asset-reads.mjs
