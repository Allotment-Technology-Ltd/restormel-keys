# Forgejo CI deploy pipeline — dashboard + worker (infra Stage 2.4).
#
# Triggers a Coolify deploy via its API. Coolify builds the image FROM SOURCE
# itself (dockerfile build pack: it pulls the repo via its read-only deploy key
# and runs `docker build`), so there is deliberately NO build-and-push-to-registry
# job here: on the shared box the Forgejo runner and Coolify are the same machine,
# so building on the runner then rebuilding in Coolify is pure waste — and the
# runner's job containers have no Docker socket, which is what made the old
# build-and-push job fail. Deploying straight through the Coolify API is simpler,
# needs no registry, and works with only the COOLIFY_TOKEN secret.
#
# Secrets required (Forgejo Actions secret):
#   COOLIFY_TOKEN — Coolify API bearer token (read+write+deploy). Without it the
#                   jobs no-op cleanly (GitHub mirror, forks, first-time setup).
#
# Deploys run SERIALLY (dashboard → poll to terminal → worker): two parallel
# full-workspace Docker builds OOM the 8 GB box (no swap).
#
# Coolify API is reached at the host bridge address http://10.0.1.1:8000 from the
# runner's job container (header bearer auth; the webhook-with-embedded-token 401s).
#
# GitHub mirror note: this workflow lives in .forgejo/workflows/ which overrides
# .github/ on the Forgejo runner. The Forgejo→GitHub push mirror re-triggers GitHub
# Actions, which ignore this file. The COOLIFY_TOKEN guard makes the jobs no-op there.
#
# Prod deploy: a `dashboard-v*` tag (auto-created per main merge by auto-tag-release.yml,
# or pushed by hand) or a manual workflow_dispatch=prod. Keyed off the tag so every
# prod deploy maps to a named, revertable release (auto-tag-on-merge, 2026-06-16).

name: Deploy dashboard

on:
  # AUTO-DEPLOY via auto-tag-on-merge (2026-06-16): the D8 cost-pause is lifted.
  # Prod is GATED on a `dashboard-v*` tag (below); auto-tag-release.yml creates that
  # tag automatically on every push to main, so each merge ships to prod with an
  # explicit, revertable release artifact. We deliberately key prod off the TAG (not
  # a direct main-push trigger) so a deploy always corresponds to a named release.
  push:
    tags:
      # Prod release tag — auto-created per main merge by auto-tag-release.yml; can
      # also be pushed by hand for a manual release: `git tag dashboard-v1.2.3 && git push --tags`.
      - 'dashboard-v*'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (staging | prod)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

jobs:
  deploy-staging:
    name: Trigger Coolify staging deploy
    runs-on: docker
    # Staging deploys from main-branch pushes or an explicit workflow_dispatch=staging.
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    steps:
      - name: Trigger Coolify staging deploys (serial)
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DASHBOARD_UUID: cpygbz8w77lxkx8bundvxb9d
          WORKER_UUID: xzrg5m4tw1zk8zwlafgnepmk
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_TOKEN:-}" ]]; then
            echo "COOLIFY_TOKEN not set — skipping deploy trigger (expected on the GitHub mirror)."
            exit 0
          fi
          API="http://10.0.1.1:8000/api/v1"
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}")
          deploy_and_wait() {
            local app_uuid="$1" name="$2"
            local resp dep status
            resp=$(curl -sf "${auth[@]}" "${API}/deploy?uuid=${app_uuid}&force=true")
            dep=$(echo "${resp}" | sed -n 's/.*"deployment_uuid":"\([a-z0-9]*\)".*/\1/p')
            echo "${name}: deployment ${dep} queued"
            for i in $(seq 1 90); do
              sleep 20
              status=$(curl -sf "${auth[@]}" "${API}/deployments/${dep}" | sed -n 's/.*"status":"\([a-z_]*\)".*/\1/p' | head -1)
              echo "${name} [${i}] status=${status}"
              case "${status}" in
                finished) return 0 ;;
                failed|cancelled*) echo "${name} deploy FAILED"; return 1 ;;
              esac
            done
            echo "${name} deploy timed out"; return 1
          }
          deploy_and_wait "${DASHBOARD_UUID}" "dashboard"
          deploy_and_wait "${WORKER_UUID}" "worker"
          echo "Staging deploys complete."

  deploy-prod:
    name: Trigger Coolify production deploy
    runs-on: docker
    # Prod deploys on a dashboard-v* tag push (auto-created per main merge by
    # auto-tag-release.yml) or an explicit workflow_dispatch=prod.
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dashboard-v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    steps:
      - name: Trigger Coolify production deploys (serial)
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DASHBOARD_UUID: mxq1lnsehg7sdfzn0a8tnkxo
          WORKER_UUID: ppvmqm1hbnu09kjgttdl5og4
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_TOKEN:-}" ]]; then
            echo "COOLIFY_TOKEN not set — skipping prod deploy trigger."
            exit 0
          fi
          API="http://10.0.1.1:8000/api/v1"
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}")
          deploy_and_wait() {
            local app_uuid="$1" name="$2"
            local resp dep status
            resp=$(curl -sf "${auth[@]}" "${API}/deploy?uuid=${app_uuid}&force=true")
            dep=$(echo "${resp}" | sed -n 's/.*"deployment_uuid":"\([a-z0-9]*\)".*/\1/p')
            echo "${name}: deployment ${dep} queued"
            for i in $(seq 1 90); do
              sleep 20
              status=$(curl -sf "${auth[@]}" "${API}/deployments/${dep}" | sed -n 's/.*"status":"\([a-z_]*\)".*/\1/p' | head -1)
              echo "${name} [${i}] status=${status}"
              case "${status}" in
                finished) return 0 ;;
                failed|cancelled*) echo "${name} deploy FAILED"; return 1 ;;
              esac
            done
            echo "${name} deploy timed out"; return 1
          }
          deploy_and_wait "${DASHBOARD_UUID}" "dashboard"
          deploy_and_wait "${WORKER_UUID}" "worker"
          echo "Production deploys complete."

      # PM lifecycle (Step 8): after a successful prod deploy, every PBI sitting at
      # status/ready-deploy is now live — flip it to status/deployed and close it.
      # Runs on the runner with the FORGEJO_TOKEN secret (issue-write); no token on prod.
      - name: Lifecycle — close PBIs that were awaiting this deploy
        if: success()
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${FORGEJO_TOKEN:-}" ]]; then
            echo "FORGEJO_TOKEN not set — skipping PM lifecycle callback."; exit 0
          fi
          command -v jq >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y --no-install-recommends jq >/dev/null; }
          ORG="Allotment-Technology-Ltd"; REPO="${ORG}/restormel-keys"
          BASE="https://git.allotmentology.tech/api/v1"
          auth=(-H "Authorization: token ${FORGEJO_TOKEN}")
          # A prod deploy ships all of main, so every PBI at status/ready-deploy is now live.
          labels="$(curl -fsS "${auth[@]}" "${BASE}/orgs/${ORG}/labels?limit=200")"
          deployed_id="$(printf '%s' "${labels}" | jq -r '.[]|select(.name=="status/deployed")|.id')"
          open_issues="$(curl -fsS "${auth[@]}" "${BASE}/repos/${REPO}/issues?state=open&type=issues&limit=100")"
          nums="$(printf '%s' "${open_issues}" | jq -r '.[]|select(.labels|map(.name)|index("status/ready-deploy"))|.number')"
          if [ -z "${nums}" ]; then echo "No PBIs at status/ready-deploy — nothing to close."; exit 0; fi
          for n in ${nums}; do
            # status is exclusive: drop any existing status/* label first, then add status/deployed
            curl -fsS "${auth[@]}" "${BASE}/repos/${REPO}/issues/${n}/labels" \
              | jq -r '.[]|select(.name|startswith("status/"))|.id' \
              | while read -r sid; do [ -n "${sid}" ] && curl -fsS "${auth[@]}" -X DELETE "${BASE}/repos/${REPO}/issues/${n}/labels/${sid}" >/dev/null 2>&1 || true; done
            [ -n "${deployed_id}" ] && curl -fsS "${auth[@]}" -X POST "${BASE}/repos/${REPO}/issues/${n}/labels" -H 'Content-Type: application/json' -d "{\"labels\":[${deployed_id}]}" >/dev/null 2>&1 || true
            curl -fsS "${auth[@]}" -X PATCH "${BASE}/repos/${REPO}/issues/${n}" -H 'Content-Type: application/json' -d '{"state":"closed"}' >/dev/null 2>&1 || true
            echo "deployed + closed #${n}"
          done
          echo "PM lifecycle callback complete."
