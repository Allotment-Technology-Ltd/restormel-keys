# Forgejo CI — K3s GitOps deploy pipeline (build → push → bump), Argo CD PULL model.
# ---------------------------------------------------------------------------------
# Replaces the retired Coolify-API deploy. Ships behind the `K3S_DEPLOY_ENABLED`
# Forgejo Actions variable (cutover gate). Until armed, every job no-ops cleanly.
#
# Source of truth for the design: deploy/k3s/gitops/DEPLOY-PIPELINE.md §4,
# planning/k3s-cluster-target-design.md §8, runbook deploy/k3s/runbooks/docker-runner.md.
#
# ---------------------------------------------------------------------------------
# THE REC-INC-006 INVARIANT (do not violate — it is why this pipeline exists)
# ---------------------------------------------------------------------------------
# REC-INC-006: prod auto-deploy silently broke for ~14 merges because a CI per-job
# container tried to reach an ON-BOX control-plane API (Coolify at 10.0.1.1). The
# per-job network reaches the internet but cannot route to the host's own services.
# This workflow is OUTBOUND-ONLY:
#
#   ALLOWED (outbound)                         FORBIDDEN (never reintroduce)
#   ───────────────────                        ─────────────────────────────
#   git clone source + restormel-gitops        curl an on-box control-plane API to
#   BuildKit build + PUSH to the registry        trigger a deploy (Coolify/Argo/kube-API)
#   git PUSH the bumped image tag commit        runner → cluster kubectl/argocd sync
#                                               any call to 10.0.1.1 / 172.16.0.x / :6443
#
# The deploy completes BY ARGO CD PULLING FROM GIT INSIDE THE CLUSTER — never by the
# runner pushing in. The runner only produces an image and proposes a git commit.
#
# ---------------------------------------------------------------------------------
# BUILD SURFACE (REC-PLAN-021 — the .166/.150 off-cluster runner premise died)
# ---------------------------------------------------------------------------------
# The old design wanted an off-cluster `docker-build` runner on .166. .166 became a
# K3s node and .150/BX11 were retired, so that runner no longer exists. We now build
# IN-CLUSTER on the existing on-cluster Forgejo runner (ns forgejo-runner) using a
# privileged `moby/buildkit` job container — BuildKit builds natively on an amd64
# cluster node and pushes to the registry over the fast internal network (the prior
# Mac→registry path hit a 60s proxy timeout on large layers; in-cluster does not).
# This is still OUTBOUND-ONLY: the job talks to the registry + gitops, never the
# kube-API/Argo. `moby/buildkit` has no Node, so we clone source by hand instead of
# the JS checkout action.
#
# ---------------------------------------------------------------------------------
# SECRETS / VARIABLES (Forgejo Actions — sourced from Infisical, never committed)
# ---------------------------------------------------------------------------------
#   vars.K3S_DEPLOY_ENABLED        — "1" to arm this pipeline (cutover gate). Absent ⇒ no-op.
#   secrets.FORGEJO_REGISTRY_USER  — registry push user (adam).
#   secrets.FORGEJO_REGISTRY_TOKEN — registry push token (FORGEJO_REGISTRY, write:package ONLY).
#   secrets.FORGEJO_PM_TOKEN       — clone source (read) + write restormel-gitops bump.
# Any required secret absent ⇒ the job no-ops cleanly (GitHub mirror / forks / first setup).
#
# ---------------------------------------------------------------------------------
# LEAST-PRIVILEGE TOKEN SCOPES (founder-gated provisioning; the design REQUIRES nothing more)
# ---------------------------------------------------------------------------------
#   FORGEJO_REGISTRY_TOKEN — write:package ONLY. Used solely to PUSH the built image.
#                            Never reaches the gitops bump step; never mounted into the
#                            build (no --build-arg / --secret), so an untrusted Dockerfile
#                            RUN cannot read it.
#   FORGEJO_PM_TOKEN       — for the INTEGRATION path this token MUST be scoped to the
#                            `integration` branch + PR comments/labels ONLY (NO trunk/main
#                            write, NO package write). It is used for: (a) read-only source
#                            clone, and (b) the gitops bump (restormel-gitops write). It is
#                            NEVER in scope of any step that executes untrusted-branch code.
# No blanket secret inheritance anywhere — every reusable-workflow secret is passed
# explicitly + minimally by the caller (see integration-train.yml).

name: Deploy K3s (GitOps)

on:
  # Prod release: a `dashboard-v*` tag (auto-created per main merge by auto-tag-release.yml,
  # or pushed by hand). Keyed off the tag so every prod release maps to a named, revertable
  # artifact — the GitOps commit in restormel-gitops is the second revertable artifact.
  push:
    tags:
      - 'dashboard-v*'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (integration | prod)"
        required: true
        default: "prod"
        type: choice
        options:
          - integration
          - prod
      dry_run:
        description: "Build + push images only; skip the gitops tag bump (pipeline validation)"
        required: false
        default: false
        type: boolean
  # workflow_call — lets integration-train.yml invoke the INTEGRATION build keyed to
  # the disposable `integration` branch HEAD (the batched, stage-labelled PRs). The
  # presence of the `ref` input is how the integration job detects a train-invoked
  # build (robust regardless of the caller's originating event). OUTBOUND-ONLY like
  # every path in this workflow.
  #
  # This reusable workflow DEFINITION runs from the DEFAULT branch (trunk) for the
  # train's schedule/dispatch events — so the orchestration YAML and the bump script it
  # invokes are trusted, never sourced from the untrusted integration tree.
  #
  # secrets are passed EXPLICITLY + MINIMALLY by the caller (no blanket inheritance).
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (the integration branch HEAD)."
        required: true
        type: string
      dry_run:
        description: "Build + push images only; skip the gitops bump (pipeline validation)."
        required: false
        default: false
        type: boolean
    secrets:
      FORGEJO_PM_TOKEN:
        description: "Read source clone + restormel-gitops bump. Scope: integration branch + comments/labels ONLY."
        required: false
      FORGEJO_REGISTRY_USER:
        required: false
      FORGEJO_REGISTRY_TOKEN:
        description: "write:package ONLY. Used only to push the built image."
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      POSTHOG_API_KEY:
        required: false

# One build/bump at a time per repo: two parallel full-workspace builds strain the
# node, and concurrent gitops pushes race on `git push origin main`.
concurrency:
  group: deploy-k3s
  cancel-in-progress: false

env:
  REG: git.allotmentology.tech
  IMAGE_REPO: allotment-technology-ltd
  GITOPS_REPO: Allotment-Technology-Ltd/restormel-gitops
  KEYS_REPO: Allotment-Technology-Ltd/restormel-keys

jobs:
  # ===========================================================================
  # INTEGRATION — build → push → bump restormel-integration manifests → Argo
  # AUTO-SYNCS (project restormel-nonprod). This is the RES-114 Integration Train's
  # build engine: it builds the disposable `integration` branch HEAD (the batched,
  # stage-labelled PRs), pushes the image to the Forgejo registry, and bumps the
  # integration env's raw deployment manifests in restormel-gitops. OUTBOUND-ONLY
  # (registry push + gitops git push only — the same REC-INC-006 invariant as prod;
  # the deploy completes by the in-cluster GitOps reconciler PULLING from git).
  #
  # It runs NO PBI-lifecycle flip: integration NEVER closes a PBI and NEVER promotes —
  # promotion stays the manual PR → trunk → prod path gated by the Security scan.
  #
  # DEFAULT-OFF: gated on the NEW vars.INTEGRATION_TRAIN_ENABLED. Absent ⇒ clean no-op.
  # Triggered by integration-train.yml via workflow_call (inputs.ref = integration HEAD)
  # or by a manual workflow_dispatch with environment=integration.
  #
  # BUILD SURFACE (RES-114 C3 decision — ROOTLESS, ISOLATED):
  # This job builds the UNTRUSTED batch of un-merged PRs, so it must NOT run privileged
  # co-resident with prod (privileged = root on the node = escape to prod workloads on
  # the lean shared cluster). It runs ROOTLESS buildkit (moby/buildkit:*-rootless with
  # seccomp/apparmor unconfined and the rootless no-process-sandbox flag — NO
  # --privileged) on a dedicated runner label `integration-build` that the founder
  # provisions on a build surface that is NOT schedulable onto prod nodes and is
  # egress-denied to the secret store / prod DB. Until that runner + the var exist,
  # the gated-off job is a clean no-op. (The prod job below keeps its own surface,
  # untouched.)
  #
  # TRUSTED ORCHESTRATION FROM TRUNK (RES-114 hardening, PR #374 — eliminates the PPE/TOCTOU
  # HIGH finding): the untrusted `integration` tree is consumed ONLY as the buildkit BUILD
  # CONTEXT (cloned into `buildctx/`, never sourced, never bash-executed). All code that
  # touches a write token — the bump script — is run from the DEFAULT-BRANCH (trunk)
  # checkout (`trunk/`), NEVER from `buildctx/`. The two write privileges are SPLIT across
  # two steps so neither holds a write token AND executes against the untrusted context:
  #   * Build step  → REG_TOKEN ONLY (write:package). Builds buildctx, pushes BY DIGEST,
  #                   emits the immutable sha256 digests. No gitops token; no secret mounted
  #                   into the build (no --build-arg/--secret/RUN env).
  #   * Bump step   → GITOPS_TOKEN ONLY. Runs the TRUNK script; pins the gitops manifest BY
  #                   DIGEST. No registry token; never touches buildctx; never runs untrusted
  #                   code.
  # DEFENSE-IN-DEPTH: the founder-provisioned `integration-build` runner MUST be
  # egress-restricted to the registry + source/gitops clone host + DNS only (NOT 0.0.0.0/0)
  # so even an untrusted Dockerfile RUN cannot exfiltrate to an arbitrary host (C3 build
  # surface live op). No step echoes a secret; pinning by digest gives build provenance.
  # ===========================================================================
  deploy-integration:
    name: Build, push, bump (integration) — trusted orchestration, Argo auto-syncs
    runs-on: integration-build
    container:
      image: moby/buildkit:v0.16.0-rootless
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    if: ${{ vars.INTEGRATION_TRAIN_ENABLED == '1' && (inputs.ref != '' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'integration')) }}
    steps:
      - name: Tooling (alpine buildkit image has no git/bash/jq/curl)
        shell: sh
        run: apk add --no-cache git bash jq curl

      - name: Checkout TRUSTED orchestration from trunk (default branch) — NOT the integration tree
        shell: bash
        env:
          PM_TOKEN: ${{ secrets.FORGEJO_PM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PM_TOKEN:-}" ]]; then
            echo "::warning::FORGEJO_PM_TOKEN absent — no-op (expected on the GitHub mirror / fork)."; exit 0
          fi
          # The bump script + every credential-handling line is taken from the DEFAULT
          # branch, never from the untrusted integration ref.
          git clone --depth 1 --branch main \
            "https://x-access-token:${PM_TOKEN}@git.allotmentology.tech/${KEYS_REPO}.git" trunk

      - name: Fetch UNTRUSTED build context at the integration ref (buildkit context ONLY — never executed)
        shell: bash
        env:
          PM_TOKEN: ${{ secrets.FORGEJO_PM_TOKEN }}
          INTEGRATION_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${PM_TOKEN:-}" ]]; then
            echo "::warning::FORGEJO_PM_TOKEN absent — no-op (expected on the GitHub mirror / fork)."; exit 0
          fi
          # `buildctx/` is ONLY a buildkit --local context (Dockerfile + app source). It is
          # never sourced and never bash-executed; no orchestration is read from it.
          git clone --depth 1 --branch "${INTEGRATION_REF}" \
            "https://x-access-token:${PM_TOKEN}@git.allotmentology.tech/${KEYS_REPO}.git" buildctx

      - name: Build + push integration image BY DIGEST (registry token ONLY; no gitops token; untrusted context not executed)
        id: build
        shell: bash
        env:
          REG_USER: ${{ secrets.FORGEJO_REGISTRY_USER }}
          REG_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
          ENV_NAME: integration
          BUILD_CONTEXT: buildctx
          # Rootless buildkitd cannot create the nested process sandbox without
          # privileges; disable just that (seccomp/apparmor are already unconfined on
          # the container above). This keeps the build non-privileged.
          BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
        run: |
          set -euo pipefail
          if [[ -z "${REG_TOKEN:-}" ]]; then
            echo "::warning::registry token absent — no-op (expected on the GitHub mirror / fork)."; exit 0
          fi
          # TRUSTED script from trunk; the untrusted tree is ONLY the buildkit --local context.
          bash trunk/.forgejo/scripts/k3s-build-push-bump.sh build integration

      - name: Bump integration manifests in restormel-gitops BY DIGEST (gitops token ONLY; trusted trunk code; no untrusted execution; no registry token)
        shell: bash
        env:
          GITOPS_TOKEN: ${{ secrets.FORGEJO_PM_TOKEN }}
          ENV_NAME: integration
          DASH_DIGEST: ${{ steps.build.outputs.DASH_DIGEST }}
          WORKER_DIGEST: ${{ steps.build.outputs.WORKER_DIGEST }}
          IMAGE_SHA: ${{ steps.build.outputs.IMAGE_SHA }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -z "${GITOPS_TOKEN:-}" ]]; then
            echo "::warning::gitops token absent — no-op (expected on the GitHub mirror / fork)."; exit 0
          fi
          if [[ -z "${DASH_DIGEST:-}" || -z "${WORKER_DIGEST:-}" ]]; then
            echo "::warning::no build digests (build step no-opped) — skipping bump."; exit 0
          fi
          # TRUSTED script from trunk; pins the gitops manifest by the immutable digest the
          # build step produced. This step never reads buildctx and has no registry token.
          bash trunk/.forgejo/scripts/k3s-build-push-bump.sh bump integration
          echo "::notice::Integration image (pinned by digest) bumped in restormel-gitops. The GitOps reconciler will auto-sync restormel-integration. Integration NEVER promotes to the trunk."

      # NB: NO PBI-lifecycle flip here — integration never closes PBIs, never promotes.

      - name: Alert on deploy failure (Telegram / PostHog)
        if: ${{ failure() }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          DEPLOY_PIPELINE: "deploy-k3s (integration)"
          DEPLOY_ENV: integration
        run: |
          set -uo pipefail
          # Run the TRUSTED (trunk) alert script — NEVER the untrusted buildctx copy — so the
          # alert secrets are never exposed to integration-branch code.
          if [[ -f trunk/.forgejo/scripts/deploy-failure-alert.sh ]]; then
            bash trunk/.forgejo/scripts/deploy-failure-alert.sh
          elif [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
            curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=⚠️ deploy-k3s (integration) FAILED for ${GITHUB_REPOSITORY}" >/dev/null || true
          fi

  # ===========================================================================
  # PROD — build → push → bump prod manifests. CI STOPS HERE.
  #   Argo then AUTO-SYNCS restormel-app-prod (REC-ADR-011, 2026-06-27 — the former
  #   "operator syncs by hand" manual gate was relaxed; the deploy gate is upstream:
  #   PR + CI + this pipeline's K3S_DEPLOY_ENABLED / build-must-go-green). The PBI
  #   status flip fires as the Argo PostSync hook on Sync success, not here.
  #   "deployed == synced", not "tag bumped". Rollback = revert the gitops bump commit.
  # ===========================================================================
  deploy-prod:
    name: Build, push, bump (prod) — Argo auto-syncs
    # docker-build = the dedicated 8Gi build-runner on node2 (gitops cluster/forgejo-build-runner).
    # The shared ubuntu-latest runner's dind is 2Gi → buildkit OOMs on dashboard/worker (the reason
    # prod was hand-built via one-off Jobs). Its act_runner config honours options: --privileged.
    runs-on: docker-build
    container:
      image: moby/buildkit:v0.16.0
      options: --privileged
    if: ${{ vars.K3S_DEPLOY_ENABLED == '1' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dashboard-v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')) }}
    steps:
      - name: Tooling (alpine buildkit image has no git/bash/jq/curl)
        shell: sh
        run: apk add --no-cache git bash jq curl

      - name: Clone source at the dispatched ref
        shell: bash
        env:
          PM_TOKEN: ${{ secrets.FORGEJO_PM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PM_TOKEN:-}" ]]; then
            echo "::warning::FORGEJO_PM_TOKEN absent — no-op (expected on the GitHub mirror / fork)."; exit 0
          fi
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${PM_TOKEN}@git.allotmentology.tech/${KEYS_REPO}.git" src

      - name: Build → push → bump PROD image tag in restormel-gitops
        shell: bash
        env:
          REG_USER: ${{ secrets.FORGEJO_REGISTRY_USER }}
          REG_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
          GITOPS_TOKEN: ${{ secrets.FORGEJO_PM_TOKEN }}
          ENV_NAME: prod
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -z "${REG_TOKEN:-}" || -z "${GITOPS_TOKEN:-}" ]]; then
            echo "::warning::registry/gitops token absent — no-op (expected on the GitHub mirror / fork)."; exit 0
          fi
          cd src && bash .forgejo/scripts/k3s-build-push-bump.sh "${ENV_NAME}"
          echo "::notice::PROD image tag bumped in restormel-gitops. Argo will show restormel-app-prod OutOfSync."
          echo "::notice::OPERATOR ACTION REQUIRED — sync by hand: argocd app sync restormel-app-prod (or click Sync in the Argo UI)."

      - name: Alert on deploy failure (Telegram / PostHog)
        if: ${{ failure() }}
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          DEPLOY_PIPELINE: "deploy-k3s (prod)"
          DEPLOY_ENV: prod
        run: |
          set -uo pipefail
          if [[ -f src/.forgejo/scripts/deploy-failure-alert.sh ]]; then
            bash src/.forgejo/scripts/deploy-failure-alert.sh
          elif [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
            curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=🔴 deploy-k3s (prod) FAILED for ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME} — prod NOT updated" >/dev/null || true
          fi
