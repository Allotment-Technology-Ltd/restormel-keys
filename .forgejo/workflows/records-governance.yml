# Records governance — Phase 2 (WARN-ONLY).
# Per the Records & IA plan every check here is NON-BLOCKING; a red pipeline on day one
# just trains people to ignore it. Phase 4 flips tier-2/3 to blocking by setting
# RECORDS_ENFORCE=1 on the relevant steps. Lives in .forgejo/workflows (overrides .github
# on the mirror); Forgejo is primary CI. Scripts are dependency-free — plain `node`.
name: Records governance (warn-only)

# Tier ① CI throughput (2026-06-24): cancel a superseded in-flight PR run when a
# newer commit lands on the same branch; never collapse push runs (run_id-unique).
concurrency:
  group: records-governance-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    paths:
      - 'docs/**'
      - 'records/**'
      - 'governance/**'
      - 'evidence/**'
      - 'planning/**'
      - 'legal/**'
      - 'people/**'
      - 'CODEOWNERS'
      - 'scripts/records/**'
      - '.forgejo/workflows/records-governance.yml'
  # WARN-ONLY / advisory (not a required branch-protection context), so it is safe
  # to scope the PR trigger to the records surface — mirrors the push paths so a
  # pure-code PR no longer spins the governance scripts on the runner. Records/docs
  # PRs (its actual purpose) still trigger it.
  pull_request:
    paths:
      - 'docs/**'
      - 'records/**'
      - 'governance/**'
      - 'evidence/**'
      - 'planning/**'
      - 'legal/**'
      - 'people/**'
      - 'CODEOWNERS'
      - 'scripts/records/**'
      - '.forgejo/workflows/records-governance.yml'

jobs:
  records-governance:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0   # ledger-append-guard + mirror-verify need history
          token: ${{ secrets.FORGEJO_TOKEN }}
      - name: Front-matter validation
        run: node scripts/records/frontmatter-validate.mjs
      - name: Freshness check
        run: node scripts/records/freshness-check.mjs
      - name: Register up to date (register-verify)
        run: node scripts/records/register.mjs --check
      - name: Ledger append-only guard
        run: node scripts/records/ledger-append-guard.mjs
      - name: CODEOWNERS coverage
        run: node scripts/records/codeowners-check.mjs
      - name: Mirror discipline
        env:
          # Read-only ls-remote target for divergence comparison — never pushed to.
          MIRROR_URL: https://github.com/Allotment-Technology-Ltd/restormel-keys.git
        run: node scripts/records/mirror-verify.mjs
