# On-demand Coolify preview deploy — replacement for Vercel preview deployments.
#
# This workflow points the Coolify preview app at a chosen branch/commit and
# triggers a fresh build+deploy, then polls until it finishes.  It is
# intentionally MANUAL ONLY (workflow_dispatch) so the owner controls cost:
# the preview app (https://preview.restormel.dev) is normally stopped and is
# only started when actively reviewing a branch.
#
# Preview environment characteristics:
#   - SvelteKit dashboard image, same build as staging
#   - Neon branch: vercel-dev (staging-like, not prod data)
#   - Paddle: sandbox keys (no live transactions)
#   - Coolify app UUID: wnbuwht1vlwutz5wc04kpx2q
#   - Domain: https://preview.restormel.dev
#
# Secrets required (org-level Forgejo Actions secret — set by OWNER-ACTION):
#   COOLIFY_TOKEN — Coolify API bearer token
#                   (Coolify UI → Profile → API tokens)
#                   Webhook-with-embedded-token 401s; header auth is required.
#
# If COOLIFY_TOKEN is absent the job exits cleanly (mirrors the guard in
# deploy-dashboard.yml so forks / GitHub mirror runs do not error).
#
# GitHub mirror note: .forgejo/workflows/ overrides .github/ on the Forgejo
# runner; the GitHub mirror re-triggers GitHub Actions which ignore this file.

name: Preview deploy (on-demand)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to preview"
        required: true
        default: "main"
        type: string

jobs:
  deploy-preview:
    name: Deploy preview to Coolify
    runs-on: docker
    steps:
      - name: Point preview app at branch and deploy
        shell: bash
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          PREVIEW_UUID: wnbuwht1vlwutz5wc04kpx2q
          REF_INPUT: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail

          if [[ -z "${COOLIFY_TOKEN:-}" ]]; then
            echo "COOLIFY_TOKEN not set — skipping preview deploy trigger."
            exit 0
          fi

          API="http://10.0.1.1:8000/api/v1"
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Content-Type: application/json")

          echo "Pointing preview app ${PREVIEW_UUID} at ref: ${REF_INPUT}"
          curl -sf -X PATCH "${auth[@]}" \
            -d "{\"git_branch\":\"${REF_INPUT}\"}" \
            "${API}/applications/${PREVIEW_UUID}"

          echo "Triggering deploy..."
          resp=$(curl -sf "${auth[@]}" \
            "${API}/deploy?uuid=${PREVIEW_UUID}&force=true")
          dep=$(echo "${resp}" | sed -n 's/.*"deployment_uuid":"\([a-z0-9]*\)".*/\1/p')
          if [[ -z "${dep}" ]]; then
            echo "ERROR: could not parse deployment_uuid from response: ${resp}"
            exit 1
          fi
          echo "preview: deployment ${dep} queued"

          # Poll every 20 s, up to 90 iterations (~30 min).
          for i in $(seq 1 90); do
            sleep 20
            status=$(curl -sf "${auth[@]}" \
              "${API}/deployments/${dep}" \
              | sed -n 's/.*"status":"\([a-z_]*\)".*/\1/p' | head -1)
            echo "preview [${i}] status=${status}"
            case "${status}" in
              finished)
                echo "Preview deploy succeeded."
                echo "Preview URL: https://preview.restormel.dev"
                exit 0
                ;;
              failed|cancelled*)
                echo "Preview deploy FAILED (status=${status})."
                exit 1
                ;;
            esac
          done

          echo "Preview deploy timed out after ~30 min."
          exit 1
