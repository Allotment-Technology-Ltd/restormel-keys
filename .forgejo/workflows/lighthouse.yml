# Forgejo CI — Lighthouse audit of the LIVE public pages.
#
# WHY scheduled-against-live (not per-PR build):
#   The dashboard is a heavy SSR app. The previous per-PR job rebuilt 20+ workspace
#   packages + the full memory-heavy dashboard, then served it with `vite preview`
#   and pointed Lighthouse at routes that need a real backend (DATABASE_URL / auth /
#   env). It could not reliably build+serve in CI, so it hard-failed on EVERY PR
#   (the score assertions were already warn-only) — pure red noise.
#
#   This audits the REAL, fully-rendered production pages instead: no build, no
#   serve, no backend stubbing. Same four categories (Performance / Accessibility /
#   Best-Practices / SEO). Runs nightly + on demand. Warn-only for now; flip to
#   blocking by removing the warn level once scores are stable (see assert step).
#
# Optional Telegram regression alert: set Forgejo Actions secrets TELEGRAM_BOT_TOKEN
# and TELEGRAM_CHAT_ID to get a ping when a category drops below threshold. The step
# is a clean no-op until both are set.

name: Lighthouse (live site)

on:
  schedule:
    - cron: '17 3 * * *' # nightly 03:17 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to audit'
        required: false
        default: 'https://restormel.dev'

jobs:
  lighthouse:
    name: Lighthouse audit (live public routes)
    runs-on: ubuntu-latest
    steps:
      - name: Install @lhci/cli
        run: npm install -g @lhci/cli@0.14.0

      - name: Install Google Chrome (real headless binary — no snap)
        run: |
          set -e
          # The runner's `chromium-browser` is a snap stub that can't launch headless
          # ("requires the chromium snap to be installed"), so Lighthouse never reached
          # the site. Install Google Chrome stable from the official .deb instead: a real
          # binary at a predictable path, on both Debian- and Ubuntu-based runners, with
          # its dependencies auto-resolved by apt. No snapd required.
          apt-get update -qq
          apt-get install -y --no-install-recommends wget ca-certificates
          wget -q -O /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          apt-get install -y --no-install-recommends /tmp/google-chrome.deb
          CHROME="$(command -v google-chrome-stable || command -v google-chrome)"
          "${CHROME}" --version
          echo "CHROME_PATH=${CHROME}" >> "$GITHUB_ENV"

      - name: Collect (live production URLs)
        env:
          BASE: ${{ github.event.inputs.base_url || 'https://restormel.dev' }}
        run: |
          lhci collect \
            --url="${BASE}/" \
            --url="${BASE}/keys" \
            --url="${BASE}/keys/pricing" \
            --url="${BASE}/keys/docs" \
            --settings.chromeFlags="--no-sandbox --headless=new --disable-dev-shm-usage" \
            ${CHROME_PATH:+--settings.chromePath="${CHROME_PATH}"} \
            --numberOfRuns=2

      - name: Assert scores (warn-only) + capture
        run: |
          set +e
          lhci assert \
            --preset=lighthouse:no-pwa \
            --assertions.categories:performance=["warn",{"minScore":0.7}] \
            --assertions.categories:accessibility=["warn",{"minScore":0.9}] \
            --assertions.categories:best-practices=["warn",{"minScore":0.9}] \
            --assertions.categories:seo=["warn",{"minScore":0.9}] \
            2>&1 | tee /tmp/lhci-assert.txt
          # warn-only: never fail the scheduled job on score regressions (yet).
          exit 0

      - name: Telegram alert on sub-threshold (no-op without secrets)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
            echo "Telegram secrets unset — skipping alert."; exit 0
          fi
          if grep -qiE "warning|fail|below the|minScore" /tmp/lhci-assert.txt; then
            MSG="⚠️ Lighthouse (live) — a category dropped below threshold on restormel.dev public pages. Run #${{ github.run_number }}; see the lighthouse-live artifact for the report."
            curl -s -m 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSG}" >/dev/null || true
            echo "Telegram regression alert sent."
          else
            echo "All categories within threshold — no alert."
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: lighthouse-live-${{ github.run_number }}
          path: .lighthouseci/
          retention-days: 30
