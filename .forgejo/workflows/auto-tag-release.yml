# Cut a dashboard prod release tag — DELIBERATE, on-demand (decision "de-automate
# merge→prod", ADR §5.1 / §6 Phase 1, 2026-07-02 — supersedes the 2026-06-16
# "auto-tag on every main merge").
#
# WHAT CHANGED: the trigger was `push: branches:[main]` (every app-affecting merge
# auto-cut the next `dashboard-v*` tag → deploy-k3s.yml deploy-prod → prod). A merge
# to `main` must no longer ship straight to prod: it now auto-deploys to INTEGRATION
# (merge-integration.yml), and prod is a DELIBERATE promotion of the tested artifact.
# So this workflow is now `workflow_dispatch` ONLY — a founder cuts the next
# `dashboard-v*` tag by hand when they choose to release (the interim prod path that
# stays alive during the transition to digest promotion).
#
# REVERSIBLE: to restore merge→prod auto-tagging, put the `push:` block back (see the
# commented original under `on:` below). The tag-compute + push body is unchanged.
#
# Prod stays GATED on a `dashboard-v*` tag (deploy-k3s.yml deploy-prod fires on the
# tag push); this workflow just creates that tag, with an explicit, revertable release
# artifact (the tag) per deploy. Rollback = redeploy a previous dashboard-v* tag
# (deploy-k3s.yml workflow_dispatch environment=prod on that tag's ref).
#
# WHY the tag is pushed with secrets.FORGEJO_TOKEN (a PAT) and not the runner's
# automatic token: a ref pushed by the automatic Actions token does NOT trigger
# another workflow run, so the tag-gated deploy would never fire. A PAT push does.
# The tag is pushed via `git push origin` using the credentials persisted by the
# checkout step (token: secrets.FORGEJO_TOKEN), which sets the correct auth header
# for origin — an explicit https://user:token@host URL was rejected 403 because the
# baked-in username did not match the token owner.
#
name: Auto-tag release

on:
  # DELIBERATE prod release only — a founder dispatches this to cut the next
  # `dashboard-v*` tag. Merge→main no longer auto-releases prod (it deploys to
  # integration via merge-integration.yml). See the header for the rationale.
  workflow_dispatch: {}
  # --- REVERT to restore merge→prod auto-tagging (one-line rollback): -----------
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/dashboard/**'
  #     - 'packages/**'
  # -----------------------------------------------------------------------------

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag dashboard release
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          # Default shallow checkout (just the merge commit). Do NOT add
          # fetch-depth: 0 — fetching every ref races with the branch deletions
          # that happen on merge and fails the step with "some refs were not
          # updated". Existing tags are read via `git ls-remote` below instead.
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Compute next dashboard-v* and push the release tag
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Read existing dashboard-v* tags straight from the remote (no local fetch
          # of objects/branches — avoids the ref-update race). A successful query
          # that matches nothing exits 0 with empty output (fine for the first run).
          remote_tags=$(git ls-remote --tags --refs origin 'dashboard-v*')
          latest=$(printf '%s\n' "${remote_tags}" \
            | sed -E 's#.*refs/tags/dashboard-v##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1 || true)

          if [ -z "${latest}" ]; then
            next="0.1.0"
          else
            MA=${latest%%.*}; rest=${latest#*.}; MI=${rest%%.*}; PA=${rest##*.}
            next="${MA}.${MI}.$((PA + 1))"
          fi
          TAG="dashboard-v${next}"

          if git ls-remote --tags --refs origin "${TAG}" | grep -q .; then
            echo "Tag ${TAG} already exists on the remote — nothing to release."; exit 0
          fi

          echo "Releasing ${TAG} at ${SHA}"
          git config user.name "forgejo-actions[bot]"
          git config user.email "actions@allotmentology.tech"
          git tag -a "${TAG}" -m "Auto-release on main merge (${SHA})"

          # Push with the credentials persisted by the checkout step (the PAT in
          # secrets.FORGEJO_TOKEN, token masked in logs) so the tag push triggers
          # deploy-dashboard.yml's `dashboard-v*` prod deploy.
          git push origin "refs/tags/${TAG}"

          echo "Pushed ${TAG}. deploy-dashboard.yml (dashboard-v* trigger) will run the prod deploy."
