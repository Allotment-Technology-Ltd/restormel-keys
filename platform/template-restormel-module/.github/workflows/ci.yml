# Minimal CI for a Restormel SvelteKit module. Composites are vendored under .github/actions/.
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: PNPM install
        uses: ./.github/actions/pnpm-workspace-install
      - name: Check
        run: pnpm run check
      - name: Build
        run: pnpm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: PNPM install
        uses: ./.github/actions/pnpm-workspace-install
      - name: Security scan
        uses: ./.github/actions/js-security-scan
