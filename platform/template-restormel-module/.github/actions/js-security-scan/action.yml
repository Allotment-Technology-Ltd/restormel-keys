name: "JS workspace security scan"
description: "TruffleHog on repo root and pnpm audit --audit-level critical (caller must checkout and run pnpm install first)."
runs:
  using: composite
  steps:
    - name: TruffleHog
      uses: trufflesecurity/trufflehog@bff3d2670b362bbb4a0bcdeffea146cbc2ad3abd
      with:
        path: ./
        extra_args: --only-verified
    - name: pnpm audit
      run: pnpm audit --audit-level critical
      shell: bash
