# WS6 Stage-C drill — in-cluster restic RESTORE Job (THROWAWAY, temp box only). REC-PLAN-021.
# Extends cluster/surrealdb/50-backup-cronjob.yaml: SAME restic/restic:0.18.0 image + native s3:
# backend, but `restic restore` instead of `backup`, and ZERO forget/prune/init (read-only).
#
# OPTIONAL: the harness restores host-side by default (creds stay on the workstation). Apply this
# only if you prefer the fetch to run in-cluster. Applied with envsubst (${JEWEL_PREFIX}); needs the
# restic passphrase + S3 creds in a Secret `dr-drill-restic` (ESO-rendered or hand-created on the box).
apiVersion: batch/v1
kind: Job
metadata:
  name: restic-restore-${JEWEL_PREFIX}
  namespace: dr-drill
  labels: { app.kubernetes.io/name: restic-restore, restormel.dev/throwaway: "true" }
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata: { labels: { app.kubernetes.io/name: restic-restore } }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532 }
      containers:
        - name: restic-restore
          image: restic/restic:0.18.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # READ-ONLY: list then restore latest. NEVER forget/prune/init/backup.
              restic snapshots --no-lock --latest 1 >/dev/null
              restic restore latest --no-lock --target /restore
              echo "RESTORED ${JEWEL_PREFIX}: $(find /restore -type f | wc -l) file(s)"
          env:
            - name: RESTIC_REPOSITORY
              value: "s3:https://fsn1.your-objectstorage.com/restormel-restic-backups/${JEWEL_PREFIX}"
            - { name: RESTIC_CACHE_DIR, value: "/cache" }
            - name: RESTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: dr-drill-restic, key: RESTIC_PASSWORD } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: dr-drill-restic, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: dr-drill-restic, key: AWS_SECRET_ACCESS_KEY } }
          volumeMounts:
            - { name: restore, mountPath: /restore }
            - { name: cache,   mountPath: /cache }
          resources: { requests: { memory: "256Mi", cpu: "200m" }, limits: { memory: "768Mi", cpu: "1" } }
      volumes:
        - { name: restore, emptyDir: {} }
        - { name: cache,   emptyDir: {} }
