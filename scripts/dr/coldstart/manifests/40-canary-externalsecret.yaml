# WS6 Stage-C drill — canary ExternalSecret (THROWAWAY, temp box only). REC-PLAN-021.
# Pattern from cluster/surrealdb/10-externalsecret.yaml. Proves that, on the scratch box, ESO
# can render a secret FROM the restored Infisical (Step 3) — i.e. the C1 machine-identity root +
# the restored J4/J5 are together sufficient. The rendered value is asserted only by
# Ready=SecretSynced; it is never printed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dr-drill-canary
  namespace: dr-drill
  labels:
    restormel.dev/role: dr-drill
    restormel.dev/throwaway: "true"
spec:
  refreshInterval: "0"               # one-shot for the drill
  secretStoreRef:
    name: infisical-restormel        # the `restormel` project store (re-pointed at scratch Infisical in Step 3)
    kind: ClusterSecretStore
  target:
    name: dr-drill-canary-rendered
    creationPolicy: Owner
  data:
    - secretKey: canary
      remoteRef:
        key: /dr/canary              # the known canary (CANARY_SECRET_PATH in the harness)
