# WS6 Stage-C drill — app-of-apps override (THROWAWAY, temp box only). REC-PLAN-021.
# Copy of applications/root/root-app.yaml with the repoURL re-pointed at the RESTORED Forgejo on
# the scratch box (git.__SCRATCH_DOMAIN__) instead of prod. Proves Argo rebuilds the estate from the
# *restored* git, not the live one. Applied by the harness with: sed 's/__SCRATCH_DOMAIN__/.../' | kubectl apply.
#
# project: default — the scratch ArgoCD (helm-installed) has no custom AppProjects; `default` permits all.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels: { restormel.dev/throwaway: "true" }
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.__SCRATCH_DOMAIN__/Allotment-Technology-Ltd/restormel-gitops.git
    targetRevision: main
    path: applications
    directory:
      recurse: true
      include: '{addons/*.yaml,workloads/*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
