# =============================================================================
# PrometheusRule — ESO + Argo CD  (plan §5.1: secrets delivery + deploy control)
# -----------------------------------------------------------------------------
# ESO renders EVERY pod's secrets incl. CNPG->fsn1 S3 creds + this stack's own
# creds; Infisical is off-cluster on .166 so the LINK is a dependency to watch.
# Argo CD is the deploy control plane: drift = an out-of-band change (governance/
# security concern) or a failed sync; a failing PostSync hook silently breaks the
# planning->delivery audit trail (#184).
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: secrets-delivery-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: restormel-monitoring
    release: kube-prometheus-stack
spec:
  groups:
    # =========================================================================
    - name: eso.sync
      rules:
        - alert: ESOExternalSecretNotSynced
          expr: |
            externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 15m
          labels: { severity: page, area: secrets }
          annotations:
            summary: "ExternalSecret {{ $labels.name }} not synced ({{ $labels.namespace }})"
            description: >-
              ESO cannot render {{ $labels.name }}. A sync failure silently breaks
              backups (s3-backup-creds-fsn1), deploys, cold-start, AND this monitoring
              stack's own creds. Infisical is off-cluster on .166.
            first_action: "Check Infisical reachability (https://secrets.restormel.dev) + the machine-identity creds; inspect the ExternalSecret events."
            runbook_url: "https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-keys/src/branch/main/docs/runbooks/infra-alert-response.md#eso-sync"

        - alert: ESOSyncErrorsRising
          expr: increase(externalsecret_sync_calls_error[15m]) > 0
          for: 10m
          labels: { severity: warn, area: secrets }
          annotations:
            summary: "ESO sync errors rising"
            description: "ESO is logging sync-call errors — the Infisical SecretStore may be unreachable or the identity may be expiring."
            first_action: "Check the ClusterSecretStore status + Infisical machine-identity; verify .166 reachability."
            runbook_url: "https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-keys/src/branch/main/docs/runbooks/infra-alert-response.md#eso-sync"

    # =========================================================================
    - name: argocd.delivery
      rules:
        # ---- DRIFT on a prod app — out-of-band change or failed sync --------
        # Prod sync is manual/gated, so we alert on OutOfSync that is NOT the
        # expected "CI bumped the tag, awaiting operator Sync" state by also
        # requiring the app to be unhealthy/degraded OR sustained. Tune post-soak.
        - alert: ArgoAppDegraded
          expr: |
            argocd_app_info{health_status="Degraded"} == 1
          for: 10m
          labels: { severity: page, area: delivery }
          annotations:
            summary: "Argo CD app Degraded: {{ $labels.name }}"
            description: "Application {{ $labels.name }} is Degraded — a sync failed or the workload is unhealthy (e.g. a fail-closed migration crash-loop)."
            first_action: "Open the Argo UI for {{ $labels.name }}; check the failing resource + pod logs before re-syncing."
            runbook_url: "https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-keys/src/branch/main/docs/runbooks/infra-alert-response.md#argo-degraded"

        - alert: ArgoAppOutOfSyncProd
          expr: |
            argocd_app_info{sync_status="OutOfSync",project="restormel-prod"} == 1
          for: 6h
          labels: { severity: warn, area: delivery }
          annotations:
            summary: "Prod app OutOfSync >6h: {{ $labels.name }}"
            description: >-
              {{ $labels.name }} (prod) has been OutOfSync >6h. Expected briefly after
              CI bumps the tag (awaiting the manual gate), but sustained drift may be
              an out-of-band change — investigate before re-syncing.
            first_action: "Diff the live vs desired in the Argo UI; confirm the drift is the intended CI tag bump, not an out-of-band edit."
            runbook_url: "https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-keys/src/branch/main/docs/runbooks/infra-alert-response.md#argo-drift"

        # ---- PostSync / sync-operation FAILED — the deploy succeeded but the
        #      audit-trail callback (#184 PBI-lifecycle hook) broke -----------
        - alert: ArgoSyncOperationFailed
          expr: |
            argocd_app_sync_total{phase="Failed"} > 0
          for: 5m
          labels: { severity: page, area: delivery }
          annotations:
            summary: "Argo sync operation Failed: {{ $labels.name }}"
            description: >-
              A sync operation (or PostSync hook — the #184 PBI-lifecycle callback)
              failed for {{ $labels.name }}. The deploy may have succeeded while the
              planning->delivery audit trail silently broke.
            first_action: "Check the sync-operation result + the PostSync hook Job logs; the audit-trail callback may need a manual re-run."
            runbook_url: "https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-keys/src/branch/main/docs/runbooks/infra-alert-response.md#argo-postsync"
