# Grafana ConfigMap wrapping the single-pane "amygdala" dashboard (the design-agent
# build; canonical Ops Centre home). Discovered by the Grafana sidecar
# (label grafana_dashboard:"1"); GitOps-managed, not hand-built in the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-centre-single-pane
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ops-centre-single-pane.json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "enable": true,
            "expr": "ALERTS{alertstate=\"firing\", severity=~\"page|critical\"}",
            "hide": false,
            "iconColor": "red",
            "name": "Firing pages",
            "titleFormat": "{{alertname}}",
            "useValueForTime": false
          }
        ]
      },
      "description": "Ops Centre single-pane RAG overview — the founder's amygdala view. One screen, large green/amber/red tiles for the most important operational areas, ordered by blast-radius. Each tile drills down into its detailed dashboard. Provisioned as a ConfigMap via the Grafana sidecar (GitOps-managed; do NOT hand-edit in the UI). RAG thresholds = planning D-M17 seed defaults.",
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "tags": [],
          "targetBlank": true,
          "title": "Argo CD",
          "type": "link",
          "url": "https://argo.allotmentology.tech"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "tags": [],
          "targetBlank": true,
          "title": "Alertmanager",
          "type": "link",
          "url": "https://alerts.allotmentology.tech"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "tags": [],
          "targetBlank": true,
          "title": "External status page (Uptime-Kuma)",
          "type": "link",
          "url": "https://status.allotmentology.tech"
        },
        {
          "asDropdown": true,
          "icon": "dashboard",
          "tags": ["ops-centre"],
          "targetBlank": false,
          "title": "Detailed dashboards",
          "type": "dashboards"
        }
      ],
      "liveNow": true,
      "panels": [
        {
          "type": "text",
          "title": "",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "options": {
            "mode": "markdown",
            "content": "# Restormel Ops Centre — is everything OK?\n**Green = healthy · Amber = watch · Red = act now.** Tiles are ordered by how much it hurts if they go red. Click any tile to drill in. The strip at the bottom lists every alert firing right now."
          }
        },
    
        {
          "type": "stat",
          "title": "BACKUPS  (the one that matters most)",
          "description": "RED if any data-loss-protecting backup is stale or its mechanism is down. Worst-of: CNPG WAL-archive-to-fsn1 age, CNPG base-backup age, Barman plugin sidecar up, Surreal hourly export age, restic→BX11 last run, etcd snapshot age. A silent WAL-archive failure is the single worst undetected failure in the estate. Drill: CNPG / Backups dashboard.",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 3 },
          "id": 1,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min(\n  clamp_max(\n    (\n      (time() - max(cnpg_collector_last_archived_wal_time) < bool 600)\n      + (time() - max(cnpg_collector_last_available_backup_timestamp) < bool 93600)\n      + (min(kube_pod_container_status_ready{namespace=\"data\", pod=~\".*-barman.*|.*plugin.*\"}) >= bool 1)\n      + (time() - max(restormel_surreal_export_last_success_timestamp) < bool 4200)\n      + (time() - max(restormel_restic_last_success_timestamp) < bool 93600)\n      + (time() - max(etcd_snapshot_last_success_timestamp) < bool 90000)\n    ) / 6,\n    1\n  )\n)",
              "instant": true,
              "legendFormat": "backups OK fraction"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "range", "options": { "from": 1, "to": 1, "result": { "text": "ALL BACKUPS GOOD", "color": "green", "index": 0 } } },
                { "type": "range", "options": { "from": 0.834, "to": 0.999, "result": { "text": "1 BACKUP DEGRADED", "color": "yellow", "index": 1 } } },
                { "type": "range", "options": { "from": -1, "to": 0.833, "result": { "text": "BACKUP FAILED / STALE", "color": "red", "index": 2 } } },
                { "type": "special", "options": { "match": "null", "result": { "text": "NO DATA", "color": "red", "index": 3 } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.834 },
                  { "color": "green", "value": 1 }
                ]
              },
              "color": { "mode": "thresholds" },
              "unit": "none",
              "noValue": "NO DATA",
              "links": [
                { "title": "CNPG / Backups dashboard", "url": "/d/ops-cnpg-backups/cnpg-backups?${__url_time_range}", "targetBlank": false }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "orientation": "auto",
            "wideLayout": true,
            "text": { "valueSize": 34, "titleSize": 16 }
          }
        },
    
        {
          "type": "stat",
          "title": "CLUSTER  (nodes · etcd quorum)",
          "description": "RED if a node is NotReady (quorum tolerates only ONE node loss), etcd has no leader, or pods are stuck unschedulable. AMBER if scheduling is slow / minor pressure. Drill: Kubernetes / Compute Resources.",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 3 },
          "id": 2,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min(\n  (min(kube_node_status_condition{condition=\"Ready\", status=\"true\"}) >= bool 1)\n  * (max(etcd_server_has_leader) >= bool 1)\n  * (sum(kube_pod_status_unschedulable) < bool 1)\n)",
              "instant": true,
              "legendFormat": "cluster healthy"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "ALL NODES READY", "color": "green", "index": 0 } } },
                { "type": "value", "options": { "0": { "text": "NODE / QUORUM RISK", "color": "red", "index": 1 } } },
                { "type": "special", "options": { "match": "null", "result": { "text": "NO DATA", "color": "red", "index": 2 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] },
              "color": { "mode": "thresholds" },
              "unit": "none",
              "noValue": "NO DATA",
              "links": [ { "title": "Cluster / nodes", "url": "/d/ops-cluster-nodes/cluster-nodes?${__url_time_range}", "targetBlank": false } ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value",
            "wideLayout": true, "text": { "valueSize": 34, "titleSize": 16 }
          }
        },
    
        {
          "type": "stat",
          "title": "DATA  (Postgres · Surreal)",
          "description": "RED if CNPG primary is down, replication lag is high, or SurrealDB (single-writer, no HA) is down/unready. AMBER on lag or PVC pressure. Drill: CNPG cluster dashboard.",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 3 },
          "id": 3,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min(\n  clamp_max(\n    (\n      (sum(cnpg_pg_replication_in_recovery) == bool 0 or max(cnpg_collector_up) >= bool 1)\n      + (max(cnpg_pg_replication_lag) < bool 30)\n      + (min(kube_statefulset_status_replicas_ready{statefulset=~\"surreal.*\"}) >= bool 1)\n    ) / 3,\n    1\n  )\n)",
              "instant": true,
              "legendFormat": "data healthy fraction"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "range", "options": { "from": 1, "to": 1, "result": { "text": "DATABASES HEALTHY", "color": "green", "index": 0 } } },
                { "type": "range", "options": { "from": 0.667, "to": 0.999, "result": { "text": "LAG / PRESSURE", "color": "yellow", "index": 1 } } },
                { "type": "range", "options": { "from": -1, "to": 0.666, "result": { "text": "DB DOWN", "color": "red", "index": 2 } } },
                { "type": "special", "options": { "match": "null", "result": { "text": "NO DATA", "color": "red", "index": 3 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.667 }, { "color": "green", "value": 1 } ] },
              "color": { "mode": "thresholds" },
              "unit": "none",
              "noValue": "NO DATA",
              "links": [ { "title": "CNPG / data dashboard", "url": "/d/ops-cnpg/cnpg?${__url_time_range}", "targetBlank": false } ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value",
            "wideLayout": true, "text": { "valueSize": 34, "titleSize": 16 }
          }
        },
    
        {
          "type": "stat",
          "title": "APPS  (dashboard · worker · allotmentology)",
          "description": "RED if any Phase-A app has no ready replicas, or its 5xx/error rate is over baseline (PostHog), or it is OOMKill-looping. AMBER on elevated p95 latency / error rate. Drill: Apps dashboard.",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 10 },
          "id": 4,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min(\n  clamp_max(\n    (\n      (min(kube_deployment_status_replicas_available{deployment=~\"restormel-dashboard|restormel-worker|allotmentology\"}) >= bool 1)\n      + (sum(rate(traefik_router_requests_total{code=~\"5..\"}[5m])) / clamp_min(sum(rate(traefik_router_requests_total[5m])), 0.001) < bool 0.02)\n    ) / 2,\n    1\n  )\n)",
              "instant": true,
              "legendFormat": "apps healthy fraction"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "range", "options": { "from": 1, "to": 1, "result": { "text": "APPS UP", "color": "green", "index": 0 } } },
                { "type": "range", "options": { "from": 0.5, "to": 0.999, "result": { "text": "ERRORS ELEVATED", "color": "yellow", "index": 1 } } },
                { "type": "range", "options": { "from": -1, "to": 0.499, "result": { "text": "APP DOWN", "color": "red", "index": 2 } } },
                { "type": "special", "options": { "match": "null", "result": { "text": "NO DATA", "color": "red", "index": 3 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 1 } ] },
              "color": { "mode": "thresholds" },
              "unit": "none",
              "noValue": "NO DATA",
              "links": [ { "title": "Apps dashboard", "url": "/d/ops-apps/apps?${__url_time_range}", "targetBlank": false } ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value",
            "wideLayout": true, "text": { "valueSize": 34, "titleSize": 16 }
          }
        },
    
        {
          "type": "stat",
          "title": "EDGE  (TLS certs · ingress 5xx)",
          "description": "RED if a wildcard cert is < 7 days from expiry and not renewing, or Traefik is down. AMBER if a cert is < 21 days out or 5xx is elevated. All public TLS flows through DNS-01 — a stuck renewal is a silent time-bomb. Drill: Traefik / cert-manager.",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 10 },
          "id": 5,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min((min(certmanager_certificate_expiration_timestamp_seconds) - time()) / 86400)",
              "instant": true,
              "legendFormat": "min cert days-to-expiry"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 7 }, { "color": "green", "value": 21 } ] },
              "color": { "mode": "thresholds" },
              "unit": "d",
              "decimals": 0,
              "noValue": "NO DATA",
              "links": [ { "title": "cert-manager / Traefik", "url": "/d/ops-edge/edge?${__url_time_range}", "targetBlank": false } ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value_and_name",
            "wideLayout": true, "text": { "valueSize": 34, "titleSize": 16 }
          }
        },
    
        {
          "type": "stat",
          "title": "DELIVERY  (Argo sync · drift)",
          "description": "RED if any prod Application is Degraded or a sync (incl. the #184 PBI-lifecycle PostSync hook) failed. AMBER on unexpected drift / OutOfSync. Drift = out-of-band change (governance concern) or a failed sync. Drill: Argo CD UI.",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 10 },
          "id": 6,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min(\n  clamp_max(\n    (\n      (sum(argocd_app_info{health_status=~\"Degraded|Missing|Unknown\"}) < bool 1)\n      + (sum(argocd_app_info{sync_status=\"OutOfSync\"}) < bool 1)\n    ) / 2,\n    1\n  )\n)",
              "instant": true,
              "legendFormat": "delivery healthy fraction"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "range", "options": { "from": 1, "to": 1, "result": { "text": "SYNCED & HEALTHY", "color": "green", "index": 0 } } },
                { "type": "range", "options": { "from": 0.5, "to": 0.999, "result": { "text": "DRIFT / OUT-OF-SYNC", "color": "yellow", "index": 1 } } },
                { "type": "range", "options": { "from": -1, "to": 0.499, "result": { "text": "APP DEGRADED", "color": "red", "index": 2 } } },
                { "type": "special", "options": { "match": "null", "result": { "text": "NO DATA", "color": "red", "index": 3 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "green", "value": 1 } ] },
              "color": { "mode": "thresholds" },
              "unit": "none",
              "noValue": "NO DATA",
              "links": [ { "title": "Argo CD UI", "url": "https://argo.allotmentology.tech", "targetBlank": true } ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value",
            "wideLayout": true, "text": { "valueSize": 34, "titleSize": 16 }
          }
        },
    
        {
          "type": "stat",
          "title": "SECRETS  (ESO ← Infisical)",
          "description": "RED if any ExternalSecret is in SecretSyncedError or the SecretStore can't reach Infisical (off-cluster on .166). A sync failure silently breaks backups, deploys, and cold-start. Drill: ESO dashboard.",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 17 },
          "id": 7,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "sum(externalsecret_status_condition{condition=\"Ready\", status=\"false\"}) + sum(externalsecret_sync_calls_error)",
              "instant": true,
              "legendFormat": "ESO errors"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "ALL SECRETS SYNCED", "color": "green", "index": 0 } } },
                { "type": "special", "options": { "match": "null", "result": { "text": "NO DATA", "color": "red", "index": 1 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] },
              "color": { "mode": "thresholds" },
              "unit": "none",
              "noValue": "NO DATA",
              "links": [ { "title": "ESO / secrets", "url": "/d/ops-secrets/secrets?${__url_time_range}", "targetBlank": false } ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value",
            "wideLayout": true, "text": { "valueSize": 34, "titleSize": 16 }
          }
        },
    
        {
          "type": "stat",
          "title": "COST / SCALE  (burst nodes @ rest)",
          "description": "Should be 0 at rest. RED if burst nodes have been up > 30 min with no pending burst workload — a silent €-bleed that breaks the “€0 at rest” guarantee. Drill: Autoscaler / cost dashboard.",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 17 },
          "id": 8,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "count(kube_node_labels{label_workload=\"burst\"}) or vector(0)",
              "instant": true,
              "legendFormat": "burst nodes"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "0  —  €0 AT REST", "color": "green", "index": 0 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 3 } ] },
              "color": { "mode": "thresholds" },
              "unit": "none",
              "noValue": "0",
              "links": [ { "title": "Autoscaler / cost", "url": "/d/ops-autoscaler/autoscaler?${__url_time_range}", "targetBlank": false } ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value",
            "wideLayout": true, "text": { "valueSize": 34, "titleSize": 16 }
          }
        },
    
        {
          "type": "stat",
          "title": "OFF-ESTATE PAGER  (dead-man's-switch)",
          "description": "The ONLY signal outside .166's failure domain. RED if the external dead-man's-switch (healthchecks.io / UptimeRobot) has not received a heartbeat — means the whole estate (incl. .166: cluster node, Forgejo, Infisical, meta-monitor) may be dark. Requires a Pushgateway/exporter mirroring the external monitor state (see SINGLE-PANE-DESIGN.md §Dependencies). Drill: external status page.",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 17 },
          "id": 9,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "expr": "min(time() - restormel_external_dms_last_ping_timestamp < bool 300)",
              "instant": true,
              "legendFormat": "DMS alive"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "DEAD-MAN'S-SWITCH OK", "color": "green", "index": 0 } } },
                { "type": "value", "options": { "0": { "text": "ESTATE MAY BE DARK", "color": "red", "index": 1 } } },
                { "type": "special", "options": { "match": "null", "result": { "text": "DMS NOT WIRED", "color": "yellow", "index": 2 } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] },
              "color": { "mode": "thresholds" },
              "unit": "none",
              "noValue": "DMS NOT WIRED",
              "links": [ { "title": "External status page", "url": "https://status.allotmentology.tech", "targetBlank": true } ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background", "graphMode": "none", "justifyMode": "center", "textMode": "value",
            "wideLayout": true, "text": { "valueSize": 28, "titleSize": 16 }
          }
        },
    
        {
          "type": "row",
          "title": "Right now",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 50,
          "panels": []
        },
    
        {
          "type": "stat",
          "title": "FIRING ALERTS  (page)",
          "description": "Count of severity=page/critical alerts firing now. Click to open the alert list.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 25 },
          "id": 10,
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "pluginVersion": "11.0.0",
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
