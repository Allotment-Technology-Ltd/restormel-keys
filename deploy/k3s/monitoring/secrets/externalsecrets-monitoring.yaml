# =============================================================================
# ExternalSecrets — Ops Centre monitoring stack  (plan req 1/2/6/§8)
# -----------------------------------------------------------------------------
# *** HIGH-RISK-SECURITY GATE: this file is the auth/secrets surface of the
#     monitoring stack. Route it through `restormel-high-risk-security` before the
#     PR that applies it (touches Grafana admin auth, the Telegram bot token, S3
#     creds, the dead-man's-switch capability URL, and the etcd client cert). ***
#
# *** NO SECRET VALUES IN GIT, EVER (plan §8 / design §6). *** Each ExternalSecret
# is a MAPPING ONLY: Infisical key -> Kubernetes Secret key. ESO renders the real
# values at runtime from the self-hosted Infisical (secrets.restormel.dev).
#
# STORE: every monitoring secret lives in the INFRASTRUCTURE Infisical project, so
# all reference the `infisical-infra` ClusterSecretStore (projectSlug:
# infrastructure, environmentSlug: prod, machine-identity auth) — defined in
# deploy/k3s/secrets/secretstore-infisical.yaml. This matches the plan: "use
# infisical-infra for monitoring secrets."
#
# ⚠ FOUNDER MUST POPULATE these keys in the `infrastructure` Infisical project
#   (env prod) before apply — see the per-secret `remoteRef.key` values + the
#   summary in the PR description / runbook.
# =============================================================================
---
# --- 1. Grafana admin credentials (plan req 1) -------------------------------
# kube-prometheus-stack reads admin-user / admin-password from this Secret
# (grafana.admin.existingSecret in the values file). NEVER set adminPassword
# inline in the Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: GRAFANA_ADMIN_USER          # Infisical key (infrastructure project)
    - secretKey: admin-password
      remoteRef:
        key: GRAFANA_ADMIN_PASSWORD
---
# --- 2. Alertmanager config (Telegram + dead-man's-switch) — RENDERED IN FULL --
# The ENTIRE alertmanager.yaml is rendered by ESO into this Secret because it
# embeds the Telegram bot token + the healthchecks.io capability URL. The
# kube-prometheus-stack values reference it via
# alertmanagerSpec.configSecret: alertmanager-telegram (key must be
# `alertmanager.yaml`). Shape is documented in
# ../alertmanager/alertmanager-config.template.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: alertmanager-telegram
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Alertmanager expects the config under this exact key.
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: telegram
            group_by: ['alertname', 'area']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: deadmansswitch
                matchers:
                  - alertname = "Watchdog"
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 5m
                continue: false
              - receiver: telegram
                matchers:
                  - severity = "page"
                group_wait: 10s
                repeat_interval: 1h
          receivers:
            - name: telegram
              telegram_configs:
                - bot_token: "{{ .telegramBotToken }}"
                  chat_id: {{ .telegramChatId }}
                  parse_mode: HTML
                  api_url: https://api.telegram.org
                  send_resolved: true
                  message: |
                    {{ `{{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }}` }} [{{ `{{ .CommonLabels.severity }}` }}] {{ `{{ .CommonLabels.alertname }}` }}
                    {{ `{{ range .Alerts }}` }}• {{ `{{ .Annotations.summary }}` }}
                    ↳ first action: {{ `{{ .Annotations.first_action }}` }}
                    ↳ runbook: {{ `{{ .Annotations.runbook_url }}` }}
                    {{ `{{ end }}` }}
            - name: deadmansswitch
              webhook_configs:
                - url: "{{ .heartbeatPingUrl }}"
                  send_resolved: false
          inhibit_rules:
            - source_matchers: [ severity = "page" ]
              target_matchers: [ severity = "warn" ]
              equal: ['alertname', 'area']
            - source_matchers: [ alertname = "NodeNotReady" ]
              target_matchers: [ area = "workloads" ]
              equal: ['node']
  data:
    - secretKey: telegramBotToken
      remoteRef:
        key: TELEGRAM_BOT_TOKEN
    - secretKey: telegramChatId
      remoteRef:
        key: TELEGRAM_CHAT_ID
    - secretKey: heartbeatPingUrl
      remoteRef:
        key: HEALTHCHECKS_PING_URL        # the healthchecks.io capability URL
---
# --- 3. Loki S3 (fsn1) credentials (plan req 2 / D-M4) -----------------------
# Injected into Loki as env (values-loki.yaml extraEnvFrom) → ${LOKI_S3_*} in the
# Loki storage_config. SEPARATE keys from the CNPG Barman creds so the log bucket
# can have its own scoped access key (least-privilege; do NOT reuse the CNPG
# backup key for logs).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-creds
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: loki-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: LOKI_S3_ACCESS_KEY_ID
      remoteRef:
        key: LOKI_S3_FSN1_ACCESS_KEY_ID
    - secretKey: LOKI_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: LOKI_S3_FSN1_SECRET_ACCESS_KEY
---
# --- 4. Dead-man's-switch heartbeat ping URL (plan §6 / D-M9) ----------------
# Read by the heartbeat CronJob (../deadmansswitch/heartbeat-cronjob.yaml). The
# healthchecks.io ping URL is a CAPABILITY URL (anyone with it can ping) → secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deadmans-switch
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: deadmans-switch
    creationPolicy: Owner
  data:
    - secretKey: HEARTBEAT_PING_URL
      remoteRef:
        key: HEALTHCHECKS_PING_URL        # SAME key the Alertmanager route uses
---
# --- 5. etcd client cert/key for scraping embedded k3s etcd (plan §3) --------
# The ONLY scrape that needs a client cert. The operator places the k3s-generated
# etcd client cert material (from /var/lib/rancher/k3s/server/tls/etcd/ on a
# node) into Infisical as base64; ESO renders the files. Mount into Prometheus via
# prometheus.prometheusSpec.secrets: [etcd-client-certs] (add that line to the
# kube-prometheus-stack values ONCE these keys exist — see
# ../scrape/servicemonitor-etcd.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-client-certs
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: etcd-client-certs
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: K3S_ETCD_CA_CRT               # base64-encoded PEM in Infisical
    - secretKey: client.crt
      remoteRef:
        key: K3S_ETCD_CLIENT_CRT
    - secretKey: client.key
      remoteRef:
        key: K3S_ETCD_CLIENT_KEY
