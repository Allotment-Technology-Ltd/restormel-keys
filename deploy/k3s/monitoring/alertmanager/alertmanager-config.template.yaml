# =============================================================================
# Alertmanager routing — REFERENCE TEMPLATE  (plan §5 / §6, D-M9)
# -----------------------------------------------------------------------------
# *** THIS FILE IS DOCUMENTATION, NOT AN APPLIED RESOURCE. ***
# The LIVE Alertmanager config is rendered by ESO into the Secret
# `alertmanager-telegram` (../secrets/externalsecrets-monitoring.yaml), which the
# kube-prometheus-stack values reference via
# `alertmanager.alertmanagerSpec.configSecret: alertmanager-telegram`. The config
# is rendered by ESO (not committed) BECAUSE it embeds the Telegram bot token —
# *** no token in git, ever *** (plan §8). This template shows the EXACT shape ESO
# renders, with the secret values as {{ }} placeholders pulled from Infisical.
#
# ROUTES:
#   1. Watchdog (always-firing) → `deadmansswitch` receiver → webhook to a tiny
#      bridge that re-pings healthchecks.io. (The CronJob in ../deadmansswitch is
#      the PRIMARY heartbeat; this Alertmanager route is the SECOND independent
#      path — plan §6.) Watchdog has repeat_interval shorter than the
#      healthchecks.io grace so the external service always hears from it.
#   2. Everything else → `telegram` receiver (the single human channel — free, no
#      SMTP, proven live REC-INC-001). PostHog also posts to the same Telegram
#      channel (the app-layer producer) — one channel, two producers (plan §5).
#
# GROUPING / INHIBITION: group by alertname+area; a `page` for a component
# inhibits its `warn`-level duplicates; node-down inhibits that node's pod alerts.
#
# Telegram bot_token + chat_id come from Infisical:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# (the infrastructure project; same channel the existing alerts use).
# =============================================================================
#
# --- the rendered ./alertmanager.yaml shape (what ESO writes into the Secret): --
