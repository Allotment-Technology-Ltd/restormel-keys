# Two Services for SurrealDB:
#  1. `surreal` (headless) — stable per-pod DNS for the StatefulSet.
#  2. `surreal-db` (ClusterIP) — the in-cluster connection target.
#     In-cluster consumers (Restormel dashboard/worker) use:
#       surreal-db.data.svc.cluster.local:8000
#     matching the design's `surrealdb.data.svc.cluster.local:8000` intent (§5).
---
apiVersion: v1
kind: Service
metadata:
  name: surreal
  namespace: data
  labels:
    app.kubernetes.io/name: surrealdb
spec:
  clusterIP: None # headless — backs the StatefulSet's stable identity
  selector:
    app.kubernetes.io/name: surrealdb
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: surreal-db
  namespace: data
  labels:
    app.kubernetes.io/name: surrealdb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: surrealdb
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
