# SurrealDB — 1-replica StatefulSet on Hetzner CSI (planning/k3s-cluster-target-design.md §5).
# rocksdb is a single-writer embedded engine, so HA = restore-from-backup, NOT multi-writer.
# Never scale replicas > 1 (data corruption / split storage). Pinned to v3.1.4 to MATCH the
# live data's version — `GET https://surreal.restormel.dev/version` returns surrealdb-3.1.4
# (verified 2026-06-22). export/import is only trivially safe same-major+minor. The earlier
# v3.2.0 pin was wrong (no such tag on Docker Hub). Bump deliberately, never :latest.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: surreal
  namespace: data
  labels:
    app.kubernetes.io/name: surrealdb
    app.kubernetes.io/part-of: restormel-sovereign-stack
spec:
  serviceName: surreal # headless service (30-service.yaml) for stable network identity
  replicas: 1 # HARD INVARIANT: rocksdb single-writer — do not increase
  selector:
    matchLabels:
      app.kubernetes.io/name: surrealdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surrealdb
    spec:
      # Pin to the data-role node (design §2). role=data is node-c (.166, 16GB/150GB — roomy).
      nodeSelector:
        restormel.dev/role: data
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: surreal
          image: surrealdb/surrealdb:v3.1.4
          imagePullPolicy: IfNotPresent
          args:
            - start
            # Storage path is the FIRST positional. Keeping it LAST (after --allow-funcs)
            # made the v3.1.4 clap parser consume it as an --allow-funcs value → crash
            # ("invalid value 'rocksdb:/data/surreal.db' for '--allow-funcs'"). With the
            # path first, --allow-funcs trails with no token = allow ALL functions (intended).
            - rocksdb:/data/surreal.db # positional on-disk storage path (crash-consistent)
            - --bind=0.0.0.0:8000
            - --log=info
            # Capabilities: deny everything, then allow ONLY SurrealQL functions (BM25
            # analyzer, vector/KNN ops used by graphrag-core). KEEP net + scripting DENIED.
            # (docs/infra/surreal-self-host-runbook.md §3.7/§3.8.)
            - --deny-all
            - --allow-funcs
          env:
            # Initial root user is bootstrapped from these on first start. README documents
            # rotating/retiring this as the *app* connection cred in favour of scoped users.
            - name: SURREAL_USER
              valueFrom:
                secretKeyRef:
                  name: surreal-root
                  key: SURREAL_USER
            - name: SURREAL_PASS
              valueFrom:
                secretKeyRef:
                  name: surreal-root
                  key: SURREAL_PASS
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: surreal-data
              mountPath: /data
          # SurrealDB serves HTTP + WS on the same port; /health is the liveness endpoint.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Tight requests for the small boxes; limits leave headroom for RocksDB +
            # HNSW/BM25 index builds. swap stays on as the OOM cushion (design §2.1).
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
  volumeClaimTemplates:
    - metadata:
        name: surreal-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes # Hetzner CSI (design §4.2/§5)
        resources:
          requests:
            storage: 20Gi # sized for the 581MB Sophia corpus + headroom; volumes billed per GB
