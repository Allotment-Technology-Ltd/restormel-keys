# Admin/root credential — used ONLY by the migration import and the backup CronJob.
# README documents retiring this as the *connection* cred for app consumers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-root
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-infra
  target:
    name: surreal-root
    creationPolicy: Owner
  data:
    - secretKey: SURREAL_USER
      remoteRef:
        key: SURREAL_ROOT_USER
    - secretKey: SURREAL_PASS
      remoteRef:
        key: SURREAL_ROOT_PASS
---
# Backup CronJob credentials: restic repo password + rclone config for BX11 Storage Box.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-backup
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-infra
  target:
    name: surreal-backup
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: RESTIC_REPOSITORY
    - secretKey: rclone.conf
      remoteRef:
        key: RCLONE_CONFIG_STORAGEBOX
