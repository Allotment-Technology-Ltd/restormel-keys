# SurrealDB credentials, delivered by External Secrets Operator from the self-hosted
# Infisical (planning/k3s-cluster-target-design.md §6). NO real values live here — these
# are placeholders/refs only. ESO renders the named k8s Secrets at runtime.
#
# Stores: the central per-project ClusterSecretStores (../secrets/secretstore-infisical.yaml),
# bootstrapped by the shared Secret `infisical-machine-identity` in ns `external-secrets`.
# This file does NOT define its own SecretStore. Routing (founder decision 2026-06-20):
#   • surreal-root, surreal-backup  → infisical-infra   (admin/migration/backup, infra-owned)
#   • DASHBOARD scoped user         → infisical-restormel — NOT created here. The canonical
#       dashboard cred is `surreal-dashboard-cred` in ../secrets/externalsecrets.yaml
#       (ns `restormel`, carries the high-risk-security gate note). Single source of truth.
#   • SOPHIA scoped user            → infisical-sophia (Phase B) — `surreal-sophia-cred` below.
#
# Keys expected in Infisical:
#   infrastructure project (store infisical-infra):
#     SURREAL_ROOT_USER, SURREAL_ROOT_PASS         -> admin/migration/backup only (see README:
#                                                     shared-root retirement plan)
#     RESTIC_PASSWORD, RESTIC_REPOSITORY            -> backup CronJob
#     RCLONE_CONFIG_STORAGEBOX (base64 rclone.conf) -> backup CronJob -> BX11
#   restormel project (store infisical-restormel — consumed via ../secrets/externalsecrets.yaml):
#     SURREAL_DASHBOARD_USER, SURREAL_DASHBOARD_PASS -> scoped DB user for the Restormel dashboard
#   sophia project (store infisical-sophia, Phase B):
#     SURREAL_SOPHIA_USER, SURREAL_SOPHIA_PASS       -> scoped DB user for Sophia (was `importer`)
---
# Admin/root credential — used ONLY by the migration import and the backup CronJob.
# README documents retiring this as the *connection* cred for app consumers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-root
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-infra
  target:
    name: surreal-root
    creationPolicy: Owner
  data:
    - secretKey: SURREAL_USER
      remoteRef:
        key: SURREAL_ROOT_USER
    - secretKey: SURREAL_PASS
      remoteRef:
        key: SURREAL_ROOT_PASS
---
# Scoped per-consumer credential for SOPHIA (the shared-root retirement, design §5). This is
# the database-level EDITOR user Sophia signs in as — never root. PHASE B: provisioned when
# Sophia migrates; kept here so the surreal namespace owns its scoped-user contract.
# (The DASHBOARD scoped user is NOT here — it is `surreal-dashboard-cred` in
#  ../secrets/externalsecrets.yaml, the single canonical dashboard credential.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-sophia-cred
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-sophia
  target:
    name: surreal-sophia-cred
    creationPolicy: Owner
  data:
    - secretKey: SOPHIA_USER
      remoteRef:
        key: SURREAL_SOPHIA_USER
    - secretKey: SOPHIA_PASS
      remoteRef:
        key: SURREAL_SOPHIA_PASS
---
# Backup CronJob credentials: restic repo password + rclone config for BX11 Storage Box.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-backup
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-infra
  target:
    name: surreal-backup
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: RESTIC_REPOSITORY
    - secretKey: rclone.conf
      remoteRef:
        key: RCLONE_CONFIG_STORAGEBOX
