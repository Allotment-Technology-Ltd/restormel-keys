# SurrealDB credentials, delivered by External Secrets Operator from the self-hosted
# Infisical (planning/k3s-cluster-target-design.md §6). NO real values live here — these
# are placeholders/refs only. ESO renders the named k8s Secrets at runtime.
#
# ⚠ TO ALIGN (task #35, 2026-06-20): this file defines its OWN `infisical-prod` SecretStore
#   + bootstrap `infisical-universal-auth` — inconsistent with the central folder-scoped
#   ClusterSecretStores (../secrets/secretstore-infisical.yaml: infisical-infra/restormel,
#   bootstrap `infisical-machine-identity`). It is self-contained so it still works, but
#   re-point before apply: surreal-root + surreal-backup → infisical-infra (/infra); the
#   scoped DASHBOARD user → infisical-restormel (/restormel; it duplicates
#   surreal-dashboard-cred in ../secrets/externalsecrets.yaml — keep ONE); the SOPHIA
#   scoped user → DEFER to Phase B (infisical-usesophia). Drop the local infisical-prod store.
#
# Cross-reference: the SecretStore `infisical-prod` below assumes the cluster-wide ESO
# install (deploy/k3s/eso/, a separate PR) has created the bootstrap Secret
# `infisical-universal-auth` holding the machine-identity clientId/clientSecret. That
# bootstrap Secret is the ONLY out-of-band secret (design §6).
#
# Keys expected in Infisical (projectSlug: restormel-ops, env: prod, path /surreal):
#   SURREAL_ROOT_USER, SURREAL_ROOT_PASS         -> admin/migration/backup only (see README:
#                                                   shared-root retirement plan)
#   SURREAL_DASHBOARD_USER, SURREAL_DASHBOARD_PASS -> scoped DB user for the Restormel dashboard
#   SURREAL_SOPHIA_USER, SURREAL_SOPHIA_PASS       -> scoped DB user for Sophia (was `importer`)
#   RESTIC_PASSWORD, RESTIC_REPOSITORY            -> backup CronJob
#   RCLONE_CONFIG_STORAGEBOX (base64 rclone.conf) -> backup CronJob -> BX11
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical-prod
  namespace: data
spec:
  provider:
    infisical:
      # Self-hosted Infisical (AST-013), reached over the cluster-internal/host path.
      hostAPI: https://secrets.restormel.dev/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth # bootstrap secret (out-of-band, created once)
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            key: clientSecret
      secretsScope:
        projectSlug: restormel-ops
        environmentSlug: prod
        secretsPath: /surreal
---
# Admin/root credential — used ONLY by the migration import and the backup CronJob.
# README documents retiring this as the *connection* cred for app consumers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-root
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-prod
  target:
    name: surreal-root
    creationPolicy: Owner
  data:
    - secretKey: SURREAL_USER
      remoteRef:
        key: SURREAL_ROOT_USER
    - secretKey: SURREAL_PASS
      remoteRef:
        key: SURREAL_ROOT_PASS
---
# Scoped per-consumer credentials (the shared-root retirement, design §5). These are the
# database-level EDITOR users the dashboard and Sophia sign in as — never root.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-scoped-users
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-prod
  target:
    name: surreal-scoped-users
    creationPolicy: Owner
  data:
    - secretKey: DASHBOARD_USER
      remoteRef:
        key: SURREAL_DASHBOARD_USER
    - secretKey: DASHBOARD_PASS
      remoteRef:
        key: SURREAL_DASHBOARD_PASS
    - secretKey: SOPHIA_USER
      remoteRef:
        key: SURREAL_SOPHIA_USER
    - secretKey: SOPHIA_PASS
      remoteRef:
        key: SURREAL_SOPHIA_PASS
---
# Backup CronJob credentials: restic repo password + rclone config for BX11 Storage Box.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-backup
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-prod
  target:
    name: surreal-backup
    creationPolicy: Owner
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: RESTIC_REPOSITORY
    - secretKey: rclone.conf
      remoteRef:
        key: RCLONE_CONFIG_STORAGEBOX
