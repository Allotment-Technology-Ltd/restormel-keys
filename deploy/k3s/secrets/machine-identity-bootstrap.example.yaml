# =============================================================================
# EXAMPLE ONLY — Infisical machine-identity bootstrap Secret
# -----------------------------------------------------------------------------
# This is the ONE out-of-band secret in the whole design (design §6): the
# Universal-Auth clientId/clientSecret that lets ESO authenticate to Infisical
# and pull every other secret. EVERYTHING else flows through ESO.
#
# *** DO NOT COMMIT REAL VALUES. *** This `.example.yaml` ships placeholders.
# The operator creates the REAL Secret out-of-band (never via git / GitOps),
# e.g. with `kubectl create secret` reading from a local shell variable that is
# itself sourced from the operator's Infisical session — NOT written to disk:
#
#   kubectl create secret generic infisical-machine-identity \
#     -n external-secrets \
#     --from-literal=clientId="$INFISICAL_MI_CLIENT_ID" \
#     --from-literal=clientSecret="$INFISICAL_MI_CLIENT_SECRET"
#
# Because this is the GitOps bootstrap anchor, it is applied by the operator's
# hand, before Argo CD / ESO can sync anything. Argo must be told to IGNORE this
# Secret (it is operator-owned, not git-owned).
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: infisical-machine-identity
  namespace: external-secrets
  annotations:
    # Keep GitOps off this Secret — it is operator-managed, out-of-band.
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  clientId: "REPLACE_OUT_OF_BAND_DO_NOT_COMMIT"      # placeholder
  clientSecret: "REPLACE_OUT_OF_BAND_DO_NOT_COMMIT"  # placeholder
