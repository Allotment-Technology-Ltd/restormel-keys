# =============================================================================
# ExternalSecrets — folder-scoped (Infisical), placeholders only, NO real values
# -----------------------------------------------------------------------------
# COMPONENT: External Secrets Operator v2.6.0 — external-secrets.io/v1.
# Each ExternalSecret references the **folder-scoped ClusterSecretStore** for the
# area its secret lives in (secretstore-infisical.yaml): `infisical-infra` (/infra),
# `infisical-restormel` (/restormel), `infisical-allotmentology` (/allotmentology).
# `remoteRef.key` is the secret NAME inside that folder (path comes from the store).
#
# *** No secret VALUE here. *** Values live only in Infisical; ESO materialises them.
# CNPG Barman S3 creds are NOT here — they are `s3-backup-creds-fsn1` in
# cnpg/eso-secret-placeholders.yaml (the one objectstore-fsn1.yaml actually reads).
# =============================================================================
---
# --- Hetzner DNS API token (cert-manager DNS-01 solver) — INFRA ---------------
# key MUST be `token` to match the ClusterIssuer's tokenSecretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-dns-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: hetzner-dns-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: HETZNER_DNS_API_TOKEN
---
# --- Hetzner Cloud API token (CCM + CSI driver) — INFRA -----------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcloud-token
  namespace: kube-system          # hcloud CCM + CSI conventionally run here
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: hcloud                  # Secret name expected by hcloud CCM/CSI
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: HCLOUD_TOKEN
    - secretKey: network
      remoteRef:
        key: HCLOUD_NETWORK_NAME      # expected value: restormel-internal
---
# --- App secret bundle (Restormel dashboard) — RESTORMEL ---------------------
# dataFrom bulk-pull. find.path is relative to the store's secretsPath (/restormel),
# so this pulls /restormel/dashboard/* . VERIFY find.path scoping at apply.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restormel-dashboard-env
  namespace: restormel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel
    kind: ClusterSecretStore
  target:
    name: restormel-dashboard-env
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /dashboard            # relative to store path /restormel
        name:
          regexp: ".*"
---
# --- SurrealDB scoped per-consumer credential (dashboard) — RESTORMEL ---------
# design §5: retire the shared root cred for scoped users. The Surreal scoped creds
# live in the /restormel folder.
# >>> HIGH-RISK-SECURITY GATE: introducing/rotating these scoped Surreal users
#     (replacing the shared root cred) MUST go through restormel-high-risk-security
#     before the PR that applies it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-dashboard-cred
  namespace: restormel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel
    kind: ClusterSecretStore
  target:
    name: surreal-dashboard-cred
    creationPolicy: Owner
  data:
    - secretKey: SURREAL_USER
      remoteRef:
        key: SURREAL_DASHBOARD_USER
    - secretKey: SURREAL_PASS
      remoteRef:
        key: SURREAL_DASHBOARD_PASS
