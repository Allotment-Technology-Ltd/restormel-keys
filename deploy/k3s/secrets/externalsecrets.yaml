# =============================================================================
# Example ExternalSecrets — placeholders only, NO real secret values
# -----------------------------------------------------------------------------
# COMPONENT: External Secrets Operator v2.6.0 — external-secrets.io/v1.
# Each ExternalSecret renders ONLY the keys a given pod needs (design §6:
# "per-ExternalSecret rendering only the keys a pod needs"). The `remoteRef.key`
# values are the Infisical secret NAMES in project restormel-ops / env prod —
# the operator confirms exact names in Infisical; placeholder names used here.
#
# *** Nothing here contains a secret VALUE. *** Values live only in Infisical and
# are materialised into in-cluster Secrets at runtime by ESO.
# =============================================================================
---
# --- CNPG → Hetzner Object Storage (Barman S3 creds) -------------------------
# design §4.3 / §6: "S3 creds via ESO ... never plaintext". CNPG's
# barmanObjectStore.s3Credentials references THIS rendered Secret. Target object
# store: fsn1 (Decisions register: CNPG Barman → Hetzner Object Storage fsn1,
# cross-region PITR). Endpoint configured on the CNPG cluster, not here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-creds
  namespace: cnpg-system          # adjust to wherever the CNPG clusters live
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel-ops
    kind: SecretStore
  target:
    name: cnpg-s3-creds           # the k8s Secret CNPG reads
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: HETZNER_OBJ_S3_ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: HETZNER_OBJ_S3_SECRET_ACCESS_KEY
---
# --- Hetzner DNS API token (cert-manager DNS-01 solver) ----------------------
# Consumed by the Hetzner cert-manager webhook (see ../ingress/clusterissuer-*).
# Lives in the cert-manager namespace; key MUST be `token` to match the
# ClusterIssuer's tokenSecretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-dns-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel-ops
    kind: SecretStore
  target:
    name: hetzner-dns-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: HETZNER_DNS_API_TOKEN
---
# --- Hetzner Cloud API token (CCM + CSI driver) ------------------------------
# design §3.3: "Hetzner CCM + CSI install regardless (need a Hetzner API token
# from Infisical)". Same token family used by hetzner-k3s at bootstrap (HCLOUD_TOKEN),
# delivered IN-cluster here for the controllers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hcloud-token
  namespace: kube-system          # hcloud CCM + CSI conventionally run here
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel-ops
    kind: SecretStore
  target:
    name: hcloud                  # Secret name expected by hcloud CCM/CSI
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: HCLOUD_TOKEN
    # CSI also wants the private network name for route attachment.
    - secretKey: network
      remoteRef:
        key: HCLOUD_NETWORK_NAME      # expected value: restormel-internal
---
# --- Example APP secret bundle (Restormel dashboard) -------------------------
# Illustrates dataFrom bulk-pull (design §6 pattern) — render a whole app's
# secret set in one ExternalSecret. Use `find.path` to scope to a sub-path in
# Infisical so a pod only gets ITS keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restormel-dashboard-env
  namespace: restormel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel-ops
    kind: SecretStore
  target:
    name: restormel-dashboard-env
    creationPolicy: Owner
  # Pull every key under /restormel/dashboard/* in Infisical (scoped, least-priv).
  dataFrom:
    - find:
        path: /restormel/dashboard
        name:
          regexp: ".*"
---
# --- Example: SurrealDB scoped per-consumer credential -----------------------
# design §5: "retire the shared root cred for scoped per-consumer users
# (dashboard, Sophia) via ESO → Infisical — route this auth change through
# restormel-high-risk-security." This renders the scoped Surreal user the
# dashboard uses; the equivalent `importer` user for Sophia lives under
# /sophia/* and is rendered in the Sophia namespace in Phase B.
#
# >>> HIGH-RISK-SECURITY GATE: introducing/rotating these scoped Surreal users
#     (replacing the shared root cred) MUST go through the
#     restormel-high-risk-security review before the Phase A/B PR that applies it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surreal-dashboard-cred
  namespace: restormel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel-ops
    kind: SecretStore
  target:
    name: surreal-dashboard-cred
    creationPolicy: Owner
  data:
    - secretKey: SURREAL_USER
      remoteRef:
        key: SURREAL_DASHBOARD_USER
    - secretKey: SURREAL_PASS
      remoteRef:
        key: SURREAL_DASHBOARD_PASS
