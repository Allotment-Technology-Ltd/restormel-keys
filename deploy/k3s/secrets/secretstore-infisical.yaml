      hostAPI: https://secrets.restormel.dev/api
      auth:
        universalAuthCredentials:
          clientId:    { name: infisical-machine-identity, key: clientId,     namespace: external-secrets }
          clientSecret: { name: infisical-machine-identity, key: clientSecret, namespace: external-secrets }
      secretsScope:
        projectSlug: restormel
        environmentSlug: prod
        secretsPath: /
        recursive: false
---
