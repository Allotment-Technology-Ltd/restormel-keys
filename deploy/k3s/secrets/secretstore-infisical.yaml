# =============================================================================
# External Secrets Operator — per-project ClusterSecretStores (Infisical)
# -----------------------------------------------------------------------------
# COMPONENT: External Secrets Operator v2.6.0 (chart external-secrets 2.6.0).
#            API group external-secrets.io/v1.
# INSTALL (operator, off-cluster — config-only here, NOT applied by CI):
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#       -n external-secrets --create-namespace
#
# DESIGN: k3s-cluster-target-design.md §6 + planning/secrets-architecture-infra-per-product.md.
#
# SECRETS LAYOUT (founder decision 2026-06-20): self-hosted Infisical
# (secrets.restormel.dev) holds a DEDICATED PROJECT per area — least-privilege +
# blast-radius containment. ESO side: ONE ClusterSecretStore per project.
#   store                       projectSlug      projectId
#   infisical-infra             infrastructure   7ea6ec41-1998-4899-8e47-0bd81b8f5b71
#   infisical-restormel         restormel        f0165998-e695-428e-bf20-b776279a6832
#   infisical-allotmentology    allotmentology   ce0cf62e-94a0-48d7-9fdb-493ef4fd1d03
#   infisical-sophia (Phase B)  sophia           af4fc47a-b8d2-49c4-bda2-ac93cf76b053
#   infisical-plotbudget (PhB)  plotbudget       aadc1e04-121a-4bd1-8bbb-46245b8b86e7
# (Slugs supplied by founder 2026-06-20. ⚠ confirm `allotmentology` spelling in
#  Infisical → Project Settings → Slug — the hand-off message read "alltomentology".)
#
# MACHINE IDENTITY: ONE shared ESO machine-identity (Universal Auth), added to all
# five projects with READ on env `prod`. ESO renders every project's secrets, so a
# single identity is correct here; the project boundaries protect human/external
# access. Bootstrap Secret `infisical-machine-identity` (clientId/clientSecret) in
# namespace `external-secrets` — the ONLY out-of-band secret (NOT in git).
#
# *** NO SECRET VALUES IN GIT. ***
# =============================================================================
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-infra              # → infrastructure project (HCLOUD, S3 backups, DNS, Forgejo, restic, telegram, email)
spec:
  provider:
    infisical:
      hostAPI: https://secrets.restormel.dev/api
      auth:
        universalAuthCredentials:
          clientId:    { name: infisical-machine-identity, key: clientId,     namespace: external-secrets }
          clientSecret: { name: infisical-machine-identity, key: clientSecret, namespace: external-secrets }
      secretsScope:
        projectSlug: infrastructure
        environmentSlug: prod
        secretsPath: /
        recursive: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-restormel          # → restormel project (pg-restormel creds, Surreal scoped creds, dashboard app)
spec:
  provider:
