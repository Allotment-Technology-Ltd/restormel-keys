# =============================================================================
# External Secrets Operator — SecretStore (Infisical provider)
# -----------------------------------------------------------------------------
# COMPONENT: External Secrets Operator v2.6.0 (chart external-secrets 2.6.0,
#            verified 2026-06-20). API group external-secrets.io/v1.
# INSTALL (operator, off-cluster — config-only here, NOT applied by CI):
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#       -n external-secrets --create-namespace
#
# DESIGN: k3s-cluster-target-design.md §6 + Decisions register: Secrets = ESO
#         ← self-hosted Infisical (NO sealed-secrets — would fork the source of
#         truth). Infisical stays OFF-CLUSTER permanently (bootstrap anchor).
#
# Project: restormel-ops / env: prod (design §6). Infisical reached at its
# off-cluster host secrets.restormel.dev.
#
# *** NO SECRET VALUES IN GIT. *** The ONLY out-of-band secret is the Infisical
# machine-identity bootstrap (clientId/clientSecret), created once by the
# operator into the Secret `infisical-machine-identity` — see the placeholder
# manifest in machine-identity-bootstrap.example.yaml (NOT applied; example).
# =============================================================================
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical-restormel-ops
  namespace: external-secrets        # one shared store; ExternalSecrets reference it cross-ns via ClusterSecretStore if needed
spec:
  provider:
    infisical:
      # Self-hosted Infisical API (off-cluster bootstrap anchor).
      hostAPI: https://secrets.restormel.dev/api
      auth:
        # Machine-identity Universal Auth. clientId/clientSecret come from the
        # out-of-band bootstrap Secret — NOT stored in git.
        universalAuthCredentials:
          clientId:
            name: infisical-machine-identity
            key: clientId
          clientSecret:
            name: infisical-machine-identity
            key: clientSecret
      secretsScope:
        projectSlug: restormel-ops    # design §6
        environmentSlug: prod         # design §6
        secretsPath: /
        recursive: false
---
# -----------------------------------------------------------------------------
# OPTIONAL: ClusterSecretStore — same Infisical backend, usable from any
# namespace (so per-namespace ExternalSecrets — restormel / data / cert-manager
# / kube-system for CCM+CSI — don't each need a local SecretStore). The bootstrap
# clientId/clientSecret Secret must then live in the ESO controller namespace.
# Uncomment if you prefer one cluster-wide store over per-namespace stores.
