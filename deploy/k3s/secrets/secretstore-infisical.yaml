# =============================================================================
# External Secrets Operator — folder-scoped ClusterSecretStores (Infisical)
# -----------------------------------------------------------------------------
# COMPONENT: External Secrets Operator v2.6.0 (chart external-secrets 2.6.0).
#            API group external-secrets.io/v1.
# INSTALL (operator, off-cluster — config-only here, NOT applied by CI):
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#       -n external-secrets --create-namespace
#
# DESIGN: k3s-cluster-target-design.md §6 + Decisions register: Secrets = ESO ←
#         self-hosted Infisical (NO sealed-secrets). Infisical stays OFF-CLUSTER.
#
# SECRETS LAYOUT (founder decision 2026-06-20 — planning/secrets-architecture-infra-per-product.md):
#   ONE Infisical project (`restormel-ops`) = the single store, organised into a
#   dedicated FOLDER per area — /infra, /restormel, /allotmentology (+ /plotbudget,
#   /usesophia in later phases) — read by ONE shared machine-identity. On the ESO
#   side that is ONE **ClusterSecretStore per folder** (cluster-wide so any namespace
#   can reference it; folder isolation by `secretsScope.secretsPath`). Each
#   ExternalSecret references the store for the area its secret lives in.
#
# *** NO SECRET VALUES IN GIT. *** The ONLY out-of-band secret is the Infisical
# machine-identity bootstrap (clientId/clientSecret) → Secret `infisical-machine-identity`
# in namespace `external-secrets` (see machine-identity-bootstrap.example.yaml). The
# identity needs READ on restormel-ops/prod across all three folders.
# =============================================================================
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-infra              # → /infra (HCLOUD, S3 backups, DNS, Forgejo, restic, telegram, email)
spec:
  provider:
    infisical:
      hostAPI: https://secrets.restormel.dev/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-machine-identity
            key: clientId
            namespace: external-secrets
          clientSecret:
            name: infisical-machine-identity
            key: clientSecret
            namespace: external-secrets
      secretsScope:
        projectSlug: restormel-ops
        environmentSlug: prod
        secretsPath: /infra
        recursive: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-restormel          # → /restormel (pg-restormel creds, Surreal scoped creds, dashboard app)
spec:
  provider:
    infisical:
      hostAPI: https://secrets.restormel.dev/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-machine-identity
            key: clientId
            namespace: external-secrets
          clientSecret:
            name: infisical-machine-identity
            key: clientSecret
            namespace: external-secrets
      secretsScope:
        projectSlug: restormel-ops
        environmentSlug: prod
        secretsPath: /restormel
        recursive: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-allotmentology     # → /allotmentology (allotmentology DB creds + app secrets)
spec:
  provider:
    infisical:
      hostAPI: https://secrets.restormel.dev/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-machine-identity
            key: clientId
            namespace: external-secrets
          clientSecret:
            name: infisical-machine-identity
            key: clientSecret
            namespace: external-secrets
      secretsScope:
        projectSlug: restormel-ops
        environmentSlug: prod
        secretsPath: /allotmentology
        recursive: false
# -----------------------------------------------------------------------------
# Later phases add: infisical-plotbudget (/plotbudget) + infisical-usesophia
# (/usesophia) — same shape, when those products migrate.
# -----------------------------------------------------------------------------
