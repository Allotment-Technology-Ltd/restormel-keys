# Argo CD repo-connection credential — delivered by External Secrets Operator.
# ---------------------------------------------------------------------------
# NO SECRET MATERIAL IN GIT (design §6). ESO renders the Forgejo deploy-token
# into the Secret Argo CD reads to clone the gitops repo. The label
# `argocd.argoproj.io/secret-type: repository` is what makes Argo pick it up.
#
# Prereqs (created by the cluster-addons app, not here):
#   - External Secrets Operator installed
#   - a ClusterSecretStore named `infisical-prod` (Infisical provider,
#     machine-identity auth, projectSlug: restormel-ops, environmentSlug: prod)
#
# The only out-of-band secret in the whole chain is the Infisical machine
# identity used to bootstrap ESO itself (design §6).
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-gitops
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-prod
    kind: ClusterSecretStore
  target:
    name: argocd-repo-gitops
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-gitops.git
        username: "{{ .gitopsRepoUser }}"
        password: "{{ .gitopsRepoToken }}"
  data:
    - secretKey: gitopsRepoUser
      remoteRef:
        # Infisical key holding the Forgejo bot username with read access to the
        # restormel-gitops repo. VALUE lives only in Infisical, never in git.
        key: GITOPS_REPO_USER
    - secretKey: gitopsRepoToken
      remoteRef:
        key: GITOPS_REPO_TOKEN
---
# Optional: same pattern for the Forgejo container registry pull credential,
# so workload pods can pull from registry.allotmentology.tech without an
# inlined dockerconfigjson. Referenced by imagePullSecrets in each workload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry-pull
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-prod
    kind: ClusterSecretStore
  target:
    name: forgejo-registry-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.allotmentology.tech":{"username":"{{ .regUser }}","password":"{{ .regToken }}","auth":"{{ printf "%s:%s" .regUser .regToken | b64enc }}"}}}
  data:
    - secretKey: regUser
      remoteRef: { key: FORGEJO_REGISTRY_USER }
    - secretKey: regToken
      remoteRef: { key: FORGEJO_REGISTRY_TOKEN }
