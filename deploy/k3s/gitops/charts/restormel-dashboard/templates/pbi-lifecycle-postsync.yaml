# PBI lifecycle callback — Argo CD PostSync HOOK (prod).  Implements DEPLOY-PIPELINE.md §4/§5.
# =============================================================================
# WHY A POSTSYNC HOOK (not a workflow step) FOR PROD
# -----------------------------------------------------------------------------
# Prod sync is MANUAL (design §8). CI only *bumps the image tag* in restormel-gitops
# and stops — the deploy is NOT complete until the operator clicks Sync. So the PBI
# flip must fire on **prod Sync success**, not on the CI build/bump job. An Argo CD
# `PostSync` hook runs exactly once, AFTER all in-wave resources of the prod sync are
# Healthy — i.e. precisely when "deployed" == "synced & live". DEPLOY-PIPELINE.md §4
# recommended option (a); this is option (a). Staging keeps the in-workflow flip
# (auto-sync ⇒ deploy completes in-band); see DEPLOY-PIPELINE.md §5.
#
# LOGIC PRESERVED BYTE-FOR-BYTE from commit 6bc3edac (the label-ID fix):
#   - resolve `status/deployed` BY ID from the ORG labels (org labels are a silent
#     no-op by name — that was the 6bc3edac fix);
#   - for each OPEN issue carrying `status/ready-deploy`: delete any existing
#     `status/*` label (status is exclusive), POST `status/deployed` by ID, PATCH closed;
#   - guarded by FORGEJO_TOKEN (absent ⇒ clean skip).
# Only the TRIGGER POINT moves (workflow step → PostSync hook); the body is identical.
#
# OUTBOUND-ONLY (REC-INC-006 invariant)
# -----------------------------------------------------------------------------
# This Job ONLY makes egress HTTPS calls to the PUBLIC Forgejo API at
# https://git.allotmentology.tech/api/v1. It is NOT a runner→on-box step and it
# NEVER dials a box private IP (no 10.0.1.1 / 172.16.0.2 / cluster-internal host) —
# so it cannot recreate the ephemeral-subnet route collision of REC-INC-006. The
# only inbound dependency is the ESO-delivered token Secret (cluster-local).
#
# PLACEMENT (README "Repo move map"): this lives in the PROD dashboard chart's
# templates — restormel-keys `deploy/k3s/gitops/charts/restormel-dashboard/templates/`
# → restormel-gitops `charts/restormel-dashboard/templates/`. It is DELIBERATELY NOT
# under `applications/workloads/`: that dir is swept by the root-app's directory glob
# (`{addons/*.yaml,workloads/*.yaml}`, recurse) — a Job/ExternalSecret placed there
# would be applied to the `argocd` namespace at every ROOT sync, firing the lifecycle
# unconditionally and bypassing the prod manual gate. Living inside the chart means it
# renders ONLY on the prod dashboard Application's Sync and inherits its namespace
# (restormel-prod). A PostSync hook must be a resource *inside* the synced app, never a
# peer the root-app renders, and never a child Application of its own.
#
# This is plain YAML (no `{{ }}`); Helm passes non-templated files in templates/ through
# unchanged. Bind it to the PROD dashboard chart only — do NOT add it to the staging
# chart (staging keeps the in-workflow lifecycle step).
# =============================================================================
---
# Token for the hook — delivered by ESO from Infisical (NO value in git, design §6).
# FORGEJO_PM_TOKEN is the Forgejo bot token with issue-write on restormel-keys (same
# identity the CI lifecycle step used). It lives in the `infrastructure` Infisical
# project → infisical-infra ClusterSecretStore (secretstore-infisical.yaml). If the
# token is absent the hook script no-ops cleanly (mirror/fork/first-boot), matching
# the old workflow's `[ -z FORGEJO_TOKEN ] && skip` guard.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-pm-token
  namespace: restormel-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: forgejo-pm-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: FORGEJO_PM_TOKEN
---
apiVersion: batch/v1
kind: Job
metadata:
  name: restormel-pbi-lifecycle
  namespace: restormel-prod
  annotations:
    # Run AFTER the prod app's resources are synced & Healthy.
    argocd.argoproj.io/hook: PostSync
    # Clean up the Job on success; KEEP it on failure so the operator can read logs
    # (the flip is best-effort and must never block or fail the prod sync).
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    # Run after the workload sync-waves (worker is wave 1); the hook phase already
    # runs post-Sync, the wave just orders it last within the phase for clarity.
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/part-of: restormel
    restormel.dev/role: pbi-lifecycle
spec:
  # The flip is idempotent (it only ever moves ready-deploy → deployed+closed), but
  # we don't want Argo to wait forever on a transient Forgejo blip on a manual sync.
  backoffLimit: 2
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        restormel.dev/role: pbi-lifecycle
    spec:
      restartPolicy: Never
      # Egress-only workload; no service account token needed for the Forgejo API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: lifecycle
          # Tiny image that already ships curl + jq (the only two tools the script
          # needs). Pinned by digest-able tag; no app code, no box access.
          image: registry.allotmentology.tech/restormel/ci-curl-jq:1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-pm-token
                  key: token
                  optional: true        # absent ⇒ clean skip (mirror/fork/first-boot)
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              # --- PBI lifecycle callback — byte-for-byte from commit 6bc3edac -----------
              # (the only change vs the workflow step: jq/curl are baked into the image,
              #  so no apt-get install; everything below is identical, label-ID logic kept.)
              if [ -z "${FORGEJO_TOKEN:-}" ]; then
                echo "FORGEJO_TOKEN not set — skipping PM lifecycle callback."; exit 0
              fi
              ORG="Allotment-Technology-Ltd"; REPO="${ORG}/restormel-keys"
              BASE="https://git.allotmentology.tech/api/v1"
              # NB: the workflow used a bash `auth=(...)` array; this hook runs under
              # /bin/sh (POSIX), so the Authorization header is inlined on each curl.
              # A prod deploy ships all of main, so every PBI at status/ready-deploy is now live.
              labels="$(curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" "${BASE}/orgs/${ORG}/labels?limit=200")"
              deployed_id="$(printf '%s' "${labels}" | jq -r '.[]|select(.name=="status/deployed")|.id')"
              open_issues="$(curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" "${BASE}/repos/${REPO}/issues?state=open&type=issues&limit=100")"
              nums="$(printf '%s' "${open_issues}" | jq -r '.[]|select(.labels|map(.name)|index("status/ready-deploy"))|.number')"
              if [ -z "${nums}" ]; then echo "No PBIs at status/ready-deploy — nothing to close."; exit 0; fi
              for n in ${nums}; do
                # status is exclusive: drop any existing status/* label first, then add status/deployed
                curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" "${BASE}/repos/${REPO}/issues/${n}/labels" \
                  | jq -r '.[]|select(.name|startswith("status/"))|.id' \
                  | while read -r sid; do [ -n "${sid}" ] && curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" -X DELETE "${BASE}/repos/${REPO}/issues/${n}/labels/${sid}" >/dev/null 2>&1 || true; done
                [ -n "${deployed_id}" ] && curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" -X POST "${BASE}/repos/${REPO}/issues/${n}/labels" -H 'Content-Type: application/json' -d "{\"labels\":[${deployed_id}]}" >/dev/null 2>&1 || true
                curl -fsS -H "Authorization: token ${FORGEJO_TOKEN}" -X PATCH "${BASE}/repos/${REPO}/issues/${n}" -H 'Content-Type: application/json' -d '{"state":"closed"}' >/dev/null 2>&1 || true
                echo "deployed + closed #${n}"
              done
              echo "PM lifecycle callback complete."
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
