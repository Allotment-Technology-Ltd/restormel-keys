# Restormel dashboard — PREVIEW (on-demand).  SYNC = MANUAL (cost control).
# ---------------------------------------------------------------------------
# Replaces the on-demand Coolify preview app (preview.restormel.dev, normally
# stopped — see .forgejo/workflows/preview-deploy.yml). Under GitOps the preview
# app exists but is scaled to zero by default; the operator points it at a ref by
# bumping image.tag + replicaCount in the preview values file, then syncs by hand.
# Manual sync here is a COST guard (start only when actively reviewing a branch),
# not a prod-style gate — but the effect is the same: no unattended rollout.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restormel-preview
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: restormel-nonprod
  source:
    repoURL: https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-gitops.git
    targetRevision: main
    path: charts/restormel-dashboard
    helm:
      valueFiles:
        - ../../values/restormel-preview.yaml   # replicaCount: 0 by default
  destination:
    server: https://kubernetes.default.svc
    namespace: restormel-preview
  # MANUAL — operator starts/points/stops the preview deliberately.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
