# Restormel worker — PRODUCTION.  SYNC = MANUAL (design §8).
# ---------------------------------------------------------------------------
# Same manual-gate posture as the dashboard. The worker shares the dashboard's
# release: in the current Coolify pipeline they deploy SERIALLY (dashboard →
# worker) to avoid OOMing the box on two parallel builds. Under GitOps the build
# happens once on the off-cluster runner and BOTH apps consume the same image
# tag, so there is no double-build — but we keep them as two Applications so the
# operator can sync/observe them independently, and a sync-wave keeps the worker
# rolling AFTER the dashboard (migrations run from the dashboard image, §migration
# note below).
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restormel-worker-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after dashboard (wave 0) — migrations land first
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: restormel-prod
  source:
    repoURL: https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-gitops.git
    targetRevision: main
    path: charts/restormel-worker
    helm:
      valueFiles:
        - ../../values/restormel-worker-prod.yaml   # image.tag bumped by CI (same SHA as dashboard)
  destination:
    server: https://kubernetes.default.svc
    namespace: restormel-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
