# Restormel dashboard — PRODUCTION.  SYNC = AUTO (REC-ADR-011, 2026-06-27).
# ---------------------------------------------------------------------------
# Reference manifest for the documented gitops layout. The live prod Application is
# `restormel-app-prod` in restormel-gitops; this file mirrors its sync policy.
#
# As of 2026-06-27 prod AUTO-SYNCS the reviewed artefact (see
# docs/decisions/prod-argo-autosync.md — REC-ADR-011). The deploy gate is UPSTREAM:
# PR review + CI (security scan / full build / bundled-asset guard) + the deploy-k3s
# pipeline gate (K3S_DEPLOY_ENABLED + build-must-go-green). An operator hand-sync added
# latency, not safety. Rollback = revert the gitops image-bump commit (Argo re-syncs).
# (Was: NO `syncPolicy.automated` block → manual operator Sync — the manual gate that
# traced to REC-INC-006; that control was deliberately relaxed by REC-ADR-011. The
# REC-INC-006 outbound-only/pull-based invariant is preserved — Argo pulls.)
#
# Image tag bump flow (DEPLOY-PIPELINE.md):
#   CI builds → pushes registry.allotmentology.tech/restormel/dashboard:<sha>
#            → bumps image.tag in values-dashboard-prod.yaml in restormel-gitops
#            → Argo AUTO-SYNCS prod.
#
# MIGRATIONS FAIL-CLOSED: the dashboard image runs pending DB migrations on start
# against CNPG (pg-restormel); if a migration fails the pod crash-loops and the
# Argo sync is reported Degraded — it does NOT silently serve old schema. This
# preserves the current "deploys auto-apply pending migrations, fail-closed"
# invariant (CLAUDE.md standing norms).
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restormel-dashboard-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # NOTE: Argo CD Image Updater is INTENTIONALLY NOT enabled on prod (no
  # argocd-image-updater.argoproj.io/* annotations). The deterministic, auditable,
  # revertable path is "CI bumps the tag in git" — every prod release is a revertable
  # gitops commit. Argo then auto-syncs that reviewed commit (REC-ADR-011).
spec:
  project: restormel-prod
  source:
    repoURL: https://git.allotmentology.tech/Allotment-Technology-Ltd/restormel-gitops.git
    targetRevision: main
    path: charts/restormel-dashboard
    helm:
      valueFiles:
        - ../../values/restormel-dashboard-prod.yaml   # image.tag bumped by CI
  destination:
    server: https://kubernetes.default.svc
    namespace: restormel-prod
  # AUTO-SYNC the reviewed artefact (REC-ADR-011, 2026-06-27). prune + selfHeal +
  # allowEmpty:false. Safety is carried at runtime (RollingUpdate + readiness probes,
  # PDB minAvailable:1 + node anti-affinity, fail-closed migration entrypoint,
  # revisionHistoryLimit). Rollback = revert the gitops image-bump commit.
  # prune verified safe: every Argo-tracked prod resource is in git.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
  ignoreDifferences: []
