# ---- pg-plotbudget: self-hosted Supabase service-role passwords (Phase B) ----
# CNPG `spec.managed.roles[].passwordSecret` reads the `password` key of each
# Secret below and sets it on the matching role (created without a password by
# plotbudget-supabase-bootstrap.sql). `username` is included for parity (CNPG
# ignores it for managed roles). The same passwords feed the service DSNs:
#   authenticator        -> PostgREST  (PGRST_DB_URI / DB_PLOTBUDGET_URL)
#   supabase_auth_admin  -> GoTrue     (GOTRUE_DB_DATABASE_URL)
#   supabase_storage_admin -> Storage  (DATABASE_URL)
#   supabase_admin       -> Realtime   (DB_USER/DB_PASSWORD)
# Keep the Infisical values and the service connection strings in lockstep.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-plotbudget-authenticator
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-plotbudget
    kind: ClusterSecretStore
  target:
    name: pg-plotbudget-authenticator
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: PG_PLOTBUDGET_AUTHENTICATOR_USERNAME
    - secretKey: password
      remoteRef:
        key: PG_PLOTBUDGET_AUTHENTICATOR_PASSWORD
---
