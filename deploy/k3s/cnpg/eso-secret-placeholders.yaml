# =============================================================================
# External Secrets Operator (ESO) — placeholder ExternalSecrets
# =============================================================================
# DESIGN ARTEFACT ONLY — not applied. NO REAL SECRET MATERIAL.
#
# These render the Kubernetes Secrets the CNPG manifests reference, pulling the
# actual values from Infisical (secrets.restormel.dev) at runtime. Nothing here
# contains a credential — only the MAPPING from Infisical keys → Secret keys.
#
# Requires: External Secrets Operator installed + a SecretStore/ClusterSecretStore
# named `infisical-restormel` wired to the Infisical project. That SecretStore is
# an owner/operator item (provider config + auth), NOT created here.
#
# Secret-key contract expected by the CNPG manifests:
#   - CNPG basic-auth user/password Secrets need keys `username` + `password`.
#   - The S3 backup Secret needs keys `ACCESS_KEY_ID` + `SECRET_ACCESS_KEY`.
# -----------------------------------------------------------------------------

# ---- S3 backup credentials → fsn1 Object Storage (referenced by ObjectStore) -
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-backup-creds-fsn1
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel
    kind: ClusterSecretStore
  target:
    name: s3-backup-creds-fsn1
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: HETZNER_S3_FSN1_ACCESS_KEY_ID        # Infisical key (placeholder)
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: HETZNER_S3_FSN1_SECRET_ACCESS_KEY    # Infisical key (placeholder)
---
# ---- pg-restormel: superuser + app role ------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-restormel-superuser
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel
    kind: ClusterSecretStore
  target:
    name: pg-restormel-superuser
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: PG_RESTORMEL_SUPERUSER_USERNAME
    - secretKey: password
      remoteRef:
        key: PG_RESTORMEL_SUPERUSER_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-restormel-app-creds
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-restormel
    kind: ClusterSecretStore
  target:
    name: pg-restormel-app-creds
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: PG_RESTORMEL_APP_USERNAME
    - secretKey: password
      remoteRef:
        key: PG_RESTORMEL_APP_PASSWORD
---
