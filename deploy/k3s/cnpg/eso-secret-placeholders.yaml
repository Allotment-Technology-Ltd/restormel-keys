# =============================================================================
# External Secrets Operator (ESO) — placeholder ExternalSecrets
# =============================================================================
# DESIGN ARTEFACT ONLY — not applied. NO REAL SECRET MATERIAL.
#
# These render the Kubernetes Secrets the CNPG manifests reference, pulling the
# actual values from Infisical (secrets.restormel.dev) at runtime. Nothing here
# contains a credential — only the MAPPING from Infisical keys → Secret keys.
#
# Each ExternalSecret references the **per-project ClusterSecretStore** for the
# area its secret belongs to (../secrets/secretstore-infisical.yaml). Routing map
# (founder decision 2026-06-20 — least-privilege per project):
#   • s3-backup-creds-fsn1, pg-platform-superuser         → infisical-infra
#   • pg-restormel-*, pg-platform-restormel-staging-creds → infisical-restormel
#   • pg-platform-allotmentology-creds                    → infisical-allotmentology
#   • pg-plotbudget-* (super/app + 4 role secrets)        → infisical-plotbudget (Phase B)
#   • pg-platform-usesophia-creds                         → infisical-sophia     (Phase B)
# (Phase-B entries are kept for completeness but are not provisioned until those
#  products migrate — see planning/k3s-migration-execution-sequence.md.)
#
# The CNPG Barman S3 backup secret is `s3-backup-creds-fsn1` below — the one
# objectstore-fsn1.yaml actually reads. Its Infisical keys are the fsn1 object
# storage keys HETZNER_S3_FSN1_ACCESS_KEY_ID / HETZNER_S3_FSN1_SECRET_ACCESS_KEY
# (cross-region bucket restormel-cnpg-backups-fsn1, endpoint fsn1.your-objectstorage.com).
#
# Requires: External Secrets Operator installed + the ClusterSecretStores wired to
# their Infisical projects (secretstore-infisical.yaml) and the bootstrap Secret
# `infisical-machine-identity` in ns `external-secrets`. Those are owner/operator
# items (provider config + auth), NOT created here.
#
# Secret-key contract expected by the CNPG manifests:
#   - CNPG basic-auth user/password Secrets need keys `username` + `password`.
#   - The S3 backup Secret needs keys `ACCESS_KEY_ID` + `SECRET_ACCESS_KEY`.
# -----------------------------------------------------------------------------

# ---- S3 backup credentials → fsn1 Object Storage (referenced by ObjectStore) -
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-backup-creds-fsn1
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-infra
    kind: ClusterSecretStore
  target:
    name: s3-backup-creds-fsn1
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: HETZNER_S3_FSN1_ACCESS_KEY_ID        # Infisical key (placeholder)
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: HETZNER_S3_FSN1_SECRET_ACCESS_KEY    # Infisical key (placeholder)
---
