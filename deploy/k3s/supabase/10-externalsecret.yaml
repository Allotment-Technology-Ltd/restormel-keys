# Supabase secrets via External Secrets Operator <- self-hosted Infisical (design §6).
# NO real values here — placeholders/refs only. ESO renders the named k8s Secrets at runtime.
#
# Keys expected in Infisical (projectSlug: restormel-ops, env: prod, path /supabase):
#   JWT_SECRET            -> the HS256 secret GoTrue signs / PostgREST+Realtime+Storage verify.
#                            MUST equal PlotBudget's existing SUPABASE_JWT_SECRET so already-issued
#                            tokens stay valid through cutover.
#   ANON_KEY              -> long-lived anon JWT signed with JWT_SECRET (role=anon).
#   SERVICE_ROLE_KEY      -> long-lived service-role JWT signed with JWT_SECRET (role=service_role).
#   DB_PLOTBUDGET_URL     -> Postgres conn string -> the pg-plotbudget CNPG cluster
#                            (e.g. postgres://<role>:<pw>@pg-plotbudget-rw.data.svc.cluster.local:5432/plotbudget)
#                            CNPG itself owns the role passwords; this is the app-facing role.
#   GOTRUE_GOOGLE_CLIENT_ID / GOTRUE_GOOGLE_SECRET  -> re-registered Google OAuth (self-hosted)
#   GOTRUE_APPLE_CLIENT_ID  / GOTRUE_APPLE_SECRET   -> re-registered Apple OAuth (self-hosted)
#   SEND_EMAIL_HOOK_SECRET  -> HMAC secret shared with the send-resend-email GoTrue email hook
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY  -> Hetzner Object Storage creds for the storage bucket
#   DASHBOARD_USERNAME / DASHBOARD_PASSWORD  -> Studio basic-auth (Kong)
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical-prod
  namespace: supabase
spec:
  provider:
    infisical:
      hostAPI: https://secrets.restormel.dev/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth # bootstrap secret (out-of-band, created once)
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            key: clientSecret
      secretsScope:
        projectSlug: restormel-ops
        environmentSlug: prod
        secretsPath: /supabase
---
# Core JWT/keys + DB URL shared by GoTrue, PostgREST, Realtime, Storage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-core
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-prod
  target:
    name: supabase-core
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: JWT_SECRET }
    - secretKey: ANON_KEY
      remoteRef: { key: ANON_KEY }
    - secretKey: SERVICE_ROLE_KEY
      remoteRef: { key: SERVICE_ROLE_KEY }
    - secretKey: DB_PLOTBUDGET_URL
      remoteRef: { key: DB_PLOTBUDGET_URL }
---
# GoTrue-specific: OAuth providers + the send-email hook secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-auth
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-prod
  target:
    name: supabase-auth
    creationPolicy: Owner
  data:
    - secretKey: GOTRUE_GOOGLE_CLIENT_ID
      remoteRef: { key: GOTRUE_GOOGLE_CLIENT_ID }
    - secretKey: GOTRUE_GOOGLE_SECRET
      remoteRef: { key: GOTRUE_GOOGLE_SECRET }
    - secretKey: GOTRUE_APPLE_CLIENT_ID
      remoteRef: { key: GOTRUE_APPLE_CLIENT_ID }
    - secretKey: GOTRUE_APPLE_SECRET
      remoteRef: { key: GOTRUE_APPLE_SECRET }
    - secretKey: SEND_EMAIL_HOOK_SECRET
      remoteRef: { key: SEND_EMAIL_HOOK_SECRET }
---
# Storage S3 backend creds (Hetzner Object Storage, hel1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-storage-s3
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-prod
  target:
    name: supabase-storage-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: S3_ACCESS_KEY_ID }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: S3_SECRET_ACCESS_KEY }
---
# Studio dashboard basic-auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-studio
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: infisical-prod
  target:
    name: supabase-studio
    creationPolicy: Owner
  data:
    - secretKey: DASHBOARD_USERNAME
      remoteRef: { key: DASHBOARD_USERNAME }
    - secretKey: DASHBOARD_PASSWORD
      remoteRef: { key: DASHBOARD_PASSWORD }
