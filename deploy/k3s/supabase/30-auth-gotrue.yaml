# GoTrue (Supabase Auth) — the entire PlotBudget identity system (full-migration-plan §B).
# Pointed at the pg-plotbudget CNPG cluster via GOTRUE_DB_DATABASE_URL (from supabase-core).
# Image pinned to the version tracked in the upstream self-hosted compose (checked 2026-06-20).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: supabase
  labels:
    app.kubernetes.io/name: gotrue
    app.kubernetes.io/part-of: supabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gotrue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotrue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: gotrue
          image: supabase/gotrue:v2.189.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9999
          env:
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: GOTRUE_API_PORT
              value: "9999"
            - name: GOTRUE_DB_DRIVER
              value: "postgres"
            # The DB URL points at pg-plotbudget (CNPG). Must target the `auth` schema search path.
            - name: GOTRUE_DB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-core
                  key: DB_PLOTBUDGET_URL
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supabase-core
                  key: JWT_SECRET
            # OAuth (re-registered on self-hosted GoTrue — see README).
            - name: GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: supabase-auth, key: GOTRUE_GOOGLE_CLIENT_ID }
            - name: GOTRUE_EXTERNAL_GOOGLE_SECRET
              valueFrom:
                secretKeyRef: { name: supabase-auth, key: GOTRUE_GOOGLE_SECRET }
            - name: GOTRUE_EXTERNAL_APPLE_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: supabase-auth, key: GOTRUE_APPLE_CLIENT_ID }
            - name: GOTRUE_EXTERNAL_APPLE_SECRET
              valueFrom:
                secretKeyRef: { name: supabase-auth, key: GOTRUE_APPLE_SECRET }
            # Email-hook HMAC secret shared with the send-resend-email function.
            - name: GOTRUE_HOOK_SEND_EMAIL_SECRETS
              valueFrom:
                secretKeyRef: { name: supabase-auth, key: SEND_EMAIL_HOOK_SECRET }
          envFrom:
            - configMapRef:
                name: supabase-config # SITE_URL, API_EXTERNAL_URL, GOTRUE_* flags, hook URI, redirect URIs
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: supabase
  labels:
    app.kubernetes.io/name: gotrue
spec:
  selector:
    app.kubernetes.io/name: gotrue
  ports:
    - name: http
      port: 9999
      targetPort: http
