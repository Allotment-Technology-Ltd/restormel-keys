# Realtime — narrow PlotBudget use: 2 postgres_changes subscriptions (live avatar update,
# grocery/shopping sync) (full-migration-plan §B). Listens to logical replication on the
# pg-plotbudget CNPG cluster. CNPG must run with wal_level=logical for postgres_changes
# (flagged in the README extensions/roles audit gap).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime
  namespace: supabase
  labels:
    app.kubernetes.io/name: realtime
    app.kubernetes.io/part-of: supabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realtime
    spec:
      containers:
        - name: realtime
          image: supabase/realtime:v2.102.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: supabase-config, key: REALTIME_DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: supabase-config, key: REALTIME_DB_PORT }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: supabase-config, key: REALTIME_DB_NAME }
            # DB_USER/DB_PASSWORD + ENC/SECRET keys derive from the core secret; the full conn
            # URL (with creds) is DB_PLOTBUDGET_URL. Realtime reads discrete vars, so the
            # apply-time wiring splits the URL into DB_USER/DB_PASSWORD via a small init or an
            # additional ExternalSecret key — documented in the README (apply prerequisites).
            - name: DB_USER
              value: "supabase_admin" # role lives in pg-plotbudget; password via secret below
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supabase-core
                  key: DB_PLOTBUDGET_URL # README: replace with a discrete REALTIME_DB_PASSWORD key
            - name: DB_ENC_KEY
              valueFrom:
                secretKeyRef: { name: supabase-core, key: JWT_SECRET }
            - name: API_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: supabase-core, key: JWT_SECRET }
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef: { name: supabase-core, key: SERVICE_ROLE_KEY }
            - name: ERL_AFLAGS
              value: "-proto_dist inet_tcp"
            - name: DNS_NODES
              value: "''"
            - name: RLIMIT_NOFILE
              value: "10000"
            - name: APP_NAME
              value: "realtime"
            - name: SEED_SELF_HOST
              value: "true"
            - name: RUN_JANITOR
              value: "true"
          resources:
            requests: { cpu: "50m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
  namespace: supabase
  labels:
    app.kubernetes.io/name: realtime
spec:
  selector:
    app.kubernetes.io/name: realtime
  ports:
    - name: http
      port: 4000
      targetPort: http
