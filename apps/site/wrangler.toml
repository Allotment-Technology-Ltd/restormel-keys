# Restormel site — static marketing + Starlight docs.
# Two deploy paths:
# 1) Workers (Git-connected): build then `npx wrangler deploy` — uses [assets] + worker.js.
# 2) Pages (classic): `npx wrangler pages deploy dist --project-name=restormel-site`.

name = "restormel-site"
compatibility_date = "2024-01-01"

# Worker entry (required when using [assets] so non-asset requests are handled)
main = "worker.js"

# Static assets from Astro build (used by `wrangler deploy` for Workers Git flow)
[assets]
directory = "./dist"
binding = "ASSETS"
