<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="640" viewBox="0 0 2400 640" fill="none" role="img" aria-labelledby="ltitle ldesc">
  <title id="ltitle">Restormel lockup</title>
  <desc id="ldesc">Restormel wordmark with concentric routing mark on a dark rounded panel.</desc>
  <!-- Scaled 8/3× from restormel-lockup-dark.svg (900×240); innermost square is filled kernel -->
  <rect width="2400" height="640" rx="64" fill="#070B12"/>
  <g transform="translate(170.6666667, 128) scale(2.857142857)">
    <rect x="0" y="0" width="112" height="112" fill="none" stroke="#C9F7D5" stroke-width="2.1"/>
    <rect x="16" y="16" width="80" height="80" fill="none" stroke="#C9F7D5" stroke-width="2.1"/>
    <rect x="32" y="32" width="48" height="48" fill="none" stroke="#C9F7D5" stroke-width="2.1"/>
    <rect x="48" y="48" width="16" height="16" fill="#C9F7D5" stroke="none"/>
  </g>
  <text x="597.3333333" y="277.3333333" fill="#E8EDF3" font-size="138.6666667" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="600">Restormel</text>
</svg>
