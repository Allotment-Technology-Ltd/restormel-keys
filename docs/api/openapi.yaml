# Restormel Keys Cloud API — OpenAPI 3.0
# Use this spec in the Zuplo Developer Portal (import or paste) so the portal shows API docs.
# Canonical runbook: docs/runbooks/zuplo-setup.md (§5, Launch readiness §6).

openapi: 3.0.3
info:
  title: Restormel Keys API
  version: 1.0.0
  description: |
    API for managing projects and API keys. Call through the Zuplo gateway with a consumer API key.
    Authentication is required for all endpoints (API key in Authorization header).

servers:
  - url: https://restormel-keys-gateway-main-{env}.zuplo.app
    variables:
      env:
        default: bc13eba

security:
  - apiKey: []

paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [System]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: keys-dashboard }

  /api/projects:
    get:
      summary: List projects
      operationId: listProjects
      tags: [Projects]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      summary: Create project
      operationId: createProject
      tags: [Projects]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: Project display name }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Project" }

  /api/projects/{id}:
    get:
      summary: Get project
      operationId: getProject
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Project" }
        "404":
          description: Not found
    patch:
      summary: Update project
      operationId: updateProject
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          description: Not found
    delete:
      summary: Delete project
      operationId: deleteProject
      tags: [Projects]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          description: Not found

  /api/projects/{id}/keys:
    get:
      summary: List API keys for project
      operationId: listProjectKeys
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of key metadata (prefix/hash only; raw key never returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/KeyInfo" }
        "404":
          description: Not found
    post:
      summary: Create API key
      operationId: createApiKey
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Key created; raw key returned once in response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rawKey: { type: string, description: "Shown only once; store securely" }
                      keyPrefix: { type: string }
        "404":
          description: Not found
    delete:
      summary: Revoke API key
      operationId: deleteApiKey
      tags: [Keys]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keyId: { type: string, description: Key ID to revoke }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          description: Not found

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Consumer API key (issued by Zuplo). Send as Authorization Bearer token. Do not log or expose the key.
  schemas:
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    KeyInfo:
      type: object
      description: Key metadata only (prefix or hash); raw key never in list
      properties:
        keyPrefix: { type: string }
        keyId: { type: string }
        createdAt: { type: string, format: date-time }
