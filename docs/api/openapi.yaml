        - gatewayKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Field-level policy diff

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Consumer API key (issued by Zuplo). Send as Authorization Bearer token. Do not log or expose the key.
    gatewayKey:
      type: http
      scheme: bearer
      bearerFormat: Gateway Key
      description: |
        Gateway Key (`rk_...`) for Dashboard API calls (resolve, routes/steps, policies, **GET** project models index, catalog, etc.).
        Send as `Authorization: Bearer <key>`. Server-side only. **Not** valid on Zuplo control-plane paths that expect a consumer key (`zpka_...`).
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: |
            Machine-readable code. Resolve examples: `unauthorized`, `no_route`, `route_unpublished`, `route_disabled`,
            `policy_blocked`, `no_key_available`, `resolve_incomplete`, `publish_validation_failed`.
        message: { type: string }
        userMessage: { type: string, description: Operator hint for some 422 errors }
        detail: { type: string }
        routeId: { type: string, description: Present when the error refers to a specific route }
        violations:
          type: array
          description: Policy violations when `error` is `policy_blocked`
          items:
            type: object
            additionalProperties: true
    ResolveStepChainEntry:
      type: object
      properties:
        stepId: { type: string }
        orderIndex: { type: integer }
        providerType: { type: string, nullable: true }
        modelId: { type: string, nullable: true }
        enabled: { type: boolean }
        selected: { type: boolean }
    RoutePublishFieldError:
      type: object
      properties:
        stepId: { type: string }
        orderIndex: { type: integer }
        field: { type: string }
        message: { type: string }
    RouteResolveMetadata:
      type: object
      description: Route fields returned on successful resolve (`contractVersion` 2026-03-26+)
      properties:
        id: { type: string }
        environmentId: { type: string }
        workload: { type: string, nullable: true }
        stage: { type: string, nullable: true }
        enabled: { type: boolean, nullable: true }
        version: { type: integer, nullable: true }
        publishedVersion: { type: integer, nullable: true }
    RouteListEntry:
      allOf:
        - type: object
          properties:
            id: { type: string }
            projectId: { type: string }
            environmentId: { type: string }
            name: { type: string }
            description: { type: string, nullable: true }
            defaultModelId: { type: string, nullable: true }
            billingMode: { type: string, nullable: true }
            routeMode: { type: string, nullable: true }
            stage: { type: string, nullable: true }
            workload: { type: string, nullable: true }
            enabled: { type: boolean, nullable: true }
            version: { type: integer, nullable: true }
            publishedVersion: { type: integer, nullable: true }
            status: { type: string }
            createdAt: { type: integer }
            updatedAt: { type: integer }
        - type: object
          properties:
            isPublished: { type: boolean, description: True when `version === publishedVersion` }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    KeyInfo:
      type: object
      description: Key metadata only (prefix or hash); raw key never in list
      properties:
        keyPrefix: { type: string }
        keyId: { type: string }
        createdAt: { type: string, format: date-time }

    RouteStep:
      type: object
      properties:
        id: { type: string }
        routeId: { type: string }
        orderIndex: { type: integer, minimum: 0 }
        providerPreference:
          type: string
          enum: [openai, anthropic, google, openrouter, vercel, portkey, voyage]
        modelId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        fallbackOn:
          type: string
          enum: [error, rate_limit, no_key, policy_block, any]
        switchCriteria:
          type: object
          nullable: true
          additionalProperties: true
        retryPolicy:
          type: object
          nullable: true
          additionalProperties: true
        costPolicy:
          type: object
          nullable: true
          additionalProperties: true
        notes: { type: string, nullable: true }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RouteStepCreate:
      type: object
      required: [orderIndex, providerPreference]
      properties:
        orderIndex: { type: integer, minimum: 0 }
        providerPreference:
          type: string
          enum: [openai, anthropic, google, openrouter, vercel, portkey, voyage]
        modelId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        fallbackOn:
          type: string
          enum: [error, rate_limit, no_key, policy_block, any]
        switchCriteria:
          type: object
          nullable: true
          additionalProperties: true
        retryPolicy:
          type: object
          nullable: true
          additionalProperties: true
        costPolicy:
          type: object
          nullable: true
          additionalProperties: true
        notes: { type: string, nullable: true }
        enabled: { type: boolean, default: true }

    RouteStepPatch:
      type: object
      properties:
        orderIndex: { type: integer, minimum: 0 }
        providerPreference:
          type: string
          enum: [openai, anthropic, google, openrouter, vercel, portkey, voyage]
        modelId: { type: string, nullable: true }
        label: { type: string, nullable: true }
        fallbackOn:
          type: string
          enum: [error, rate_limit, no_key, policy_block, any]
        switchCriteria:
          type: object
          nullable: true
          additionalProperties: true
        retryPolicy:
          type: object
          nullable: true
          additionalProperties: true
        costPolicy:
          type: object
          nullable: true
          additionalProperties: true
        notes: { type: string, nullable: true }
        enabled: { type: boolean }
