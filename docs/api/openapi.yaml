components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: Consumer API key (issued by Zuplo). Send as Authorization Bearer token. Do not log or expose the key.
    gatewayKey:
      type: http
      scheme: bearer
      bearerFormat: Gateway Key
      description: |
        Gateway Key (`rk_...`) for Dashboard API calls (resolve, routes/steps, policies, project model index, catalog, etc.).
        Send as `Authorization: Bearer <key>`. Server-side only. **Not** valid on Zuplo control-plane paths that expect a consumer key (`zpka_...`).
  schemas:
    ProjectModelBindingKind:
      type: string
      enum: [execution, registry]
      description: |
        execution — Keys catalog-backed binding (canonical providerType for resolve alignment when present in catalog).
        registry — host merge metadata; providerType/modelId are opaque strings; nested model may be null.
    ProjectModelIndexEntry:
      type: object
      description: One binding in the project model index.
      properties:
        id: { type: string }
        bindingKind: { $ref: "#/components/schemas/ProjectModelBindingKind" }
        providerType:
          type: string
          description: Canonical slug when bindingKind is execution; normalized lowercase slug when registry.
        modelId: { type: string }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        model:
          type: object
          nullable: true
          additionalProperties: true
          description: Catalog row when model id exists in Keys catalog; null for registry or removed catalog rows
    ProjectModelBatchAddRequest:
      type: object
      required: [models]
      properties:
        models:
          type: array
          minItems: 1
          items:
            type: object
            required: [providerType, modelId]
            properties:
              providerType: { type: string }
              modelId: { type: string }
              bindingKind: { $ref: "#/components/schemas/ProjectModelBindingKind", default: execution }
    ProjectModelReplaceRequest:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: object
            required: [providerType, modelId]
            properties:
              providerType: { type: string }
              modelId: { type: string }
              bindingKind: { $ref: "#/components/schemas/ProjectModelBindingKind", default: execution }
              enabled: { type: boolean, default: true }
    ProjectModelsValidationError:
      type: object
      properties:
        error: { type: string, example: project_models_validation_failed }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              field: { type: string }
              code: { type: string }
              message: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: |
            Machine-readable code. Resolve examples: `unauthorized`, `no_route`, `route_unpublished`, `route_disabled`,
            `policy_blocked`, `no_key_available`, `resolve_incomplete`, `publish_validation_failed`,
            `route_step_provider_not_allowed` (route steps: disallowed `providerPreference` slug; body includes `allowed`).
        message: { type: string }
        userMessage: { type: string, description: Operator hint for some 422 errors }
        detail: { type: string }
        routeId: { type: string, description: Present when the error refers to a specific route }
        violations:
          type: array
          description: Policy violations when `error` is `policy_blocked`
          items:
            type: object
            additionalProperties: true
    RouteStepProviderNotAllowedError:
